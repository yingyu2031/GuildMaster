<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公會會員資料登記與修改</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { 
            font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif; 
        }
        .soft-card-shadow {
            box-shadow: 0 20px 40px -12px rgba(217, 119, 6, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-[#FFFDF9] text-amber-950 antialiased selection:bg-amber-200 selection:text-amber-900 min-h-screen flex flex-col justify-between py-8 px-4">

    <main class="max-w-md w-full mx-auto">
        <!-- 頂部標題區 -->
        <div class="text-center mb-6">
            <div id="topBadge" class="inline-block bg-amber-100/80 text-amber-800 border border-amber-200 text-xs font-bold px-3.5 py-1 rounded-full mb-3">
                身分登記
            </div>
            <h1 id="pageMainTitle" class="text-2xl font-black text-amber-950">
                會員資料填寫綁定
            </h1>
            <p id="pageSubTitle" class="text-xs text-amber-900/60 mt-1.5 leading-relaxed">
                完成登記後，即可使用公會各項專屬功能
            </p>
        </div>

        <!-- 主要表單卡片 -->
        <div class="bg-white rounded-[32px] p-6 sm:p-7 border-2 border-amber-200/80 soft-card-shadow relative">
            
            <!-- 上方身分卡片 -->
            <div id="lineProfileCard" class="bg-[#FFF9EE] rounded-2xl p-3.5 border border-amber-200/80 mb-6 flex items-center gap-3">
                <div class="relative">
                    <img id="avatarImg" src="https://api.dicebear.com/7.x/bottts/svg?seed=member" alt="LINE Avatar" class="w-12 h-12 rounded-full border-2 border-white shadow-sm object-cover bg-amber-100">
                    <span class="absolute -bottom-1 -right-1 bg-[#06C755] text-white text-[9px] font-black px-1.5 py-0.2 rounded-full border border-white">LINE</span>
                </div>
                <div class="flex-1 min-w-0 text-left">
                    <div class="flex items-center gap-1.5">
                        <span id="memberDisplayTitle" class="font-black text-base text-amber-950 truncate">讀取中...</span>
                        <span id="badgeVerified" class="hidden text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded-full">已綁定</span>
                    </div>
                    <div class="text-[11px] text-amber-800/60 font-mono truncate mt-0.5" id="lineUid">UID: 讀取中...</div>
                </div>
            </div>

            <!-- 表單內容 -->
            <form id="bindForm" class="space-y-4 text-left">
                
                <!-- 欄位 1：遊戲角色暱稱 -->
                <div>
                    <label class="block text-xs font-bold text-amber-900 mb-1.5">
                        遊戲角色暱稱 <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="gameNickname" required placeholder="例如：甜心小補師" 
                           class="w-full bg-[#FFFDF9] border border-amber-200 rounded-2xl px-4 py-3 text-sm font-bold text-amber-950 placeholder:text-amber-800/30 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition">
                </div>

                <!-- 欄位 2：遊戲職業 -->
                <div>
                    <label class="block text-xs font-bold text-amber-900 mb-1.5">
                        遊戲職業 <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <select id="gameClass" required 
                                class="w-full bg-[#FFFDF9] border border-amber-200 rounded-2xl px-4 py-3 text-sm font-bold text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition appearance-none">
                            <option value="" disabled selected>請選擇職業</option>
                            
                            <optgroup label="劍士系">
                                <option value="騎士領主">騎士領主</option>
                                <option value="聖殿十字軍">聖殿十字軍</option>
                            </optgroup>

                            <optgroup label="魔法師系">
                                <option value="超魔導士">超魔導士</option>
                                <option value="學者（智者）">學者（智者）</option>
                            </optgroup>

                            <optgroup label="弓箭手系">
                                <option value="神射手">神射手</option>
                                <option value="搞笑藝人（詩人）">搞笑藝人（詩人）</option>
                                <option value="冷豔舞姬（舞孃）">冷豔舞姬（舞孃）</option>
                            </optgroup>

                            <optgroup label="盜賊系">
                                <option value="十字刺客">十字刺客</option>
                                <option value="神行（神偷）">神行（神偷）</option>
                            </optgroup>

                            <optgroup label="服事系">
                                <option value="神官（大主教）">神官（大主教）</option>
                                <option value="武術宗師">武術宗師</option>
                            </optgroup>

                            <optgroup label="商人系">
                                <option value="神工匠">神工匠</option>
                                <option value="創造者（鍊金術士）">創造者（鍊金術士）</option>
                            </optgroup>

                            <option value="其他">其他</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-xs text-amber-700">
                            ▼
                        </div>
                    </div>
                </div>

                <!-- 欄位 3：LINE 顯示暱稱 -->
                <div>
                    <label class="block text-xs font-bold text-amber-900 mb-1.5">
                        LINE 顯示暱稱 <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="manualLineName" required placeholder="例如：Wendy / Chloe" 
                           class="w-full bg-[#FFFDF9] border border-amber-200 rounded-2xl px-4 py-3 text-sm font-bold text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition">
                </div>

                <!-- 單一隱私開關：開放查詢 -->
                <div class="pt-2 border-t border-amber-100/80">
                    <label class="flex items-center justify-between p-3 rounded-2xl bg-[#FFFDF9] border border-amber-200/80 cursor-pointer hover:bg-amber-50/50 transition">
                        <div class="pr-2">
                            <div class="text-xs font-bold text-amber-950">開放查詢</div>
                            <div class="text-[10px] text-amber-800/60 mt-0.5">開啟後，公會成員可於成員名冊查詢您的資料</div>
                        </div>
                        <div class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggleAllowSearch" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
                        </div>
                    </label>
                </div>

                <!-- 提交按鈕 -->
                <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-amber-300/50 hover:shadow-xl transition-all duration-200 flex items-center justify-center cursor-pointer mt-4">
                    確認送出
                </button>
            </form>

            <!-- 彈窗 1：送出前核對確認視窗 -->
            <div id="confirmModal" class="hidden absolute inset-0 bg-stone-900/40 backdrop-blur-sm rounded-[32px] p-6 flex flex-col items-center justify-center text-center z-30">
                <div class="bg-white rounded-3xl p-5 w-full max-w-[300px] border-2 border-amber-200 shadow-2xl">
                    <h3 class="text-base font-black text-amber-950 mb-1">確認資料無誤？</h3>
                    <p class="text-[11px] text-amber-800/70 mb-4">請確認以下資訊是否正確：</p>
                    
                    <div class="bg-[#FFF9EE] rounded-xl p-3 text-left text-xs space-y-1.5 mb-4 border border-amber-100 text-amber-950">
                        <div><span class="text-amber-700 font-bold">遊戲暱稱：</span><span id="previewNick" class="font-bold">-</span></div>
                        <div><span class="text-amber-700 font-bold">遊戲職業：</span><span id="previewClass" class="font-bold">-</span></div>
                        <div><span class="text-amber-700 font-bold">LINE 暱稱：</span><span id="previewLine">-</span></div>
                        <div class="pt-1 border-t border-amber-200/60 text-[11px]">
                            <div><span class="text-amber-700 font-bold">開放查詢：</span><span id="previewAllowSearch" class="font-medium">-</span></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="closeConfirmModal()" class="bg-stone-100 hover:bg-stone-200 text-stone-600 text-xs font-bold py-2.5 rounded-xl transition cursor-pointer">
                            返回修改
                        </button>
                        <button onclick="executeFinalSubmit()" id="modalConfirmBtn" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-md cursor-pointer">
                            確認送出
                        </button>
                    </div>
                </div>
            </div>

            <!-- 彈窗 2：成功提示視窗 -->
            <div id="successModal" class="hidden absolute inset-0 bg-white/95 backdrop-blur-sm rounded-[32px] p-6 flex flex-col items-center justify-center text-center z-40">
                <h3 id="successTitle" class="text-lg font-black text-amber-950 mb-1">資料送出成功</h3>
                <p id="successDesc" class="text-xs text-amber-900/70 max-w-[240px] leading-relaxed mb-4">
                    審核通過後，小幫手將會在 LINE 聊天室通知您
                </p>
                <div class="bg-[#FFFDF9] border border-amber-200 rounded-xl p-3 w-full text-left text-xs space-y-1.5 mb-5 text-amber-950">
                    <div><span class="text-amber-700 font-bold">遊戲暱稱：</span><span id="resGameNick">-</span></div>
                    <div><span class="text-amber-700 font-bold">遊戲職業：</span><span id="resGameClass">-</span></div>
                    <div><span class="text-amber-700 font-bold">LINE 暱稱：</span><span id="resLineName">-</span></div>
                    <div class="pt-1 border-t border-amber-200/60 text-[11px]">
                        <div><span class="text-amber-700 font-bold">開放查詢：</span><span id="resAllowSearch" class="font-medium">-</span></div>
                    </div>
                </div>
                <button onclick="closeLiffWindow()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-6 py-2.5 rounded-full shadow-md transition cursor-pointer">
                    關閉回到聊天室
                </button>
            </div>

        </div>

        <p class="text-[11px] text-amber-800/40 text-center mt-6">
            &copy; 2026 GuildMaster
        </p>
    </main>

    <!-- LIFF 與表單處理邏輯 -->
    <script>
        const MY_LIFF_ID = "2011659633-OPPcInzb"; // 若有 LIFF ID 請填入此處
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxIRwxVfiCxwKwBi4MTz3C4mzBLg-76SCnp301IGb1_Pdlbi2bdOtOZK3bdXY0TeInTyg/exec";

        // 預設測試 UID (與試算表中的 UID 完全一致)
        let currentUser = {
            userId: "U_demo_member",
            displayName: "",
            pictureUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=member",
            gameNickname: "",
            gameClass: "",
            allowSearch: true,
            isRegistered: false
        };

        let pendingPayload = null;

        window.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryUid = urlParams.get('uid') || urlParams.get('userId');
            const queryName = urlParams.get('name') || urlParams.get('displayName');

            if (MY_LIFF_ID && typeof liff !== 'undefined') {
                try {
                    await liff.init({ liffId: MY_LIFF_ID });
                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        currentUser.userId = profile.userId;
                        currentUser.displayName = profile.displayName;
                        currentUser.pictureUrl = profile.pictureUrl || currentUser.pictureUrl;
                    } else {
                        liff.login();
                        return;
                    }
                } catch (err) {
                    console.warn("LIFF 初始化異常:", err);
                }
            } else if (queryUid || queryName) {
                if (queryUid) currentUser.userId = queryUid;
                if (queryName) currentUser.displayName = decodeURIComponent(queryName);
            }

            checkExistingMemberData(currentUser.userId);
        });

        async function checkExistingMemberData(uid) {
            document.getElementById('memberDisplayTitle').textContent = "讀取資料中...";

            // 向 Google Sheet (GAS) 查詢是否為老會員
            if (GAS_API_URL) {
                try {
                    const response = await fetch(`${GAS_API_URL}?uid=${encodeURIComponent(uid)}`);
                    const result = await response.json();
                    if (result.status === "found") {
                        currentUser.gameNickname = result.gameNickname || "";
                        currentUser.gameClass = result.gameClass || "";
                        currentUser.displayName = result.lineDisplayName || currentUser.displayName;
                        currentUser.allowSearch = (result.allowSearch === true || result.allowSearch === "Y" || result.allowSearch === "開啟");
                        currentUser.isRegistered = true;
                        applyEditModeUI(currentUser);
                        return;
                    }
                } catch (err) {
                    console.warn("向 Google Sheet 查詢失敗，改用本地快取備援", err);
                }
            }

            // 本地快取備援
            const stored = localStorage.getItem("member_" + uid);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    currentUser.gameNickname = data.gameNickname || "";
                    currentUser.gameClass = data.gameClass || "";
                    currentUser.displayName = data.lineDisplayName || currentUser.displayName;
                    currentUser.allowSearch = data.allowSearch !== false && data.allowSearch !== "關閉";
                    currentUser.isRegistered = true;

                    applyEditModeUI(currentUser);
                    return;
                } catch (e) {
                    console.error("解析會員資料錯誤", e);
                }
            }

            applyNewMemberUI();
        }

        function applyEditModeUI(data) {
            document.getElementById('topBadge').textContent = "資料修改";
            document.getElementById('pageMainTitle').textContent = "會員資料修改";
            document.getElementById('pageSubTitle').textContent = "記得隨時更新你的遊戲角色資訊喔！";
            
            document.getElementById('memberDisplayTitle').textContent = data.gameNickname;
            document.getElementById('badgeVerified').classList.remove('hidden');

            document.getElementById('gameNickname').value = data.gameNickname || "";
            document.getElementById('gameClass').value = data.gameClass || "";
            if (data.displayName || data.lineDisplayName) {
                document.getElementById('manualLineName').value = data.displayName || data.lineDisplayName;
            }

            document.getElementById('toggleAllowSearch').checked = data.allowSearch !== false;

            document.getElementById('submitBtn').textContent = "儲存修改資料";
            document.getElementById('successTitle').textContent = "資料修改成功！";
            document.getElementById('successDesc').textContent = "最新資訊已為您更新完成～";

            updateProfileCard();
        }

        function applyNewMemberUI() {
            document.getElementById('topBadge').textContent = "身分登記";
            document.getElementById('pageMainTitle').textContent = "會員資料填寫綁定";
            document.getElementById('pageSubTitle').textContent = "完成登記後，即可使用公會各項專屬功能";

            document.getElementById('memberDisplayTitle').textContent = "新會員";
            document.getElementById('badgeVerified').classList.add('hidden');
            document.getElementById('submitBtn').textContent = "確認送出";

            if (currentUser.displayName) {
                document.getElementById('manualLineName').value = currentUser.displayName;
            }

            document.getElementById('toggleAllowSearch').checked = true;

            document.getElementById('successTitle').textContent = "綁定資料已送出";
            document.getElementById('successDesc').textContent = "審核通過後，小幫手將會在 LINE 聊天室通知您";

            updateProfileCard();
        }

        function updateProfileCard() {
            document.getElementById('lineUid').textContent = 'UID: ' + currentUser.userId.substring(0, 16) + '...';
            if (currentUser.pictureUrl) {
                document.getElementById('avatarImg').src = currentUser.pictureUrl;
            }
        }

        document.getElementById('bindForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const gameNick = document.getElementById('gameNickname').value.trim();
            const gameClass = document.getElementById('gameClass').value;
            const lineName = document.getElementById('manualLineName').value.trim();
            const allowSearch = document.getElementById('toggleAllowSearch').checked;

            currentUser.displayName = lineName;

            pendingPayload = {
                lineUserId: currentUser.userId,
                lineDisplayName: lineName,
                linePictureUrl: currentUser.pictureUrl,
                gameNickname: gameNick,
                gameClass: gameClass,
                allowSearch: allowSearch ? "開啟" : "關閉",
                updateTime: new Date().toISOString()
            };

            document.getElementById('previewNick').textContent = gameNick;
            document.getElementById('previewClass').textContent = gameClass;
            document.getElementById('previewLine').textContent = lineName;
            document.getElementById('previewAllowSearch').textContent = allowSearch ? "開啟" : "關閉";

            document.getElementById('confirmModal').classList.remove('hidden');
        });

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
        }

        async function executeFinalSubmit() {
            if (!pendingPayload) return;

            const modalConfirmBtn = document.getElementById('modalConfirmBtn');
            modalConfirmBtn.textContent = "傳送中...";
            modalConfirmBtn.disabled = true;

            // 儲存至本地快取
            localStorage.setItem("member_" + pendingPayload.lineUserId, JSON.stringify(pendingPayload));

            // 同步發送至 Google Sheet (採用標準 Form-Urlencoded 傳送，保證 GAS 100% 能由 e.parameter 解析)
            if (GAS_API_URL) {
                try {
                    const formData = new URLSearchParams();
                    for (const key in pendingPayload) {
                        formData.append(key, pendingPayload[key]);
                    }

                    await fetch(GAS_API_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: formData.toString()
                    });
                } catch (err) {
                    console.error("同步至 Google Sheet 失敗:", err);
                }
            }

            modalConfirmBtn.textContent = "確認送出";
            modalConfirmBtn.disabled = false;
            document.getElementById('confirmModal').classList.add('hidden');

            currentUser.gameNickname = pendingPayload.gameNickname;
            currentUser.gameClass = pendingPayload.gameClass;
            currentUser.displayName = pendingPayload.lineDisplayName;
            currentUser.allowSearch = (pendingPayload.allowSearch === "開啟");
            currentUser.isRegistered = true;
            
            document.getElementById('memberDisplayTitle').textContent = pendingPayload.gameNickname;
            document.getElementById('badgeVerified').classList.remove('hidden');

            document.getElementById('resGameNick').textContent = pendingPayload.gameNickname;
            document.getElementById('resGameClass').textContent = pendingPayload.gameClass;
            document.getElementById('resLineName').textContent = pendingPayload.lineDisplayName;
            document.getElementById('resAllowSearch').textContent = pendingPayload.allowSearch;
            
            if (currentUser.isRegistered) {
                document.getElementById('successTitle').textContent = "資料修改成功！";
                document.getElementById('successDesc').textContent = "最新資訊已為您更新完成～";
            }
            
            document.getElementById('successModal').classList.remove('hidden');
        }

        function closeLiffWindow() {
            if (typeof liff !== 'undefined' && liff.closeWindow) {
                liff.closeWindow();
            } else {
                alert("設定完成，請回到 LINE 聊天室！");
                document.getElementById('successModal').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
