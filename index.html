<script>
        const MY_LIFF_ID = "2011659633-OPPcInzb";
        // 改為指向我們剛剛在 Zeabur 部署成功的 Node.js 後台 API 網域
        const BACKEND_API_URL = "https://guildmaster.zeabur.app";

        let currentUser = {
            userId: "",
            displayName: "",
            pictureUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=member",
            gameNickname: "",
            gameClass: "",
            allowSearch: true,
            accountStatus: "",
            isRegistered: false
        };

        let pendingPayload = null;

        // 改用標準 fetch 向 Node.js 後台查詢會員狀態
        async function queryMemberFromBackend(uid) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch(`${BACKEND_API_URL}/api/members/${encodeURIComponent(uid)}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    return { status: "error", message: `伺服器回應狀態碼: ${response.status}` };
                }

                const data = await response.json();
                return data; // 預期後台會回傳 { status: "found" 或 "not_found", ... }
            } catch (err) {
                if (err.name === 'AbortError') {
                    return { status: "timeout", message: "後台回應超過 15 秒逾時" };
                }
                return { status: "error", message: err.message || "連線後台失敗" };
            }
        }

        window.addEventListener("DOMContentLoaded", async () => {
            localStorage.clear();
            sessionStorage.clear();

            const urlParams = new URLSearchParams(window.location.search);
            const queryUid = urlParams.get('uid') || urlParams.get('userId');
            const queryName = urlParams.get('name') || urlParams.get('displayName');

            let isLiffReady = false;
            let liffErrorDetail = "";

            if (MY_LIFF_ID && typeof liff !== 'undefined') {
                try {
                    await liff.init({ liffId: MY_LIFF_ID });
                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        currentUser.userId = profile.userId;
                        currentUser.displayName = profile.displayName;
                        currentUser.pictureUrl = profile.pictureUrl || currentUser.pictureUrl;
                        isLiffReady = true;
                    } else {
                        liff.login();
                        return;
                    }
                } catch (err) {
                    liffErrorDetail = (err.code ? `[代碼 ${err.code}] ` : "") + (err.message || JSON.stringify(err));
                }
            }

            if (!isLiffReady && queryUid) {
                currentUser.userId = queryUid;
                if (queryName) currentUser.displayName = decodeURIComponent(queryName);
            }

            await verifyAndDisplayView(liffErrorDetail);
        });

        async function verifyAndDisplayView(errorMsg) {
            if (!currentUser.userId) {
                document.getElementById('loadingSpinner').classList.add('hidden');
                document.getElementById('loadingTitle').textContent = "無法辨識 LINE 身分";
                document.getElementById('loadingDesc').textContent = "請確認您是點擊 LINE 官方專用連結開啟";
                
                const errBox = document.getElementById('errorBox');
                const errDetail = document.getElementById('errorDetail');
                errDetail.textContent = errorMsg || "LIFF 未能成功取得 Profile 資料。";
                errBox.classList.remove('hidden');
                return;
            }

            // 向 Node.js 後台查詢
            const result = await queryMemberFromBackend(currentUser.userId);
            
            if (result && (result.status === "timeout" || result.status === "error")) {
                document.getElementById('loadingSpinner').classList.add('hidden');
                document.getElementById('loadingTitle').textContent = "連線後台逾時";
                document.getElementById('loadingDesc').textContent = "伺服器回應較慢，請點擊下方重試";
                
                const errBox = document.getElementById('errorBox');
                const errDetail = document.getElementById('errorDetail');
                errDetail.textContent = `[${result.status}] ${result.message || '請確認網路是否正常'}`;
                errBox.classList.remove('hidden');
                return;
            }

            if (result && result.status === "found") {
                currentUser.gameNickname = result.gameNickname || "";
                currentUser.gameClass = result.gameClass || "";
                currentUser.displayName = result.lineDisplayName || currentUser.displayName;
                currentUser.allowSearch = (result.allowSearch === true || result.allowSearch === "Y");
                currentUser.accountStatus = String(result.accountStatus || "").trim();
                currentUser.isRegistered = true;
            }

            document.getElementById('loadingCard').classList.add('hidden');

            // 狀態分流：
            if (currentUser.isRegistered && currentUser.accountStatus === "待審核") {
                applyPendingReviewUI();
            } else if (currentUser.isRegistered && currentUser.accountStatus === "已審核") {
                const formCard = document.getElementById('mainFormCard');
                formCard.classList.remove('hidden');
                formCard.classList.add('fade-in');
                applyEditModeUI();
            } else {
                const formCard = document.getElementById('mainFormCard');
                formCard.classList.remove('hidden');
                formCard.classList.add('fade-in');
                applyNewMemberUI();
            }
        }

        function applyPendingReviewUI() {
            document.getElementById('topBadge').textContent = "資格審核";
            document.getElementById('topBadge').className = "inline-block bg-amber-100/80 text-amber-800 border border-amber-200 text-xs font-bold px-3.5 py-1 rounded-full mb-3";
            document.getElementById('pageMainTitle').textContent = "入會申請處理中";
            document.getElementById('pageSubTitle').textContent = "幹部正在核對名冊，請稍候";

            document.getElementById('pendingNickname').textContent = currentUser.gameNickname || "-";
            document.getElementById('pendingClass').textContent = currentUser.gameClass || "-";
            document.getElementById('pendingLineName').textContent = currentUser.displayName || "-";
            document.getElementById('pendingAllowSearch').textContent = currentUser.allowSearch ? "開啟" : "關閉";

            const pendingCard = document.getElementById('pendingReviewCard');
            pendingCard.classList.remove('hidden');
            pendingCard.classList.add('fade-in');
        }

        function applyEditModeUI() {
            document.getElementById('topBadge').textContent = "資料修改";
            document.getElementById('pageMainTitle').textContent = "會員資料修改";
            document.getElementById('pageSubTitle').textContent = "記得隨時更新您的遊戲角色資訊喔！";
            
            document.getElementById('memberDisplayTitle').textContent = currentUser.gameNickname || "已審核成員";
            document.getElementById('badgeVerified').classList.remove('hidden');

            document.getElementById('gameNickname').value = currentUser.gameNickname || "";
            document.getElementById('gameClass').value = currentUser.gameClass || "";
            document.getElementById('manualLineName').value = currentUser.displayName || "";
            document.getElementById('toggleAllowSearch').checked = currentUser.allowSearch !== false;

            document.getElementById('submitBtn').textContent = "儲存修改資料";
            document.getElementById('successTitle').textContent = "資料修改成功！";
            document.getElementById('successDesc').textContent = "最新資訊已為您更新完成～";

            updateProfileCard();
        }

        function applyNewMemberUI() {
            document.getElementById('topBadge').textContent = "身分登記";
            document.getElementById('pageMainTitle').textContent = "會員資料填寫綁定";
            document.getElementById('pageSubTitle').textContent = "完成登記後，即可使用公會各項專屬功能";

            document.getElementById('memberDisplayTitle').textContent = "新會員";
            document.getElementById('badgeVerified').classList.add('hidden');
            document.getElementById('submitBtn').textContent = "確認送出";

            document.getElementById('gameNickname').value = "";
            document.getElementById('gameClass').value = "";
            document.getElementById('manualLineName').value = currentUser.displayName || "";
            document.getElementById('toggleAllowSearch').checked = true;

            document.getElementById('successTitle').textContent = "綁定資料已送出";
            document.getElementById('successDesc').textContent = "審核通過後，將會在 LINE 聊天室通知您";

            updateProfileCard();
        }

        function updateProfileCard() {
            const displayUid = currentUser.userId.length > 16 ? currentUser.userId.substring(0, 16) + '...' : currentUser.userId;
            document.getElementById('lineUid').textContent = 'UID: ' + displayUid;
            if (currentUser.pictureUrl) {
                document.getElementById('avatarImg').src = currentUser.pictureUrl;
            }
        }

        document.getElementById('bindForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const gameNick = document.getElementById('gameNickname').value.trim();
            const gameClass = document.getElementById('gameClass').value;
            const lineName = document.getElementById('manualLineName').value.trim();
            const allowSearch = document.getElementById('toggleAllowSearch').checked;

            currentUser.displayName = lineName;

            pendingPayload = {
                lineUserId: currentUser.userId,
                lineDisplayName: lineName,
                linePictureUrl: currentUser.pictureUrl,
                gameNickname: gameNick,
                gameClass: gameClass,
                allowSearch: allowSearch ? "Y" : "N",
                updateTime: new Date().toISOString()
            };

            document.getElementById('previewNick').textContent = gameNick;
            document.getElementById('previewClass').textContent = gameClass;
            document.getElementById('previewLine').textContent = lineName;
            document.getElementById('previewAllowSearch').textContent = allowSearch ? "開啟" : "關閉";

            document.getElementById('confirmModal').classList.remove('hidden');
        });

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
        }

        async function executeFinalSubmit() {
            if (!pendingPayload) return;

            const modalConfirmBtn = document.getElementById('modalConfirmBtn');
            modalConfirmBtn.textContent = "傳送中...";
            modalConfirmBtn.disabled = true;

            try {
                // 將資料 POST 到我們的 Node.js 後台 API 寫入 PostgreSQL
                const response = await fetch(`${BACKEND_API_URL}/api/members/bind`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(pendingPayload)
                });

                if (!response.ok) {
                    throw new Error(`送出失敗，狀態碼: ${response.status}`);
                }
            } catch (err) {
                console.error("寫入後台資料庫失敗:", err);
            }

            modalConfirmBtn.textContent = "確認送出";
            modalConfirmBtn.disabled = false;
            document.getElementById('confirmModal').classList.add('hidden');

            currentUser.gameNickname = pendingPayload.gameNickname;
            currentUser.gameClass = pendingPayload.gameClass;
            currentUser.displayName = pendingPayload.lineDisplayName;
            currentUser.allowSearch = (pendingPayload.allowSearch === "Y");
            currentUser.isRegistered = true;
            
            document.getElementById('resGameNick').textContent = pendingPayload.gameNickname;
            document.getElementById('resGameClass').textContent = pendingPayload.gameClass;
            document.getElementById('resLineName').textContent = pendingPayload.lineDisplayName;
            document.getElementById('resAllowSearch').textContent = pendingPayload.allowSearch === "Y" ? "開啟" : "關閉";
            
            document.getElementById('successModal').classList.remove('hidden');
        }

        function closeLiffWindow() {
            if (typeof liff !== 'undefined' && liff.closeWindow) {
                liff.closeWindow();
            } else {
                alert("設定完成，請回到 LINE 聊天室！");
                document.getElementById('successModal').classList.add('hidden');
            }
        }
    </script>
