<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公會戰場主戰名單指揮系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas CDN for exporting image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'NotoSans TC', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .slot-card {
            min-height: 42px;
            transition: all 0.2s ease;
        }
        .slot-card.drag-over {
            background-color: #e0e7ff;
            border-color: #6366f1;
            transform: scale(1.02);
        }
        /* 自定義顏色卡片樣式 */
        .job-tag-刺客 { background-color: #fecaca; color: #991b1b; }
        .job-tag-十字軍 { background-color: #fde68a; color: #92400e; }
        .job-tag-法師 { background-color: #bfdbfe; color: #1e40af; }
        .job-tag-創造者 { background-color: #e9d5ff; color: #6b21a8; }
        .job-tag-補師 { background-color: #bbf7d0; color: #166534; }
        .job-tag-武僧 { background-color: #fed7aa; color: #9a3412; }
        .job-tag-騎士 { background-color: #f3e8ff; color: #581c87; }
        .job-tag-搞笑藝人 { background-color: #fbcfe8; color: #831843; }
        .job-tag-吟遊戲偶 { background-color: #c7d2fe; color: #3730a3; }
        .job-tag-神射手 { background-color: #bae6fd; color: #0369a1; }
        .job-tag-流氓 { background-color: #e5e7eb; color: #374151; }
        .job-tag-煉金 { background-color: #fed7aa; color: #c2410c; }
        .job-tag-詩人 { background-color: #fef08a; color: #854d0e; }

        /* 隱藏捲軸但可滾動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-16">

    <!-- 頂部導航列 -->
    <header class="bg-white shadow-sm sticky top-0 z-30 border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-md">
                        <i class="fa-solid fa-shield-halved text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-gray-800 leading-tight">公會戰場主戰名單指揮系統</h1>
                        <p class="text-xs text-gray-500">手機版最佳化・5人滿編・一鍵出圖</p>
                    </div>
                </div>
                <span class="text-xs font-semibold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full border border-indigo-200">
                    <i class="fa-solid fa-lock mr-1"></i> 5人鎖定版
                </span>
            </div>

            <!-- 操作按鈕工具列 (確保日期長度與其他按鈕齊平美觀) -->
            <div class="grid grid-cols-4 gap-2 pt-1">
                <div class="relative col-span-1">
                    <input type="date" id="roster-date" class="w-full bg-gray-50 border border-gray-300 text-gray-800 text-xs rounded-lg px-2 py-2.5 font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center">
                </div>
                <button onclick="saveCurrentRoster()" class="col-span-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 px-2 rounded-lg shadow-sm flex items-center justify-center gap-1 transition">
                    <i class="fa-solid fa-floppy-disk"></i> 存檔
                </button>
                <button onclick="openHistoryModal()" class="col-span-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-2.5 px-2 rounded-lg border border-gray-300 flex items-center justify-center gap-1 transition">
                    <i class="fa-solid fa-clock-rotate-left"></i> 歷史
                </button>
                <button onclick="openLeaveModal()" class="col-span-1 bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold py-2.5 px-2 rounded-lg border border-amber-300 flex items-center justify-center gap-1 transition">
                    <i class="fa-solid fa-user-slash"></i> 請假(<span id="leave-count">0</span>)
                </button>
            </div>
            
            <div class="w-full">
                <button onclick="exportToImage()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-2.5 px-4 rounded-lg shadow-md flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-image"></i> 一鍵匯出戰術名單圖片
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-4xl mx-auto px-3 py-4 flex flex-col gap-6">

        <!-- 人員搜尋與職業篩選區 -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-users text-indigo-600"></i> 現任人員總表與快速指派
                </h2>
                <span class="text-xs text-gray-400">點擊成員可快速指派至未滿編隊伍</span>
            </div>
            <div class="flex gap-2 mb-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-xs"></i>
                    <input type="text" id="search-input" placeholder="搜尋姓名..." oninput="renderMemberList()" class="w-full bg-gray-50 border border-gray-300 text-xs rounded-lg pl-9 pr-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <select id="job-filter" onchange="renderMemberList()" class="bg-gray-50 border border-gray-300 text-xs rounded-lg px-3 py-2.5 text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="全部">全部職業</option>
                    <option value="刺客">刺客</option>
                    <option value="十字軍">十字軍</option>
                    <option value="法師">法師</option>
                    <option value="創造者">創造者</option>
                    <option value="補師">補師</option>
                    <option value="武僧">武僧</option>
                    <option value="騎士">騎士</option>
                    <option value="搞笑藝人">搞笑藝人</option>
                    <option value="吟遊戲偶">吟遊戲偶</option>
                    <option value="神射手">神射手</option>
                    <option value="流氓">流氓</option>
                    <option value="詩人">詩人</option>
                    <option value="煉金">煉金</option>
                </select>
            </div>
            <!-- 人員列表 (橫向滾動或自適應) -->
            <div id="member-list-container" class="flex flex-wrap gap-1.5 max-h-44 overflow-y-auto p-1 bg-gray-50 rounded-lg border border-gray-100 no-scrollbar">
                <!-- 動態生成成員按鈕 -->
            </div>
        </section>

        <!-- 戰術名單配置區 (截圖呈現區) -->
        <section id="capture-area" class="bg-white rounded-2xl shadow-md border border-gray-200 p-4 flex flex-col gap-4">
            <div class="flex justify-between items-center border-b pb-3">
                <div>
                    <h2 class="text-base font-black text-gray-800 tracking-wide">主戰名單</h2>
                    <p class="text-xs text-gray-500" id="display-date-label">日期：2026-09-24</p>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full border border-indigo-200" id="total-assigned-badge">已配置: 0 / 0</span>
                    <button onclick="addSquad()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> 加隊伍
                    </button>
                    <button onclick="openMergeModal()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1">
                        <i class="fa-solid fa-object-group"></i> 合併團隊
                    </button>
                    <button onclick="resetRoster()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold px-2 py-1.5 rounded-lg border transition" title="重置">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- 合併群組與隊伍網格容器 -->
            <div id="squads-container" class="flex flex-col gap-4">
                <!-- 動態生成隊伍與群組 -->
            </div>

            <!-- 自訂戰術叮嚀與提示框容器 -->
            <div id="notices-container" class="flex flex-col gap-2 pt-2 border-t border-gray-200">
                <!-- 動態產生提示框 -->
            </div>
            
            <div class="flex justify-between items-center pt-2">
                <button onclick="openNoticeModal()" class="text-xs text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1">
                    <i class="fa-solid fa-pen-to-square"></i> 管理戰術叮嚀與提示框
                </button>
                <span class="text-[10px] text-gray-400">公會戰場指揮系統產出</span>
            </div>
        </section>

    </main>

    <!-- 請假管理 Modal -->
    <div id="leave-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-scale">
            <div class="bg-amber-500 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-user-slash"></i> 當天請假人員管理</h3>
                <button onclick="closeLeaveModal()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-4">
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 flex flex-col gap-2">
                    <h4 class="text-xs font-bold text-gray-700">新增請假</h4>
                    <input type="text" id="leave-name" placeholder="請假人員名稱" class="bg-white border border-gray-300 text-xs rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <input type="text" id="leave-job" placeholder="職業 (例: 刺客)" class="bg-white border border-gray-300 text-xs rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <input type="date" id="leave-date-input" class="bg-white border border-gray-300 text-xs rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <button onclick="addLeavePerson()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold py-2 rounded-lg transition">新增</button>
                </div>
                <div class="flex flex-col gap-2" id="leave-list-ui">
                    <!-- 請假列表 -->
                </div>
            </div>
            <div class="bg-gray-50 px-4 py-3 border-t flex justify-end">
                <button onclick="closeLeaveModal()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-lg">完成</button>
            </div>
        </div>
    </div>

    <!-- 戰術叮嚀與提示框管理 Modal -->
    <div id="notice-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-indigo-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-bullhorn"></i> 管理戰術叮嚀與提示框</h3>
                <button onclick="closeNoticeModal()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-4">
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 flex flex-col gap-2">
                    <h4 class="text-xs font-bold text-gray-700">新增提示框</h4>
                    <textarea id="new-notice-text" rows="2" placeholder="輸入提示文字（支援換行）..." class="bg-white border border-gray-300 text-xs rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-600 font-medium">底色選擇：</span>
                        <div class="flex gap-2" id="color-picker-options">
                            <button type="button" onclick="selectNoticeColor('#fecaca', '#991b1b', this)" class="w-6 h-6 rounded-full bg-[#fecaca] border-2 border-red-400 focus:outline-none ring-2 ring-offset-1 ring-red-500" data-bg="#fecaca" data-text="#991b1b"></button>
                            <button type="button" onclick="selectNoticeColor('#fef08a', '#854d0e', this)" class="w-6 h-6 rounded-full bg-[#fef08a] border-2 border-yellow-300 focus:outline-none" data-bg="#fef08a" data-text="#854d0e"></button>
                            <button type="button" onclick="selectNoticeColor('#bfdbfe', '#1e40af', this)" class="w-6 h-6 rounded-full bg-[#bfdbfe] border-2 border-blue-300 focus:outline-none" data-bg="#bfdbfe" data-text="#1e40af"></button>
                            <button type="button" onclick="selectNoticeColor('#fef9c3', '#713f12', this)" class="w-6 h-6 rounded-full bg-[#fef9c3] border-2 border-amber-300 focus:outline-none" data-bg="#fef9c3" data-text="#713f12"></button>
                            <button type="button" onclick="selectNoticeColor('#e9d5ff', '#6b21a8', this)" class="w-6 h-6 rounded-full bg-[#e9d5ff] border-2 border-purple-300 focus:outline-none" data-bg="#e9d5ff" data-text="#6b21a8"></button>
                        </div>
                    </div>
                    <button onclick="addNoticeItem()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-lg transition mt-1">加入提示框</button>
                </div>
                <div class="flex flex-col gap-2" id="notice-list-ui">
                    <!-- 動態提示框清單 -->
                </div>
            </div>
            <div class="bg-gray-50 px-4 py-3 border-t flex justify-end">
                <button onclick="closeNoticeModal()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-lg">完成</button>
            </div>
        </div>
    </div>

    <!-- 合併團隊管理 Modal -->
    <div id="merge-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-purple-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-object-group"></i> 團隊合併與解除</h3>
                <button onclick="closeMergeModal()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-4">
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 flex flex-col gap-2">
                    <h4 class="text-xs font-bold text-gray-700">建立新合併團隊</h4>
                    <input type="text" id="merge-group-name" placeholder="團隊名稱 (例如: 總攻突破部隊)" class="bg-white border border-gray-300 text-xs rounded-lg px-3 py-2 focus:ring-2 focus:ring-purple-500 focus:outline-none">
                    <p class="text-xs text-gray-500 mt-1">請勾選要納入此團隊的小隊：</p>
                    <div id="merge-squad-checkboxes" class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto p-2 bg-white rounded border">
                        <!-- 動態生成小隊選項 -->
                    </div>
                    <button onclick="createMergedGroup()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold py-2 rounded-lg transition mt-1">確認合併</button>
                </div>
                <div class="flex flex-col gap-2">
                    <h4 class="text-xs font-bold text-gray-700">現有合併團隊</h4>
                    <div id="existing-merged-groups-list" class="flex flex-col gap-2">
                        <!-- 現有合併群組 -->
                    </div>
                </div>
            </div>
            <div class="bg-gray-50 px-4 py-3 border-t flex justify-end">
                <button onclick="closeMergeModal()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-lg">完成</button>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄 Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-indigo-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left"></i> 歷史排班紀錄</h3>
                <button onclick="closeHistoryModal()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-2" id="history-list-container">
                <!-- 動態載入歷史紀錄 -->
            </div>
            <div class="bg-gray-50 px-4 py-3 border-t flex justify-end">
                <button onclick="closeHistoryModal()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <!-- 核心 JavaScript 邏輯 -->

            { id: 1, name: "隊伍 1(左路)", members: ["非禮勿言", "小嫩少", "蔚藍Azure", "那一籠蝦餃", "。倫倫爸、"] },
            { id: 2, name: "隊伍 2(左路)", members: ["小象哇哇", "比目魚", "羅伊先森", "赤伶、(賢)", "阿畢達布"] },
            { id: 3, name: "隊伍 3(左路)", members: ["馬東三", "至尊寶ゞ", "小桃祇(賢)", "得成芭芭拉", "妳好正喔"] },
            { id: 4, name: "隊伍 4(右路)", members: ["小小蚊子", "白轻尘", "丹尼老詩", "李至安(賢)", "大风起兮云飞扬"] },
            { id: 5, name: "隊伍 5(右路)", members: ["農地山泉", "Kaixxxxx(賢)", "翔翔、", "乃喵。", "紓紓"] },
            { id: 6, name: "隊伍 6(右路)", members: ["李知恩的狗", "Vergil", "解惑大師", "大猷", "丶七彩小皮球"] },
            { id: 7, name: "隊伍 7(左路)", members: ["亞力三小", "泷宇", "千咲", "文老爹", "大寶寶"] },
            { id: 8, name: "隊伍 8(中路)", members: ["唏唏、", "Fe", "夜闌人靜", "微風小弟", "梵音"] },
            { id: 9, name: "隊伍 9(中路)", members: ["顧景幾翔", "琴華願殤", "TwiZee", "學長的藍波大人", "blackpinkyoo"] },
            { id: 10, name: "隊伍 10(中路)", members: ["玖寶", "主線太長好累憂", "荷魯斯", "就是睡不飽", "ebi"] },
            { id: 11, name: "中路(支援隊-1)", members: ["閃閃閃", "神之準", "克蘿伊", "大庫十八年", "阿鈣想吸吸"] },
            { id: 12, name: "右路(支援隊-2)", members: ["神冰月", "晚風、", "宮本寶藏", "大蛋佑佑", "包手檳榔"] }
        ];

        // 預設合併群組
        let mergedGroups = [];

        // 預設提示框
        let notices = [
            { id: 1, text: "【！！晚到者請隊長(隊友)去聯絡失聯隊友(隊長)，晚上 8點30分請自主性組隊！！】", bg: "#fecaca", textCol: "#991b1b" },
            { id: 2, text: "召集隊：4、5、6、7\n支援隊*2", bg: "#fef08a", textCol: "#854d0e" },
            { id: 3, text: "二塔存活：主推線\n剩內塔：主防守", bg: "#bfdbfe", textCol: "#1e40af" },
            { id: 4, text: "未召集隊：\n我方二塔還在，主推線\n剩內塔，主防守", bg: "#fef9c3", textCol: "#713f12" }
        ];

        // 請假名單
        let leaveList = [
            { name: "哥哥呵呵", job: "十字軍", date: "2026-09-22" },
            { name: "透水男孩", job: "刺客", date: "2026-09-22" },
            { name: "馬東三", job: "煉金", date: "2026-09-22" },
            { name: "DARK熊", job: "詩人", date: "2026-09-22" }
        ];

        let selectedNoticeBg = "#fecaca";
        let selectedNoticeTextCol = "#991b1b";

        // 初始化
        window.onload = function() {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('roster-date').value = todayStr;
            document.getElementById('leave-date-input').value = todayStr;
            document.getElementById('display-date-label').innerText = `日期：${todayStr}`;
            
            document.getElementById('roster-date').addEventListener('change', function(e) {
                document.getElementById('display-date-label').innerText = `日期：${e.target.value}`;
            });

            renderMemberList();
            renderSquads();
            renderNotices();
            updateLeaveCount();
        };

        // 取得人員職業
        function getMemberJob(name) {
            const found = masterMembers.find(m => m.name === name);
            return found ? found.job : '其他';
        }

        // 檢查人員是否已被分配
        function isAssigned(name) {
            for (let s of squads) {
                if (s.members.includes(name)) return true;
            }
            return false;
        }

        // 檢查人員是否請假
        function isLeave(name) {
            return leaveList.some(l => l.name === name);
        }

        // 渲染左側人員清單與搜尋
        function renderMemberList() {
            const container = document.getElementById('member-list-container');
            const search = document.getElementById('search-input').value.trim();
            const filterJob = document.getElementById('job-filter').value;
            
            container.innerHTML = '';

            const filtered = masterMembers.filter(m => {
                const matchSearch = m.name.includes(search);
                const matchJob = filterJob === '全部' || m.job === filterJob;
                return matchSearch && matchJob;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-xs text-gray-400 p-2 w-full text-center">沒有符合條件的成員</div>`;
                return;
            }

            filtered.forEach(m => {
                const assigned = isAssigned(m.name);
                const leave = isLeave(m.name);
                
                const btn = document.createElement('div');
                let statusClass = `job-tag-${m.job} cursor-pointer`;
                if (assigned) statusClass = 'bg-gray-200 text-gray-400 line-through cursor-not-allowed';
                if (leave) statusClass = 'bg-amber-100 text-amber-500 opacity-60 cursor-not-allowed';

                btn.className = `text-xs px-2.5 py-1 rounded-md font-medium transition flex items-center gap-1 shadow-xs ${statusClass}`;
                btn.innerHTML = `<span class="opacity-75 text-[10px]">${m.job}</span><span>${m.name}</span>`;
                
                if (!assigned && !leave) {
                    btn.onclick = () => assignToFirstAvailable(m.name);
                    // 支援拖拉開始
                    btn.draggable = true;
                    btn.ondragstart = (e) => {
                        e.dataTransfer.setData('text/plain', m.name);
                    };
                }
                container.appendChild(btn);
            });
        }

        // 點擊未指派人員自動放入第一個未滿5人的隊伍
        function assignToFirstAvailable(name) {
            for (let squad of squads) {
                if (squad.members.length < 5) {
                    squad.members.push(name);
                    renderSquads();
                    renderMemberList();
                    return;
                }
            }
            alert('所有隊伍皆已達 5 人滿編！');
        }

        // 渲染右側 5 人滿編隊伍
        function renderSquads() {
            const container = document.getElementById('squads-container');
            container.innerHTML = '';

            let totalAssigned = 0;
            let totalCapacity = squads.length * 5;

            // 繪製群組與隊伍
            let renderedSquadIds = new Set();

            // 先渲染合併群組
            mergedGroups.forEach((group, gIndex) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'border-2 border-purple-400 bg-purple-50/30 rounded-xl p-3 flex flex-col gap-3 relative';
                
                let groupHeader = `
                    <div class="flex justify-between items-center bg-purple-100 px-3 py-1.5 rounded-lg border border-purple-200">
                        <span class="text-xs font-black text-purple-900"><i class="fa-solid fa-object-group mr-1"></i> ${group.name}</span>
                        <button onclick="removeMergedGroup(${gIndex})" class="text-purple-700 hover:text-red-600 text-xs font-bold"><i class="fa-solid fa-xmark"></i> 解除團隊</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                `;
                
                let squadGridHtml = '';
                group.squadIds.forEach(sId => {
                    renderedSquadIds.add(sId);
                    const squad = squads.find(s => s.id === sId);
                    if (squad) {
                        squadGridHtml += createSquadCardHtml(squad);
                        totalAssigned += squad.members.length;
                    }
                });

                groupDiv.innerHTML = groupHeader + squadGridHtml + `</div>`;
                container.appendChild(groupDiv);
            });

            // 渲染未被合併的獨立隊伍
            const independentGrid = document.createElement('div');
            independentGrid.className = 'grid grid-cols-2 sm:grid-cols-3 gap-2';
            
            let hasIndependent = false;
            squads.forEach(squad => {
                if (!renderedSquadIds.has(squad.id)) {
                    hasIndependent = true;
                    const card = document.createElement('div');
                    card.innerHTML = createSquadCardHtml(squad);
                    independentGrid.appendChild(card.firstElementChild);
                    totalAssigned += squad.members.length;
                }
            });

            if (hasIndependent || mergedGroups.length === 0) {
                container.appendChild(independentGrid);
            }

            document.getElementById('total-assigned-badge').innerText = `已配置: ${totalAssigned} / ${totalCapacity}`;
        }

        // 產生單一小隊卡片 HTML
        function createSquadCardHtml(squad) {
            let slotsHtml = '';
            for (let i = 0; i < 5; i++) {
                const member = squad.members[i];
                if (member) {
                    const job = getMemberJob(member);
                    slotsHtml += `
                        <div class="flex items-center justify-between bg-white px-2 py-1.5 rounded border border-gray-200 shadow-2xs text-xs">
                            <div class="flex items-center gap-1.5 truncate">
                                <span class="job-tag-${job} text-[9px] px-1 py-0.5 rounded font-bold shrink-0">${job}</span>
                                <span class="font-bold text-gray-800 truncate">${member}</span>
                            </div>
                            <button onclick="removeMemberFromSquad(${squad.id}, ${i})" class="text-gray-400 hover:text-red-500 p-0.5 shrink-0"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `;
                } else {
                    slotsHtml += `
                        <div class="slot-card flex items-center justify-center bg-gray-50 border border-dashed border-gray-300 rounded text-[11px] text-gray-400 py-1"
                             ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToSquad(event, ${squad.id})">
                            + 空位 (上限5人)
                        </div>
                    `;
                }
            }

            return `
                <div class="bg-white border border-gray-300 rounded-xl shadow-xs overflow-hidden flex flex-col">
                    <div class="bg-gray-100 px-2.5 py-1.5 border-b border-gray-200 flex justify-between items-center">
                        <input type="text" value="${squad.name}" onchange="updateSquadName(${squad.id}, this.value)" class="bg-transparent text-xs font-black text-gray-800 w-28 focus:outline-none focus:bg-white px-1 rounded">
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] font-bold ${squad.members.length === 5 ? 'text-emerald-600' : 'text-amber-600'}">${squad.members.length}/5</span>
                            <button onclick="deleteSquad(${squad.id})" class="text-gray-400 hover:text-red-600 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div class="p-2 flex flex-col gap-1.5 bg-gray-50/50"
                         ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToSquad(event, ${squad.id})">
                        ${slotsHtml}
                    </div>
                </div>
            `;
        }

        // 拖拉事件處理
        function allowDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function removeDropStyle(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function dropToSquad(e, squadId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const memberName = e.dataTransfer.getData('text/plain');
            if (!memberName) return;

            const squad = squads.find(s => s.id === squadId);
            if (squad && squad.members.length < 5 && !isAssigned(memberName)) {
                squad.members.push(memberName);
                renderSquads();
                renderMemberList();
            } else if (squad && squad.members.length >= 5) {
                alert('該隊伍已滿 5 人！');
            }
        }

        // 移除隊伍成員
        function removeMemberFromSquad(squadId, memberIndex) {
            const squad = squads.find(s => s.id === squadId);
            if (squad) {
                squad.members.splice(memberIndex, 1);
                renderSquads();
                renderMemberList();
            }
        }

        // 更新隊伍名稱
        function updateSquadName(squadId, newName) {
            const squad = squads.find(s => s.id === squadId);
            if (squad) squad.name = newName;
        }

        // 新增隊伍
        function addSquad() {
            const newId = squads.length > 0 ? Math.max(...squads.map(s => s.id)) + 1 : 1;
            squads.push({ id: newId, name: `隊伍 ${newId}`, members: [] });
            renderSquads();
        }

        // 刪除隊伍
        function deleteSquad(squadId) {
            squads = squads.filter(s => s.id !== squadId);
            // 同時檢查並清理合併群組中的 ID
            mergedGroups.forEach(g => {
                g.squadIds = g.squadIds.filter(id => id !== squadId);
            });
            mergedGroups = mergedGroups.filter(g => g.squadIds.length > 0);
            renderSquads();
            renderMemberList();
        }

        // 重置所有配置
        function resetRoster() {
            if (confirm('確定要清空所有隊伍配置嗎？')) {
                squads.forEach(s => s.members = []);
                mergedGroups = [];
                renderSquads();
                renderMemberList();
            }
        }

        // 渲染提示框
        function renderNotices() {
            const container = document.getElementById('notices-container');
            container.innerHTML = '';
            notices.forEach(n => {
                const div = document.createElement('div');
                div.className = 'p-3 rounded-xl border text-xs font-bold text-center whitespace-pre-line shadow-xs';
                div.style.backgroundColor = n.bg;
                div.style.color = n.textCol;
                div.style.borderColor = n.textCol + '44';
                div.innerText = n.text;
                container.appendChild(div);
            });
        }

        // 戰術提示框 Modal 管理
        function openNoticeModal() {
            document.getElementById('notice-modal').classList.remove('hidden');
            renderNoticeListUI();
        }
        function closeNoticeModal() {
            document.getElementById('notice-modal').classList.add('hidden');
            renderNotices();
        }

        function selectNoticeColor(bg, textCol, btn) {
            selectedNoticeBg = bg;
            selectedNoticeTextCol = textCol;
            document.querySelectorAll('#color-picker-options button').forEach(b => {
                b.classList.remove('ring-2', 'ring-offset-1', 'ring-indigo-500');
            });
            btn.classList.add('ring-2', 'ring-offset-1', 'ring-indigo-500');
        }

        function addNoticeItem() {
            const text = document.getElementById('new-notice-text').value.trim();
            if (!text) return;
            const newId = notices.length > 0 ? Math.max(...notices.map(n => n.id)) + 1 : 1;
            notices.push({ id: newId, text: text, bg: selectedNoticeBg, textCol: selectedNoticeTextCol });
            document.getElementById('new-notice-text').value = '';
            renderNoticeListUI();
        }

        function deleteNoticeItem(id) {
            notices = notices.filter(n => n.id !== id);
            renderNoticeListUI();
        }

        function renderNoticeListUI() {
            const listUi = document.getElementById('notice-list-ui');
            listUi.innerHTML = '';
            notices.forEach(n => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-2 rounded-lg border text-xs';
                item.style.backgroundColor = n.bg;
                item.style.color = n.textCol;
                item.innerHTML = `
                    <span class="whitespace-pre-line flex-1 font-bold">${n.text}</span>
                    <button onclick="deleteNoticeItem(${n.id})" class="text-red-600 hover:text-red-800 p-1"><i class="fa-solid fa-trash-can"></i></button>
                `;
                listUi.appendChild(item);
            });
        }

        // 合併團隊 Modal 管理
        function openMergeModal() {
            document.getElementById('merge-modal').classList.remove('hidden');
            renderMergeCheckboxes();
            renderExistingMergedGroups();
        }
        function closeMergeModal() {
            document.getElementById('merge-modal').classList.add('hidden');
            renderSquads();
        }

        function renderMergeCheckboxes() {
            const container = document.getElementById('merge-squad-checkboxes');
            container.innerHTML = '';
            // 只列出尚未被納入任何合併群組的小隊
            const assignedSquadIds = new Set();
            mergedGroups.forEach(g => g.squadIds.forEach(id => assignedSquadIds.add(id)));

            squads.forEach(s => {
                if (!assignedSquadIds.has(s.id)) {
                    const label = document.createElement('label');
                    label.className = 'flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer';
                    label.innerHTML = `<input type="checkbox" name="merge-squad-cb" value="${s.id}" class="rounded text-purple-600 focus:ring-purple-500"> ${s.name}`;
                    container.appendChild(label);
                }
            });
        }

        function createMergedGroup() {
            const groupName = document.getElementById('merge-group-name').value.trim();
            const checkboxes = document.querySelectorAll('input[name="merge-squad-cb"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.value));

            if (!groupName) {
                alert('請輸入團隊名稱！');
                return;
            }
            if (selectedIds.length === 0) {
                alert('請至少勾選一個小隊！');
                return;
            }

            mergedGroups.push({ name: groupName, squadIds: selectedIds });
            document.getElementById('merge-group-name').value = '';
            renderMergeCheckboxes();
            renderExistingMergedGroups();
        }

        function removeMergedGroup(index) {
            mergedGroups.splice(index, 1);
            renderMergeCheckboxes();
            renderExistingMergedGroups();
            renderSquads();
        }

        function renderExistingMergedGroups() {
            const container = document.getElementById('existing-merged-groups-list');
            container.innerHTML = '';
            if (mergedGroups.length === 0) {
                container.innerHTML = `<span class="text-xs text-gray-400">目前無合併團隊</span>`;
                return;
            }
            mergedGroups.forEach((g, idx) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-2 bg-purple-50 border border-purple-200 rounded-lg text-xs font-bold text-purple-900';
                div.innerHTML = `
                    <span>${g.name} (包含 ${g.squadIds.length} 個小隊)</span>
                    <button onclick="removeMergedGroup(${idx})" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(div);
            });
        }

        // 請假管理 Modal
        function openLeaveModal() {
            document.getElementById('leave-modal').classList.remove('hidden');
            renderLeaveListUI();
        }
        function closeLeaveModal() {
            document.getElementById('leave-modal').classList.add('hidden');
            updateLeaveCount();
            renderMemberList();
        }

        function addLeavePerson() {
            const name = document.getElementById('leave-name').value.trim();
            const job = document.getElementById('leave-job').value.trim();
            const date = document.getElementById('leave-date-input').value;
            if (!name || !job || !date) {
                alert('請完整填寫請假資訊！');
                return;
            }
            leaveList.push({ name, job, date });
            document.getElementById('leave-name').value = '';
            document.getElementById('leave-job').value = '';
            renderLeaveListUI();
        }

        function deleteLeavePerson(index) {
            leaveList.splice(index, 1);
            renderLeaveListUI();
        }

        function renderLeaveListUI() {
            const container = document.getElementById('leave-list-ui');
            container.innerHTML = '';
            leaveList.forEach((l, idx) => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-2.5 bg-white border border-amber-200 rounded-xl text-xs shadow-2xs';
                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="job-tag-${l.job} px-2 py-0.5 rounded font-bold">${l.job}</span>
                        <span class="font-bold text-gray-800">${l.name}</span>
                        <span class="text-gray-400 text-[10px]"><i class="fa-regular fa-calendar"></i> ${l.date}</span>
                    </div>
                    <button onclick="deleteLeavePerson(${idx})" class="text-gray-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(item);
            });
            updateLeaveCount();
        }

        function updateLeaveCount() {
            document.getElementById('leave-count').innerText = leaveList.length;
        }

        // 日期存檔與歷史紀錄
        function saveCurrentRoster() {
            const dateVal = document.getElementById('roster-date').value;
            if (!dateVal) {
                alert('請選擇存檔日期！');
                return;
            }
            const dataToSave = {
                date: dateVal,
                squads: JSON.parse(JSON.stringify(squads)),
                mergedGroups: JSON.parse(JSON.stringify(mergedGroups)),
                notices: JSON.parse(JSON.stringify(notices))
            };

            let history = JSON.parse(localStorage.getItem('guild_roster_history') || '[]');
            // 檢查是否已有該日期存檔，若有則覆蓋
            history = history.filter(h => h.date !== dateVal);
            history.push(dataToSave);
            localStorage.setItem('guild_roster_history', JSON.stringify(history));
            alert(`成功儲存 ${dateVal} 的戰術名單！`);
        }

        function openHistoryModal() {
            document.getElementById('history-modal').classList.remove('hidden');
            renderHistoryList();
        }
        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function renderHistoryList() {
            const container = document.getElementById('history-list-container');
            container.innerHTML = '';
            let history = JSON.parse(localStorage.getItem('guild_roster_history') || '[]');
            
            if (history.length === 0) {
                container.innerHTML = `<div class="text-xs text-gray-400 text-center py-4">尚無歷史存檔紀錄</div>`;
                return;
            }

            history.sort((a, b) => new Date(b.date) - new Date(a.date));

            history.forEach(h => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-3 bg-gray-50 border border-gray-200 rounded-xl hover:bg-indigo-50 transition';
                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa-regular fa-calendar-days text-indigo-600 text-base"></i>
                        <span class="text-xs font-bold text-gray-800">${h.date} 戰術名單</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="loadHistory('${h.date}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition">載入</button>
                        <button onclick="deleteHistory('${h.date}')" class="bg-gray-200 hover:bg-red-100 text-gray-600 hover:text-red-600 text-xs px-2.5 py-1.5 rounded-lg transition"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function loadHistory(dateStr) {
            let history = JSON.parse(localStorage.getItem('guild_roster_history') || '[]');
            const found = history.find(h => h.date === dateStr);
            if (found) {
                squads = JSON.parse(JSON.stringify(found.squads));
                mergedGroups = found.mergedGroups ? JSON.parse(JSON.stringify(found.mergedGroups)) : [];
                notices = found.notices ? JSON.parse(JSON.stringify(found.notices)) : notices;
                document.getElementById('roster-date').value = found.date;
                document.getElementById('display-date-label').innerText = `日期：${found.date}`;
                renderSquads();
                renderNotices();
                renderMemberList();
                closeHistoryModal();
                alert(`已成功載入 ${found.date} 的歷史名單！`);
            }
        }

        function deleteHistory(dateStr) {
            if (confirm(`確定要刪除 ${dateStr} 的歷史紀錄嗎？`)) {
                let history = JSON.parse(localStorage.getItem('guild_roster_history') || '[]');
                history = history.filter(h => h.date !== dateStr);
                localStorage.setItem('guild_roster_history', JSON.stringify(history));
                renderHistoryList();
            }
        }

        // 一鍵匯出成圖片
        function exportToImage() {
            const captureElement = document.getElementById('capture-area');
            
            // 顯示載入提示
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 正在產生圖片...`;
            btn.disabled = true;

            html2canvas(captureElement, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `公會戰場主戰名單_${document.getElementById('roster-date').value || 'date'}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                btn.innerHTML = originalText;
                btn.disabled = false;
            }).catch(err => {
                console.error(err);
                alert('圖片匯出失敗，請再試一次！');
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
