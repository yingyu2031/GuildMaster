<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuildMaster - 會員名冊查詢</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif; 
        }
        .soft-card-shadow {
            box-shadow: 0 20px 40px -12px rgba(217, 119, 6, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
        }
        .fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#FFFDF9] text-amber-950 antialiased selection:bg-amber-200 selection:text-amber-900 min-h-screen flex flex-col justify-between py-8 px-4">

    <main class="max-w-md w-full mx-auto">
        <!-- 頂部標題區 -->
        <div class="text-center mb-6">
            <div class="inline-block bg-amber-100/80 text-amber-800 border border-amber-200 text-xs font-bold px-3.5 py-1 rounded-full mb-3">
                公會名冊
            </div>
            <h1 class="text-2xl font-black text-amber-950">
                會員公開資料查詢
            </h1>
            <p class="text-xs text-amber-900/60 mt-1.5 leading-relaxed">
                輸入「遊戲角色暱稱」或「LINE 暱稱」進行即時過濾搜尋
            </p>
        </div>

        <!-- 搜尋列卡片 (改為即時輸入搜尋 oninput) -->
        <div class="bg-white rounded-[28px] p-2.5 border-2 border-amber-200/80 soft-card-shadow mb-6">
            <div class="flex items-center gap-2">
                <div class="relative flex-1">
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="輸入角色或 LINE 暱稱搜尋..." 
                           class="w-full bg-[#FFFDF9] border border-amber-200/80 rounded-2xl pl-4 pr-3 py-3 text-sm font-bold text-amber-950 placeholder:text-amber-800/35 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition">
                </div>
            </div>
        </div>

        <!-- 狀態 1：載入中 (Spinner) -->
        <div id="loadingStatus" class="bg-white rounded-[32px] p-8 border-2 border-amber-200/80 soft-card-shadow text-center fade-in mb-6">
            <div class="relative w-12 h-12 mx-auto mb-3">
                <div class="absolute inset-0 rounded-full border-4 border-amber-200 border-t-amber-500 animate-spin"></div>
                <div class="w-full h-full rounded-full flex items-center justify-center text-base">🔍</div>
            </div>
            <p class="text-xs font-bold text-amber-900/80">名冊資料載入中...</p>
        </div>

        <!-- 狀態 2：查無資料 -->
        <div id="emptyStatus" class="hidden bg-white rounded-[32px] p-8 border-2 border-amber-200/80 soft-card-shadow text-center fade-in mb-6">
            <div class="w-14 h-14 bg-amber-50 rounded-full flex items-center justify-center mx-auto mb-3 border border-amber-200 text-2xl">
                🍃
            </div>
            <h3 class="text-sm font-black text-amber-950 mb-1">查無會員資料</h3>
            <p class="text-xs text-amber-800/60 leading-relaxed">
                未找到相符會員，或該會員設定為「未開放查詢」。
            </p>
        </div>

        <!-- 狀態 3：搜尋結果列表 -->
        <div id="resultContainer" class="space-y-4"></div>

        <p class="text-[11px] text-amber-800/40 text-center mt-6">&copy; 2026 GuildMaster</p>
    </main>

    <script>
        // API 部署網址
        const API_URL = "https://script.google.com/macros/s/AKfycbxIRwxVfiCxwKwBi4MTz3C4mzBLg-76SCnp301IGb1_Pdlbi2bdOtOZK3bdXY0TeInTyg/exec";

        // 全域儲存所有會員資料
        let allMembers = [];

        // 頁面載入時先取得全部資料
        async function fetchAllMembers() {
            const loadingBox = document.getElementById('loadingStatus');
            try {
                const response = await fetch(`${API_URL}?action=search&q=`, {
                    method: "GET",
                    redirect: "follow"
                });
                if (!response.ok) throw new Error("網路異常");
                const result = await response.json();
                allMembers = (result && result.data) ? result.data : [];
            } catch (error) {
                console.error("載入會員名冊失敗:", error);
                allMembers = [];
            } finally {
                loadingBox.classList.add('hidden');
                // 預設載入後直接渲染全部或保持空白（這裡預設顯示全部或提示搜尋）
                renderMembers(allMembers);
            }
        }

        // 即時過濾搜尋邏輯
        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!keyword) {
                renderMembers(allMembers);
                return;
            }

            const filtered = allMembers.filter(m => {
                const gameNick = (m.gameNickname || "").toLowerCase();
                const lineName = (m.lineDisplayName || "").toLowerCase();
                return gameNick.includes(keyword) || lineName.includes(keyword);
            });

            renderMembers(filtered);
        }

        // 渲染畫面清單
        function renderMembers(members) {
            const resultBox = document.getElementById('resultContainer');
            const emptyBox = document.getElementById('emptyStatus');
            resultBox.innerHTML = "";

            if (members.length === 0) {
                emptyBox.classList.remove('hidden');
                return;
            } else {
                emptyBox.classList.add('hidden');
            }

            members.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-[32px] p-6 border-2 border-amber-200/80 soft-card-shadow fade-in";

                card.innerHTML = `
                    <div class="flex items-center gap-2 pb-3 border-b border-amber-100 mb-4">
                        <span class="text-xl">🔹</span>
                        <span class="text-base font-black text-amber-950">${m.gameNickname || "冒險者"}</span>
                    </div>

                    <div class="bg-[#FFFDF9] rounded-2xl p-4 border border-amber-200/70 text-sm space-y-2.5 text-amber-950">
                        <div class="flex items-center justify-between">
                            <span class="text-amber-800/80 font-bold text-xs">遊戲職業</span>
                            <span class="font-extrabold text-amber-950">${m.gameClass || "未登記"}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-amber-800/80 font-bold text-xs">LINE 暱稱</span>
                            <span class="font-bold text-amber-950">${m.lineDisplayName || "-"}</span>
                        </div>
                    </div>
                `;
                resultBox.appendChild(card);
            });
        }

        // 網頁一開好就自動抓取資料
        window.addEventListener('DOMContentLoaded', fetchAllMembers);
    </script>
</body>
</html>
