services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: LV
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  guildmaster-app:
    image: node:18-alpine
    container_name: guildmaster-app-1
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm start"
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=postgresql://root:123@db:5432/LV
    depends_on:
      - db
    restart: always

  wanwangee-app:
    image: node:18-alpine
    container_name: wanwangee-app
    working_dir: /app
    volumes:
      - ../Wanwangee:/app
    command: sh -c "npm install && npm start"
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - NODE_ENV=production
      - DATABASE_URL=postgresql://root:123@db:5432/LV
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
