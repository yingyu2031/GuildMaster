cat << 'EOF' > docker-compose.yml
services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: LV
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
EOF
