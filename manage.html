<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>GuildMaster - 幹部管理後台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { 
            font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif; 
        }
        .soft-card-shadow {
            box-shadow: 0 20px 40px -12px rgba(217, 119, 6, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
        }
        .fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#FFFDF9] text-amber-950 antialiased selection:bg-amber-200 selection:text-amber-900 min-h-screen flex flex-col justify-between py-6 px-3 sm:px-4">

    <main class="max-w-lg w-full mx-auto">
        <!-- 頂部標題與幹部身分列 -->
        <div class="flex items-center justify-between mb-5 px-1">
            <div>
                <div class="inline-flex items-center gap-1.5 bg-amber-100 text-amber-900 border border-amber-200/80 text-[11px] font-bold px-3 py-0.5 rounded-full mb-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    幹部管理專用
                </div>
                <h1 class="text-2xl font-black text-amber-950 tracking-tight">
                    公會幹部後台
                </h1>
            </div>
            <button onclick="openMemberModal('create')" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white text-xs font-black px-3.5 py-2.5 rounded-2xl shadow-md shadow-amber-400/30 flex items-center gap-1.5 transition">
                <span>＋</span>
                <span>新增成員</span>
            </button>
        </div>

        <!-- 頁籤切換 (Tab) -->
        <div class="grid grid-cols-3 gap-1.5 p-1.5 bg-amber-100/60 rounded-2xl mb-4 border border-amber-200/50 text-xs font-black">
            <button id="tabBtnPending" onclick="switchTab('pending')" class="py-2 rounded-xl transition flex items-center justify-center gap-1.5 bg-white text-amber-900 shadow-sm">
                <span>待審核</span>
                <span id="badgePendingCount" class="bg-rose-500 text-white text-[10px] px-1.5 py-0.2 rounded-full hidden">0</span>
            </button>
            <button id="tabBtnActive" onclick="switchTab('active')" class="py-2 rounded-xl transition flex items-center justify-center gap-1 text-amber-800/70 hover:text-amber-950">
                <span>現任成員</span>
                <span id="badgeActiveCount" class="text-[11px] opacity-70">(0)</span>
            </button>
            <button id="tabBtnRetired" onclick="switchTab('retired')" class="py-2 rounded-xl transition flex items-center justify-center gap-1 text-amber-800/70 hover:text-amber-950">
                <span>退會封存</span>
                <span id="badgeRetiredCount" class="text-[11px] opacity-70">(0)</span>
            </button>
        </div>

        <!-- 搜尋與快篩工具列 -->
        <div class="bg-white rounded-2xl p-3 border-2 border-amber-200/80 soft-card-shadow mb-4 flex gap-2 items-center">
            <div class="relative flex-1">
                <input type="text" id="searchInput" oninput="renderCurrentList()" placeholder="搜尋角色或 LINE 暱稱..."
                       class="w-full bg-[#FFFDF9] border border-amber-200 rounded-xl pl-8 pr-3 py-2 text-xs font-bold text-amber-950 placeholder:text-amber-800/30 focus:outline-none focus:ring-2 focus:ring-amber-400">
                <span class="absolute left-2.5 top-2.5 text-xs text-amber-700/50">🔍</span>
            </div>
            <select id="classFilter" onchange="renderCurrentList()" class="bg-[#FFFDF9] border border-amber-200 rounded-xl px-2.5 py-2 text-xs font-bold text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-400">
                <option value="">全部職業</option>
                <option value="劍士系">劍士系</option>
                <option value="魔法師系">魔法師系</option>
                <option value="弓箭手系">弓箭手系</option>
                <option value="盜賊系">盜賊系</option>
                <option value="服事系">服事系</option>
                <option value="商人系">商人系</option>
            </select>
        </div>

        <!-- 主要資料卡片列表區 -->
        <div id="listContainer" class="space-y-3 mb-6 min-h-[300px]">
            <!-- 動態注入內容 -->
        </div>

        <p class="text-[11px] text-amber-800/40 text-center mt-6">&copy; 2026 GuildMaster 幹部後台</p>
    </main>

    <!-- 彈窗：新增 / 編輯成員 Modal -->
    <div id="memberModal" class="hidden fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
        <div class="bg-white w-full max-w-md rounded-[32px] p-6 border-2 border-amber-200 soft-card-shadow max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-amber-100 mb-4">
                <h3 id="modalTitle" class="text-base font-black text-amber-950">編輯會員資訊</h3>
                <button onclick="closeMemberModal()" class="text-stone-400 hover:text-stone-600 text-lg font-bold">✕</button>
            </div>

            <form id="memberForm" class="space-y-3.5 text-left text-xs font-bold text-amber-900">
                <input type="hidden" id="formRowIndex">
                <input type="hidden" id="formLineUserId">

                <div>
                    <label class="block mb-1">遊戲角色暱稱 <span class="text-rose-500">*</span></label>
                    <input type="text" id="formGameNick" required placeholder="例如：甜心小補師" 
                           class="w-full bg-[#FFFDF9] border border-amber-200 rounded-xl px-3.5 py-2.5 text-xs font-bold text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>

                <div>
                    <label class="block mb-1">遊戲職業 <span class="text-rose-500">*</span></label>
                    <select id="formGameClass" required class="w-full bg-[#FFFDF9] border border-amber-200 rounded-xl px-3 py-2.5 text-xs font-bold text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-400">
                        <option value="" disabled selected>請選擇職業</option>
                        <optgroup label="劍士系">
                            <option value="騎士領主">騎士領主</option>
                            <option value="聖殿十字軍">聖殿十字軍</option>
                        </optgroup>
                        <optgroup label="魔法師系">
                            <option value="超魔導士">超魔導士</option>
                            <option value="學者（智者）">學者（智者）</option>
                        </optgroup>
                        <optgroup label="弓箭手系">
                            <option value="神射手">神射手</option>
                            <option value="搞笑藝人（詩人）">搞笑藝人（詩人）</option>
                            <option value="冷豔舞姬（舞孃）">冷豔舞姬（舞孃）</option>
                        </optgroup>
                        <optgroup label="盜賊系">
                            <option value="十字刺客">十字刺客</option>
                            <option value="神行（神偷）">神行（神偷）</option>
                        </optgroup>
                        <optgroup label="服事系">
                            <option value="神官（大主教）">神官（大主教）</option>
                            <option value="武術宗師">武術宗師</option>
                        </optgroup>
                        <optgroup label="商人系">
                            <option value="神工匠">神工匠</option>
                            <option value="創造者（鍊金術士）">創造者（鍊金術士）</option>
                        </optgroup>
                        <option value="其他">其他</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1">LINE 顯示暱稱</label>
                        <input type="text" id="formLineName" placeholder="例如：Chloe" 
                               class="w-full bg-[#FFFDF9] border border-amber-200 rounded-xl px-3 py-2.5 text-xs font-bold text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    </div>
                    <div>
                        <label class="block mb-1">公會職位</label>
                        <select id="formGuildRole" class="w-full bg-[#FFFDF9] border border-amber-200 rounded-xl px-3 py-2.5 text-xs font-bold text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-400">
                            <option value="現任">現任</option>
                            <option value="幹部">幹部</option>
                            <option value="副會長">副會長</option>
                            <option value="會長">會長</option>
                            <option value="退會">退會</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1">小隊/組別</label>
                        <input type="text" id="formTeamGroup" placeholder="例如：媽咪團、一隊" 
                               class="w-full bg-[#FFFDF9] border border-amber-200 rounded-xl px-3 py-2.5 text-xs font-bold text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    </div>
                    <div>
                        <label class="block mb-1">帳號狀態</label>
                        <select id="formAccountStatus" class="w-full bg-[#FFFDF9] border border-amber-200 rounded-xl px-3 py-2.5 text-xs font-bold text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-400">
                            <option value="已審核">已審核</option>
                            <option value="待審核">待審核</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2">
                    <label class="flex items-center justify-between p-2.5 rounded-xl bg-[#FFFDF9] border border-amber-200/80 cursor-pointer">
                        <span class="text-xs font-bold text-amber-950">提供查詢</span>
                        <input type="checkbox" id="formAllowSearch" class="accent-amber-500 w-4 h-4 cursor-pointer">
                    </label>
                </div>

                <div class="flex gap-2 pt-3">
                    <button type="button" onclick="closeMemberModal()" class="w-1/3 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold py-2.5 rounded-xl transition">
                        取消
                    </button>
                    <button type="submit" class="flex-1 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold py-2.5 rounded-xl shadow-md transition">
                        儲存變更
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxIRwxVfiCxwKwBi4MTz3C4mzBLg-76SCnp301IGb1_Pdlbi2bdOtOZK3bdXY0TeInTyg/exec";

        // 本地模擬資料 (格式與您的試算表欄位完全對齊)
        let membersData = [
            { rowIndex: 2, lineUserId: "U1001", gameNickname: "超級法神", gameClass: "超魔導士", lineDisplayName: "123", allowSearch: "Y", accountStatus: "已審核", updateTime: "2026-09-18 10:00", guildRole: "現任", teamGroup: "媽咪團" },
            { rowIndex: 3, lineUserId: "U1002", gameNickname: "暗夜殺手", gameClass: "十字刺客", lineDisplayName: "QQQ", allowSearch: "N", accountStatus: "已審核", updateTime: "2026-09-18 11:30", guildRole: "現任", teamGroup: "一線主力" },
            { rowIndex: 4, lineUserId: "U1003", gameNickname: "舞力全開", gameClass: "冷豔舞姬（舞孃）", lineDisplayName: "ABC", allowSearch: "Y", accountStatus: "已審核", updateTime: "2026-09-18 15:20", guildRole: "現任", teamGroup: "" },
            { rowIndex: 5, lineUserId: "U1004", gameNickname: "克蘿伊", gameClass: "冷豔舞姬（舞孃）", lineDisplayName: "Chloe💕", allowSearch: "Y", accountStatus: "待審核", updateTime: "2026-09-19 08:30", guildRole: "退會", teamGroup: "" },
            { rowIndex: 6, lineUserId: "U1005", gameNickname: "鐵拳無敵", gameClass: "武術宗師", lineDisplayName: "Tom", allowSearch: "Y", accountStatus: "待審核", updateTime: "2026-09-19 09:15", guildRole: "", teamGroup: "" }
        ];

        let currentTab = "pending"; // 'pending' | 'active' | 'retired'

        window.addEventListener("DOMContentLoaded", () => {
            updateCounts();
            renderCurrentList();
        });

        function switchTab(tab) {
            currentTab = tab;
            
            const btnPending = document.getElementById('tabBtnPending');
            const btnActive = document.getElementById('tabBtnActive');
            const btnRetired = document.getElementById('tabBtnRetired');

            [btnPending, btnActive, btnRetired].forEach(b => {
                b.className = "py-2 rounded-xl transition flex items-center justify-center gap-1 text-amber-800/70 hover:text-amber-950";
            });

            if (tab === 'pending') {
                btnPending.className = "py-2 rounded-xl transition flex items-center justify-center gap-1.5 bg-white text-amber-900 shadow-sm font-black";
            } else if (tab === 'active') {
                btnActive.className = "py-2 rounded-xl transition flex items-center justify-center gap-1 bg-white text-amber-900 shadow-sm font-black";
            } else {
                btnRetired.className = "py-2 rounded-xl transition flex items-center justify-center gap-1 bg-white text-amber-900 shadow-sm font-black";
            }

            renderCurrentList();
        }

        function updateCounts() {
            const pendingCount = membersData.filter(m => m.accountStatus === "待審核" && m.guildRole !== "退會").length;
            const activeCount = membersData.filter(m => m.accountStatus === "已審核" && m.guildRole !== "退會").length;
            const retiredCount = membersData.filter(m => m.guildRole === "退會").length;

            const badgePending = document.getElementById('badgePendingCount');
            if (pendingCount > 0) {
                badgePending.textContent = pendingCount;
                badgePending.classList.remove('hidden');
            } else {
                badgePending.classList.add('hidden');
            }

            document.getElementById('badgeActiveCount').textContent = `(${activeCount})`;
            document.getElementById('badgeRetiredCount').textContent = `(${retiredCount})`;
        }

        function renderCurrentList() {
            const container = document.getElementById('listContainer');
            container.innerHTML = "";

            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const classFilter = document.getElementById('classFilter').value;

            // 依目前頁籤過濾
            let list = membersData.filter(m => {
                if (currentTab === 'pending') {
                    return m.accountStatus === "待審核" && m.guildRole !== "退會";
                } else if (currentTab === 'active') {
                    return m.accountStatus === "已審核" && m.guildRole !== "退會";
                } else {
                    return m.guildRole === "退會";
                }
            });

            // 搜尋與職業篩選
            list = list.filter(m => {
                const matchKey = (m.gameNickname && m.gameNickname.toLowerCase().includes(keyword)) ||
                                 (m.lineDisplayName && m.lineDisplayName.toLowerCase().includes(keyword));
                const matchClass = !classFilter || (m.gameClass && m.gameClass.includes(classFilter.replace('系', '')));
                return matchKey && matchClass;
            });

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-[28px] p-8 border-2 border-amber-200/60 text-center soft-card-shadow">
                        <div class="text-3xl mb-2">🍃</div>
                        <p class="text-xs font-bold text-amber-900/60">目前查無符合的名單</p>
                    </div>
                `;
                return;
            }

            list.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-4 border-2 border-amber-200/80 soft-card-shadow fade-in text-left";

                if (currentTab === 'pending') {
                    // 待審核卡片版面
                    card.innerHTML = `
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <span class="bg-rose-100 text-rose-800 text-[10px] font-extrabold px-2 py-0.5 rounded-md">申請待審核</span>
                                <h3 class="text-base font-black text-amber-950 mt-1">${m.gameNickname}</h3>
                                <p class="text-xs font-bold text-amber-800/70">${m.gameClass} · LINE: ${m.lineDisplayName}</p>
                            </div>
                            <span class="text-[10px] text-amber-800/50 font-mono">${m.updateTime.split(' ')[0]}</span>
                        </div>
                        <div class="flex items-center gap-2 pt-3 border-t border-amber-100/80 mt-3">
                            <button onclick="approveMember(${m.rowIndex})" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs py-2 rounded-xl shadow-xs transition">
                                ✓ 核准入會
                            </button>
                            <button onclick="openMemberModal('edit', ${m.rowIndex})" class="px-3 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 font-bold text-xs py-2 rounded-xl transition">
                                檢視修改
                            </button>
                        </div>
                    `;
                } else {
                    // 現任或退會名單卡片
                    const isRetired = m.guildRole === "退會";
                    card.innerHTML = `
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <h3 class="text-base font-black text-amber-950">${m.gameNickname}</h3>
                                    <span class="text-[10px] px-2 py-0.5 rounded-md font-extrabold ${isRetired ? 'bg-stone-100 text-stone-600' : 'bg-amber-100 text-amber-800'}">
                                        ${m.guildRole || '成員'}
                                    </span>
                                    ${m.teamGroup ? `<span class="text-[10px] bg-sky-100 text-sky-800 px-1.5 py-0.5 rounded-md font-bold">${m.teamGroup}</span>` : ''}
                                </div>
                                <div class="text-xs text-amber-800/70 font-bold mt-1">
                                    ${m.gameClass} · LINE: ${m.lineDisplayName}
                                </div>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="openMemberModal('edit', ${m.rowIndex})" class="bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 text-xs font-bold px-2.5 py-1.5 rounded-xl transition">
                                    編輯
                                </button>
                                ${!isRetired ? `
                                    <button onclick="markAsRetired(${m.rowIndex})" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold px-2.5 py-1.5 rounded-xl transition">
                                        退會
                                    </button>
                                ` : `
                                    <button onclick="restoreMember(${m.rowIndex})" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-bold px-2.5 py-1.5 rounded-xl transition">
                                        復權
                                    </button>
                                `}
                            </div>
                        </div>
                    `;
                }

                container.appendChild(card);
            });
        }

        // 快捷核准入會
        function approveMember(rowIndex) {
            const member = membersData.find(m => m.rowIndex === rowIndex);
            if (!member) return;

            if (confirm(`確定核准【${member.gameNickname}】加入公會嗎？`)) {
                member.accountStatus = "已審核";
                member.guildRole = "現任";
                updateCounts();
                renderCurrentList();
                // 串接 GAS: sendGasUpdate({ action: "adminUpdate", ...member });
            }
        }

        // 標記退會
        function markAsRetired(rowIndex) {
            const member = membersData.find(m => m.rowIndex === rowIndex);
            if (!member) return;

            if (confirm(`確定要將【${member.gameNickname}】標記為退會嗎？\n退會後將無法登入填寫請假。`)) {
                member.guildRole = "退會";
                updateCounts();
                renderCurrentList();
                // 串接 GAS: sendGasUpdate({ action: "adminUpdate", ...member });
            }
        }

        // 退會復權
        function restoreMember(rowIndex) {
            const member = membersData.find(m => m.rowIndex === rowIndex);
            if (!member) return;

            if (confirm(`確定恢復【${member.gameNickname}】的現任會員資格嗎？`)) {
                member.guildRole = "現任";
                member.accountStatus = "已審核";
                updateCounts();
                renderCurrentList();
            }
        }

        // 開啟 Modal (新增/編輯共用)
        function openMemberModal(mode, rowIndex = null) {
            const modal = document.getElementById('memberModal');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('memberForm');
            form.reset();

            if (mode === 'create') {
                title.textContent = "手動新增會員";
                document.getElementById('formRowIndex').value = "";
                document.getElementById('formAccountStatus').value = "已審核";
                document.getElementById('formGuildRole').value = "現任";
                document.getElementById('formAllowSearch').checked = true;
            } else {
                title.textContent = "編輯成員資料";
                const member = membersData.find(m => m.rowIndex === rowIndex);
                if (!member) return;

                document.getElementById('formRowIndex').value = member.rowIndex;
                document.getElementById('formLineUserId').value = member.lineUserId || "";
                document.getElementById('formGameNick').value = member.gameNickname || "";
                document.getElementById('formGameClass').value = member.gameClass || "";
                document.getElementById('formLineName').value = member.lineDisplayName || "";
                document.getElementById('formGuildRole').value = member.guildRole || "現任";
                document.getElementById('formTeamGroup').value = member.teamGroup || "";
                document.getElementById('formAccountStatus').value = member.accountStatus || "已審核";
                document.getElementById('formAllowSearch').checked = (member.allowSearch === "Y" || member.allowSearch === true);
            }

            modal.classList.remove('hidden');
        }

        function closeMemberModal() {
            document.getElementById('memberModal').classList.add('hidden');
        }

        // 表單送出處理
        document.getElementById('memberForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const rowIndexVal = document.getElementById('formRowIndex').value;
            const newPayload = {
                gameNickname: document.getElementById('formGameNick').value.trim(),
                gameClass: document.getElementById('formGameClass').value,
                lineDisplayName: document.getElementById('formLineName').value.trim(),
                guildRole: document.getElementById('formGuildRole').value,
                teamGroup: document.getElementById('formTeamGroup').value.trim(),
                accountStatus: document.getElementById('formAccountStatus').value,
                allowSearch: document.getElementById('formAllowSearch').checked ? "Y" : "N",
                updateTime: new Date().toISOString().split('T')[0]
            };

            if (rowIndexVal) {
                // 編輯更新
                const target = membersData.find(m => m.rowIndex === parseInt(rowIndexVal));
                if (target) Object.assign(target, newPayload);
            } else {
                // 手動新增
                newPayload.rowIndex = Date.now();
                newPayload.lineUserId = "MANUAL_" + Math.floor(Math.random()*1000);
                membersData.unshift(newPayload);
            }

            closeMemberModal();
            updateCounts();
            renderCurrentList();
        });
    </script>
</body>
