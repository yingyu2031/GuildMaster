<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>GuildMaster - 幹部管理中心</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body { 
    font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif; 
}
.soft-sky-shadow {
    box-shadow: 0 16px 32px -8px rgba(14, 165, 233, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
}
.fade-in { 
    animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}
input[type="date"], input[type="time"], select {
    -webkit-appearance: none;
    appearance: none;
    min-height: 40px;
    height: 40px;
    line-height: 40px;
    box-sizing: border-box;
}
</style>
</head>
<body class="bg-[#F0F9FF] text-slate-800 antialiased selection:bg-sky-200 selection:text-sky-900 min-h-screen flex flex-col justify-between py-6 px-3 sm:px-4">

<main class="max-w-lg w-full mx-auto">
    <!-- 頂部標題區 -->
    <div class="text-center mb-5 pt-1">
        <div id="topBadge" class="inline-block bg-sky-100 text-sky-800 text-xs font-black px-4 py-1 rounded-full mb-2.5 border border-sky-200/80">
            幹部專用
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight mb-1.5">後台管理中心</h1>
        <p class="text-[13px] font-bold text-slate-500">公會事務、成員審核與活動出勤統整</p>
    </div>

    <!-- 幹部登入小卡 -->
    <div class="bg-white border-2 border-sky-200/80 rounded-2xl p-3.5 mb-5 flex items-center gap-3.5 soft-sky-shadow text-left">
        <div class="relative shrink-0">
            <img id="adminAvatar" src="https://static.line-scdn.net/li-profile-resource/public/default_profile.png" 
                 alt="Avatar" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-xs bg-sky-100">
            <span class="absolute -bottom-1 -right-1 bg-[#06C755] text-white text-[9px] font-black px-1 py-0.2 rounded-full border border-white leading-tight">
                LINE
            </span>
        </div>

        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
                <span id="adminNickName" class="text-base font-black text-slate-900 truncate">讀取中...</span>
                <span class="bg-sky-100 text-sky-800 text-[11px] font-black px-2 py-0.5 rounded-full border border-sky-200 shrink-0">
                    幹部
                </span>
            </div>
            <div id="adminClass" class="text-xs font-bold text-slate-600 truncate mt-0.5">
                身分驗證中
            </div>
        </div>
    </div>

    <!-- 4 大主頁籤列 -->
    <div class="bg-sky-500 rounded-t-2xl px-2 pt-3 flex items-end gap-1 select-none overflow-x-auto">
        <button id="mainTabMembers" onclick="switchMainSection('members')" 
                class="bg-white text-sky-900 font-black px-3.5 py-2.5 rounded-t-xl text-xs flex items-center gap-1 transition-all relative top-[1px] shadow-sm whitespace-nowrap cursor-pointer">
            <span>會員名冊</span>
            <span id="badgePendingCount" class="bg-rose-500 text-white text-[10px] px-1.5 py-0.2 rounded-full hidden">0</span>
        </button>
        <button id="mainTabLeaves" onclick="switchMainSection('leaves')" 
                class="text-sky-100 hover:text-white font-bold px-3.5 py-2 text-xs rounded-t-xl transition-all whitespace-nowrap flex items-center gap-1 cursor-pointer">
            <span>請假紀錄</span>
            <span id="badgeMainTodayLeave" class="bg-rose-500 text-white text-[10px] px-1.5 py-0.2 rounded-full hidden">0</span>
        </button>
        <button id="mainTabEvents" onclick="switchMainSection('events')" 
                class="text-sky-100 hover:text-white font-bold px-3.5 py-2 text-xs rounded-t-xl transition-all whitespace-nowrap cursor-pointer">
            <span>活動列表</span>
        </button>
        <button id="mainTabSettings" onclick="switchMainSection('settings')" 
                class="text-sky-100 hover:text-white font-bold px-3.5 py-2 text-xs rounded-t-xl transition-all whitespace-nowrap cursor-pointer">
            <span>其他設定</span>
        </button>
    </div>

    <!-- 主體內容卡片 -->
    <div class="bg-white rounded-b-2xl p-4 sm:p-5 border-2 border-t-0 border-sky-200/80 soft-sky-shadow mb-6">

        <!-- 區塊 1：會員名冊 (完整原始穩定版) -->
        <section id="sectionMembers" class="space-y-4">
            <div class="grid grid-cols-4 gap-1 p-1 bg-sky-50 rounded-xl border border-sky-100 text-xs font-bold">
                <button id="subTabPending" onclick="switchMemberSubTab('pending')" class="py-1.5 rounded-lg bg-white text-sky-900 shadow-xs font-black cursor-pointer">待審核</button>
                <button id="subTabActive" onclick="switchMemberSubTab('active')" class="py-1.5 rounded-lg text-slate-500 hover:text-slate-800 cursor-pointer">現任成員</button>
                <button id="subTabGroups" onclick="switchMemberSubTab('groups')" class="py-1.5 rounded-lg text-slate-500 hover:text-slate-800 cursor-pointer">團體速查</button>
                <button id="subTabRetired" onclick="switchMemberSubTab('retired')" class="py-1.5 rounded-lg text-slate-500 hover:text-slate-800 cursor-pointer">退會封存</button>
            </div>

            <!-- 第一行：搜尋角色與職業篩選 -->
            <div class="flex gap-2 items-center">
                <div class="relative flex-1 min-w-0">
                    <input type="text" id="memberSearchInput" oninput="handleMemberSearchInput()" placeholder="搜尋角色或 LINE 暱稱..."
                           class="w-full h-[40px] bg-[#F8FAFC] border border-sky-200 rounded-xl px-3 text-xs font-bold text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition box-border">
                </div>
                <select id="memberClassFilter" onchange="renderMembersList()" class="h-[40px] leading-[40px] bg-[#F8FAFC] border border-sky-200 rounded-xl px-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition box-border shrink-0 cursor-pointer">
                </select>
            </div>

            <div id="activeMemberActionRow" class="hidden flex items-center justify-between px-1">
                <span id="activeMemberCountText" class="text-xs font-black text-sky-900">共 0 名會員</span>
                <button onclick="openMemberModal('create')" class="bg-sky-500 hover:bg-sky-600 active:scale-95 text-white text-xs font-black px-3 py-1.5 rounded-xl shadow-xs transition cursor-pointer">
                    + 新增會員
                </button>
            </div>

            <div id="groupToolBar" class="hidden space-y-2">
                <div class="flex items-center justify-between">
                    <div class="flex gap-1 bg-sky-50/80 p-1 rounded-xl border border-sky-100">
                        <button id="groupTabActive" onclick="switchGroupSubTab('active')" class="px-2.5 py-1 text-xs font-black rounded-lg bg-white text-sky-900 shadow-xs cursor-pointer">活躍團體</button>
                        <button id="groupTabArchived" onclick="switchGroupSubTab('archived')" class="px-2.5 py-1 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 cursor-pointer">封存團體</button>
                    </div>
                    <button onclick="openCreateGroupModal()" class="bg-sky-500 hover:bg-sky-600 active:scale-95 text-white text-xs font-black px-3 py-1.5 rounded-xl shadow-xs transition cursor-pointer">
                        + 新增團體
                    </button>
                </div>
            </div>

            <div id="memberListContainer" class="space-y-3 min-h-[260px]"></div>
        </section>

        <!-- 區塊 2：請假紀錄 -->
        <section id="sectionLeaves" class="hidden space-y-4"></section>
        <!-- 區塊 3：活動列表 -->
        <section id="sectionEvents" class="hidden space-y-4"></section>
        <!-- 區塊 4：其他設定 -->
        <section id="sectionSettings" class="hidden space-y-4"></section>

    </div>

    <p class="text-[11px] text-slate-400 text-center">&copy; 2026 GuildMaster 幹部後台</p>
</main>

<!-- 彈窗 1：成員 新增/編輯 Modal -->

            </div>
            <div>

                <select id="formGameClass" required class="w-full h-[40px] leading-[40px] bg-[#F8FAFC] border border-sky-200 rounded-xl px-3 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-sky-400 cursor-pointer">
                </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>

                    <input type="text" id="formLineName" class="w-full bg-[#F8FAFC] border border-sky-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-900">

                <div>

                </div>
                <div>
                    <label class="block mb-1 text-slate-800">審核狀態</label>
                    <select id="formAccountStatus" class="w-full h-[40px] leading-[40px] bg-[#F8FAFC] border border-sky-200 rounded-xl px-3 text-xs font-bold text-slate-900 cursor-pointer">
                        <option value="已審核">已審核</option>
                        <option value="待審核">待審核</option>
                    </select>
                </div>
            </div>

            <div class="space-y-2 pt-1">
                <label class="flex items-center justify-between p-3 rounded-2xl bg-slate-100 border border-slate-200 opacity-80 cursor-not-allowed">
                    <div>
                        <div class="text-xs font-black text-slate-600">開放查詢 <span class="text-[10px] font-normal text-slate-400">(會員自行設定)</span></div>
                        <div class="text-[10px] text-slate-400 font-normal mt-0.5">是否允許其他會員查詢角色與 LINE 資訊</div>
                    </div>
                    <input type="checkbox" id="formAllowSearch" disabled class="w-5 h-5 accent-sky-500 cursor-not-allowed">
                </label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="flex items-center justify-between p-2.5 rounded-xl bg-[#F8FAFC] border border-sky-100 cursor-pointer">
                        <span class="text-[11px] font-black text-slate-800">已加入 LINE 群</span>
                        <input type="checkbox" id="formJoinedLineGroup" class="w-4 h-4 accent-sky-500 cursor-pointer">
                    </label>
                    <label class="flex items-center justify-between p-2.5 rounded-xl bg-[#F8FAFC] border border-sky-100 cursor-pointer">
                        <span class="text-[11px] font-black text-slate-800">已加入 DC</span>
                        <input type="checkbox" id="formJoinedDc" class="w-4 h-4 accent-sky-500 cursor-pointer">
                    </label>

            </div>

            <!-- 資料異動歷程明細 -->
            <div id="auditLogSection" class="pt-2">
                <div class="flex items-center justify-between mb-1.5">
                    <span class="text-xs font-black text-slate-800">資料異動歷程明細</span>
                    <span id="auditLogCount" class="text-[10px] text-slate-400">共 0 筆紀錄</span>
                </div>
                <div id="auditLogContainer" class="space-y-1.5 max-h-36 overflow-y-auto p-2 bg-[#F8FAFC] border border-sky-100 rounded-xl text-[11px]"></div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-3">
                <button type="button" onclick="closeModal('memberModal')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 rounded-xl transition cursor-pointer">取消</button>
                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-2.5 rounded-xl transition shadow-md shadow-sky-200 cursor-pointer">儲存變更</button>
            </div>

            <div id="deleteMemberBtnWrapper" class="pt-2 border-t border-slate-100">
                <button type="button" onclick="promptDeleteMember()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer">
                    刪除此成員資料
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 彈窗 2：快速新增團體 Modal -->

<!-- 彈窗 6：封存團體確認 Modal (無符號) -->
<div id="archiveGroupConfirmModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
    <div class="bg-white w-full max-w-xs rounded-[28px] p-6 border-2 border-amber-200 soft-sky-shadow text-center">
        <h3 class="text-base font-black text-slate-900 mb-1 mt-2">確認封存團體？</h3>
        <p id="archiveGroupConfirmText" class="text-xs text-slate-500 mb-5">將此團體移至封存區</p>

        <div class="grid grid-cols-2 gap-2">
            <button onclick="closeModal('archiveGroupConfirmModal')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold py-2.5 rounded-xl transition cursor-pointer">取消</button>
            <button onclick="executeArchiveGroup()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-md cursor-pointer">確認封存</button>
        </div>
    </div>
</div>

<script>
    const MY_LIFF_ID = "2011659633-9Km5nhzg";
    const BACKEND_API_URL = "https://guildmaster.zeabur.app";

    let customClassList = [
        "超魔導士", "學者（智者）", "神射手", "搞笑藝人（詩人）", 
        "冷豔舞姬（舞孃）", "騎士領主", "聖殿十字軍", "十字刺客", 
        "神行（神偷）", "神官（大主教）", "武術宗師", "神工匠", "創造者（鍊金術士）"
    ];

    let currentAdminUser = { lineUserId: "", gameNickname: "", gameClass: "", guildRole: "", accountStatus: "" };
    let membersData = [], manuallyArchivedGroups = [];
    let currentMainSection = "members", currentMemberSubTab = "pending", currentGroupSubTab = "active";

    window.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const queryUid = urlParams.get('uid') || urlParams.get('userId');
        let isLiffReady = false;

        if (MY_LIFF_ID && typeof liff !== 'undefined') {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentAdminUser.lineUserId = profile.userId;
                    currentAdminUser.pictureUrl = profile.pictureUrl || "";
                    isLiffReady = true;
                } else { liff.login(); return; }
            } catch (err) { console.error(err); }
        }

        if (!isLiffReady && queryUid) currentAdminUser.lineUserId = queryUid;
        if (!currentAdminUser.lineUserId) { alert("非幹部身分不可使用"); return; }

        try {
            const res = await fetch(`${BACKEND_API_URL}/api/members/${encodeURIComponent(currentAdminUser.lineUserId)}`);
            const data = await res.json();
            if (data.status !== "found" || data.accountStatus !== "已審核" || String(data.guildRole || "").trim() !== "幹部") {
                alert("非幹部身分不可使用");
                if (typeof liff !== 'undefined' && liff.closeWindow) liff.closeWindow();
                return;
            }
            currentAdminUser.gameNickname = data.gameNickname;
            currentAdminUser.gameClass = data.gameClass;
        } catch (err) {
            alert("非幹部身分不可使用");
            return;
        }

        renderAdminIdentity();
        syncAllClassDropdowns();
        await fetchAllBackendData();
        updateMemberCounts();
        renderMembersList();
    });

    async function fetchAllBackendData() {
        try {
            const res = await fetch(`${BACKEND_API_URL}/api/admin/members`);
            if (res.ok) { const d = await res.json(); if (d.status === "success") membersData = d.members; }
        } catch (err) { console.error(err); }
    }

    function renderAdminIdentity() {
        document.getElementById('adminNickName').textContent = currentAdminUser.gameNickname;
        document.getElementById('adminClass').textContent = currentAdminUser.gameClass;
        if (currentAdminUser.pictureUrl) document.getElementById('adminAvatar').src = currentAdminUser.pictureUrl;
    }

    function syncAllClassDropdowns() {
        const filterSelect = document.getElementById('memberClassFilter');
        filterSelect.innerHTML = `<option value="">全部職業</option>`;
        customClassList.forEach(cls => { filterSelect.innerHTML += `<option value="${cls}">${cls}</option>`; });
        const formClassSelect = document.getElementById('formGameClass');
        formClassSelect.innerHTML = `<option value="" disabled selected>請選擇職業</option>`;
        customClassList.forEach(cls => { formClassSelect.innerHTML += `<option value="${cls}">${cls}</option>`; });
    }

    function switchMainSection(section) {
        currentMainSection = section;
        ['members', 'leaves', 'events', 'settings'].forEach(k => {
            document.getElementById('section' + k.charAt(0).toUpperCase() + k.slice(1)).classList.toggle('hidden', k !== section);
            const btn = document.getElementById('mainTab' + k.charAt(0).toUpperCase() + k.slice(1));
            if (btn) {
                btn.className = (k === section) 
                    ? "bg-white text-sky-900 font-black px-3.5 py-2.5 rounded-t-xl text-xs flex items-center gap-1 transition-all relative top-[1px] shadow-sm whitespace-nowrap cursor-pointer" 
                    : "text-sky-100 hover:text-white font-bold px-3.5 py-2 text-xs rounded-t-xl transition-all whitespace-nowrap flex items-center gap-1 cursor-pointer";
            }
        });
    }

    function switchMemberSubTab(tab) {
        currentMemberSubTab = tab;
        ['pending', 'active', 'groups', 'retired'].forEach(k => {
            document.getElementById('subTab' + k.charAt(0).toUpperCase() + k.slice(1)).className = (k === tab) ? "py-1.5 rounded-lg bg-white text-sky-900 shadow-xs font-black cursor-pointer" : "py-1.5 rounded-lg text-slate-500 hover:text-slate-800 cursor-pointer";
        });
        document.getElementById('activeMemberActionRow').classList.toggle('hidden', tab !== 'active');
        document.getElementById('groupToolBar').classList.toggle('hidden', tab !== 'groups');

        if (tab === 'groups') renderGroupOverview();
        else renderMembersList();
    }

    function switchGroupSubTab(subTab) {
        currentGroupSubTab = subTab;
        document.getElementById('groupTabActive').className = (subTab === 'active') ? "px-2.5 py-1 text-xs font-black rounded-lg bg-white text-sky-900 shadow-xs cursor-pointer" : "px-2.5 py-1 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 cursor-pointer";
        document.getElementById('groupTabArchived').className = (subTab === 'archived') ? "px-2.5 py-1 text-xs font-black rounded-lg bg-white text-sky-900 shadow-xs cursor-pointer" : "px-2.5 py-1 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 cursor-pointer";
        renderGroupOverview();
    }

    function handleMemberSearchInput() {
        if (currentMemberSubTab === 'groups') renderGroupOverview();
        else renderMembersList();
    }

    function updateMemberCounts() {
        const pendingCount = membersData.filter(m => m.accountStatus === "待審核" && m.guildRole !== "退會").length;
        const badge = document.getElementById('badgePendingCount');
        if (pendingCount > 0) { badge.textContent = pendingCount; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); }
        document.getElementById('activeMemberCountText').textContent = `共 ${membersData.filter(m => m.accountStatus === "已審核" && m.guildRole !== "退會").length} 名會員`;
    }

    function renderMembersList() {
        const container = document.getElementById('memberListContainer');
        container.innerHTML = "";
        const keyword = document.getElementById('memberSearchInput').value.trim().toLowerCase();
        const classFilter = document.getElementById('memberClassFilter').value;

        let list = membersData.filter(m => {
            if (currentMemberSubTab === 'pending') return m.accountStatus === "待審核" && m.guildRole !== "退會";
            if (currentMemberSubTab === 'active') return m.accountStatus === "已審核" && m.guildRole !== "退會";
            return m.guildRole === "退會";
        }).filter(m => {
            const matchKey = (m.gameNickname && m.gameNickname.toLowerCase().includes(keyword)) || (m.lineDisplayName && m.lineDisplayName.toLowerCase().includes(keyword));
            const matchClass = !classFilter || (m.gameClass === classFilter);
            return matchKey && matchClass;
        });

        if (currentMemberSubTab === 'active') {
            document.getElementById('activeMemberCountText').textContent = `共 ${list.length} 名會員`;
        }

        if (list.length === 0) {
            container.innerHTML = `<div class="bg-[#F8FAFC] rounded-2xl p-6 text-center text-xs text-slate-400 font-bold border border-sky-100">查無相符成員資料</div>`;
            return;
        }

        list.forEach(m => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl p-3.5 border border-sky-100 soft-sky-shadow fade-in text-left";
            
            let roleBadgeClass = "bg-emerald-100 text-emerald-800";
            const role = m.guildRole || '現任';
            if (role === '幹部') roleBadgeClass = "bg-sky-100 text-sky-800";
            if (role === '退會') roleBadgeClass = "bg-slate-100 text-slate-600";

            const lineTag = (m.joinedLineGroup === 'Y') ? '<span class="bg-emerald-50 text-emerald-700 text-[9px] font-bold px-1.5 py-0.2 rounded border border-emerald-100">已入LINE群</span>' : '<span class="bg-slate-50 text-slate-400 text-[9px] px-1.5 py-0.2 rounded border border-slate-100">未入LINE群</span>';
            const dcTag = (m.joinedDc === 'Y') ? '<span class="bg-indigo-50 text-indigo-700 text-[9px] font-bold px-1.5 py-0.2 rounded border border-indigo-100">已入DC</span>' : '<span class="bg-slate-50 text-slate-400 text-[9px] px-1.5 py-0.2 rounded border border-slate-100">未入DC</span>';

            if (currentMemberSubTab === 'pending') {
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="bg-rose-50 text-rose-700 text-[10px] font-black px-2 py-0.5 rounded border border-rose-100">新申請待審</span>
                            <h3 class="text-sm font-black text-slate-900 mt-1">${m.gameNickname}</h3>
                            <p class="text-xs font-bold text-slate-500">${m.gameClass} · LINE: ${m.lineDisplayName || '-'}</p>
                            <div class="flex items-center gap-1 mt-1.5">${lineTag} ${dcTag}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 pt-2.5 border-t border-slate-100 mt-2.5">
                        <button onclick="promptApproveMember('${m.lineUserId}', '${m.gameNickname}')" class="flex-1 bg-sky-500 hover:bg-sky-600 text-white font-bold text-xs py-1.5 rounded-xl transition cursor-pointer">核准入會</button>
                        <button onclick="openMemberModal('edit', '${m.lineUserId}')" class="px-3 bg-sky-50 text-sky-800 border border-sky-200 font-bold text-xs py-1.5 rounded-xl cursor-pointer">編輯</button>
                    </div>
                `;
            } else {
                const isRetired = role === "退會";
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <h3 class="text-sm font-black text-slate-900">${m.gameNickname}</h3>
                                <span class="text-[10px] px-1.5 py-0.5 rounded font-black ${roleBadgeClass}">${role}</span>
                                ${m.teamGroup ? `<span class="text-[10px] bg-slate-100 text-slate-600 px-1 py-0.2 rounded font-bold">${m.teamGroup}</span>` : ''}
                            </div>
                            <div class="text-xs text-slate-500 font-bold mt-0.5">${m.gameClass} · LINE: ${m.lineDisplayName || '-'}</div>
                            <div class="flex items-center gap-1 mt-1.5">${lineTag} ${dcTag}</div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="openMemberModal('edit', '${m.lineUserId}')" class="bg-sky-50 text-sky-800 border border-sky-200 text-xs font-bold px-2 py-1 rounded-lg cursor-pointer">編輯</button>
                            ${!isRetired ? `<button onclick="promptRetireMember('${m.lineUserId}', '${m.gameNickname}')" class="bg-rose-50 text-rose-700 border border-rose-200 text-xs font-bold px-2 py-1 rounded-lg cursor-pointer">退會</button>` : ''}
                        </div>
                    </div>
                `;
            }
            container.appendChild(card);
        });
    }

    function promptApproveMember(lineUserId, nickname) {
        document.getElementById('approveTargetUid').value = lineUserId;
        document.getElementById('approveConfirmText').textContent = `將核准【${nickname}】加入公會並設為現任成員`;
        document.getElementById('approveConfirmModal').classList.remove('hidden');
    }

    async function executeApproveMember() {
        const lineUserId = document.getElementById('approveTargetUid').value;
        if (!lineUserId) return;
        await fetch(`${BACKEND_API_URL}/api/admin/members/status`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lineUserId, accountStatus: '已審核', guildRole: '現任' })
        });
        closeModal('approveConfirmModal');
        await fetchAllBackendData();
        updateMemberCounts();
        renderMembersList();
    }

    function promptRetireMember(lineUserId, nickname) {
        document.getElementById('retireTargetUid').value = lineUserId;
        document.getElementById('retireConfirmText').textContent = `確定要將【${nickname}】設為退會狀態嗎？`;
        document.getElementById('retireConfirmModal').classList.remove('hidden');
    }

    async function executeRetireMember() {
        const lineUserId = document.getElementById('retireTargetUid').value;
        if (!lineUserId) return;
        await fetch(`${BACKEND_API_URL}/api/admin/members/status`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lineUserId, accountStatus: '已審核', guildRole: '退會' })
        });
        closeModal('retireConfirmModal');
        await fetchAllBackendData();
        updateMemberCounts();
        renderMembersList();
    }

    function promptDeleteMember() {
        const lineUserId = document.getElementById('formMemberUid').value;
        const target = membersData.find(x => x.lineUserId === lineUserId);
        if (!target) return;
        document.getElementById('deleteMemberTargetUid').value = lineUserId;
        document.getElementById('deleteMemberConfirmText').textContent = `確定要將成員【${target.gameNickname}】從資料庫中刪除嗎？`;
        document.getElementById('deleteMemberConfirmModal').classList.remove('hidden');
    }

    async function executeDeleteMember() {
        const lineUserId = document.getElementById('deleteMemberTargetUid').value;
        if (!lineUserId) return;
        await fetch(`${BACKEND_API_URL}/api/admin/members/${lineUserId}`, { method: 'DELETE' });
        closeModal('deleteMemberConfirmModal');
        closeModal('memberModal');
        await fetchAllBackendData();
        updateMemberCounts();
        if (currentMemberSubTab === 'groups') renderGroupOverview();
        else renderMembersList();
    }

    function renderGroupOverview() {
        const container = document.getElementById('memberListContainer');
        container.innerHTML = "";
        const keyword = document.getElementById('memberSearchInput').value.trim().toLowerCase();

        const groups = {};
        membersData.forEach(m => {
            const groupName = m.teamGroup ? m.teamGroup.trim() : "";
            if (!groupName) return;
            if (!groups[groupName]) groups[groupName] = [];
            groups[groupName].push(m);
        });

        const groupKeys = Object.keys(groups);
        let renderedGroupCount = 0;

        groupKeys.forEach(gName => {
            let list = groups[gName];
            const allMembersRetired = list.every(m => m.guildRole === "退會");
            const isArchived = allMembersRetired || manuallyArchivedGroups.includes(gName);

            if (currentGroupSubTab === 'active' && isArchived) return;
            if (currentGroupSubTab === 'archived' && !isArchived) return;

            if (keyword) {
                list = list.filter(m => (m.gameNickname && m.gameNickname.toLowerCase().includes(keyword)) || (m.lineDisplayName && m.lineDisplayName.toLowerCase().includes(keyword)));
                if (list.length === 0) return;
            }

            renderedGroupCount++;
            const activeCount = list.filter(x => x.guildRole !== "退會" && x.accountStatus === "已審核").length;

            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl p-4 border border-sky-100 soft-sky-shadow text-left space-y-2.5 fade-in";
            card.innerHTML = `
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <h3 class="text-sm font-black text-slate-900">${gName}</h3>
                        <span class="text-[10px] ${isArchived ? 'bg-slate-100 text-slate-500' : 'bg-sky-100 text-sky-800'} px-2 py-0.5 rounded-full font-bold">現任 ${activeCount} 人 / 總計 ${list.length} 人</span>
                    </div>
                    <div>
                        ${isArchived ? `
                            <button onclick="unarchiveGroup('${gName}')" class="text-xs font-bold text-sky-600 hover:text-sky-700 bg-sky-50 border border-sky-200 px-2 py-1 rounded-lg transition cursor-pointer">解除封存</button>
                        ` : `
                            <button onclick="promptArchiveGroup('${gName}')" class="text-xs font-bold text-slate-500 hover:text-slate-700 bg-slate-50 border border-slate-200 px-2 py-1 rounded-lg transition cursor-pointer">封存團體</button>
                        `}
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    ${list.map(member => `
                        <div class="p-2 rounded-xl bg-[#F8FAFC] border border-sky-100 flex items-center justify-between text-xs">
                            <div>
                                <div class="font-black text-slate-800 flex items-center gap-1">
                                    <span>${member.gameNickname}</span>
                                    <span class="text-[9px] text-slate-400 font-normal">(${member.guildRole || '成員'})</span>
                                </div>
                                <div class="text-[10px] text-slate-500">${member.gameClass} · LINE: ${member.lineDisplayName || '-'}</div>
                            </div>
                            <button onclick="openMemberModal('edit', '${member.lineUserId}')" class="text-[10px] bg-sky-50 text-sky-800 border border-sky-200 px-2 py-1 rounded-lg cursor-pointer">編輯</button>
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(card);
        });

        if (renderedGroupCount === 0) {
            const emptyMsg = currentGroupSubTab === 'active' ? '查無活躍的小團體' : '目前無封存的團體';
            container.innerHTML = `<div class="bg-[#F8FAFC] rounded-2xl p-6 text-center text-xs text-slate-400 font-bold border border-sky-100">${emptyMsg}</div>`;
        }
    }

    function promptArchiveGroup(groupName) {
        document.getElementById('archiveGroupTargetName').value = groupName;
        document.getElementById('archiveGroupConfirmText').textContent = `確定要將【${groupName}】移至封存區嗎？`;
        document.getElementById('archiveGroupConfirmModal').classList.remove('hidden');
    }

    function executeArchiveGroup() {
        const groupName = document.getElementById('archiveGroupTargetName').value;
        if (!groupName) return;
        if (!manuallyArchivedGroups.includes(groupName)) manuallyArchivedGroups.push(groupName);
        closeModal('archiveGroupConfirmModal');
        renderGroupOverview();
    }

    function unarchiveGroup(groupName) {
        manuallyArchivedGroups = manuallyArchivedGroups.filter(g => g !== groupName);
        renderGroupOverview();
    }

    function openCreateGroupModal() {
        const container = document.getElementById('groupCandidateList');
        container.innerHTML = "";
        const activeMembers = membersData.filter(m => m.accountStatus === "已審核" && m.guildRole !== "退會");
        activeMembers.forEach(m => {
            const label = document.createElement('label');
            label.className = "flex items-center justify-between p-2 rounded-lg bg-white border border-slate-100 hover:bg-sky-50/50 cursor-pointer";
            label.innerHTML = `
                <div class="flex items-center gap-2">
                    <input type="checkbox" name="groupMemberPick" value="${m.lineUserId}" class="w-4 h-4 accent-sky-500 cursor-pointer">
                    <span class="text-xs font-black text-slate-800">${m.gameNickname}</span>
                    <span class="text-[10px] text-slate-400">(${m.gameClass})</span>
                </div>
                <span class="text-[10px] font-bold text-slate-400">${m.teamGroup ? m.teamGroup : '未分組'}</span>
            `;
            container.appendChild(label);
        });
        document.getElementById('newGroupNameInput').value = "";
        document.getElementById('createGroupModal').classList.remove('hidden');
    }

    document.getElementById('createGroupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const groupName = document.getElementById('newGroupNameInput').value.trim();
        const checkedBoxes = Array.from(document.querySelectorAll('input[name="groupMemberPick"]:checked'));
        if (checkedBoxes.length === 0) { alert("請至少勾選一位成員！"); return; }

        for (const cb of checkedBoxes) {
            const uid = cb.value;
            const m = membersData.find(x => x.lineUserId === uid);
            if (m) {
                m.teamGroup = groupName;
                await fetch(`${BACKEND_API_URL}/api/admin/members/save`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...m, joinedLineGroup: m.joinedLineGroup || 'N', joinedDc: m.joinedDc || 'N' })
                });
            }
        }
        closeModal('createGroupModal');
        await fetchAllBackendData();
        renderGroupOverview();
    });

    async function openMemberModal(mode, lineUserId = null) {
        document.getElementById('memberForm').reset();
        syncAllClassDropdowns();

        const auditSection = document.getElementById('auditLogSection');
        const auditContainer = document.getElementById('auditLogContainer');
        const auditCountText = document.getElementById('auditLogCount');
        auditContainer.innerHTML = "";

        if (mode === 'create') {
            document.getElementById('memberModalTitle').textContent = "手動新增成員";
            document.getElementById('formMemberUid').value = "";
            document.getElementById('formGuildRole').value = "現任";
            document.getElementById('formAccountStatus').value = "已審核";
            document.getElementById('formAllowSearch').checked = true;
            document.getElementById('formJoinedLineGroup').checked = false;
            document.getElementById('formJoinedDc').checked = false;
            auditSection.classList.add('hidden');
            document.getElementById('deleteMemberBtnWrapper').classList.add('hidden');
        } else {
            document.getElementById('memberModalTitle').textContent = "編輯成員資料";
            const m = membersData.find(x => x.lineUserId === lineUserId);
            if (!m) return;
            document.getElementById('formMemberUid').value = m.lineUserId;
            document.getElementById('formGameNick').value = m.gameNickname;
            document.getElementById('formGameClass').value = m.gameClass;
            document.getElementById('formLineName').value = m.lineDisplayName || "";
            document.getElementById('formGuildRole').value = m.guildRole || "現任";
            document.getElementById('formTeamGroup').value = m.teamGroup || "";
            document.getElementById('formAccountStatus').value = m.accountStatus;
            
            document.getElementById('formAllowSearch').checked = (m.allowSearch === 'Y');
            document.getElementById('formJoinedLineGroup').checked = (m.joinedLineGroup === 'Y');
            document.getElementById('formJoinedDc').checked = (m.joinedDc === 'Y');
            auditSection.classList.remove('hidden');
            document.getElementById('deleteMemberBtnWrapper').classList.remove('hidden');

            try {
                const logRes = await fetch(`${BACKEND_API_URL}/api/admin/members/logs/${encodeURIComponent(lineUserId)}`);
                if (logRes.ok) {
                    const logData = await logRes.json();
                    if (logData.status === "success" && logData.logs) {
                        auditCountText.textContent = `共 ${logData.logs.length} 筆紀錄`;
                        if (logData.logs.length === 0) {
                            auditContainer.innerHTML = `<div class="text-center py-2 text-slate-400 font-normal">查無此成員之歷史修改紀錄</div>`;
                        } else {
                            logData.logs.forEach(log => {
                                const item = document.createElement('div');
                                item.className = "p-2 rounded-lg bg-white border border-slate-100 flex flex-col gap-0.5";
                                item.innerHTML = `
                                    <div class="flex items-center justify-between text-slate-400 font-mono text-[10px]">
                                        <span class="font-bold text-sky-700 bg-sky-50 px-1 rounded">${log.field}</span>
                                        <span>${log.updateTime}</span>
                                    </div>
                                    <div class="flex items-center gap-1.5 text-slate-700 mt-0.5">
                                        <span class="line-through text-slate-400">${log.oldValue || '-'}</span>
                                        <span class="text-sky-500">➜</span>
                                        <span class="font-bold text-slate-900">${log.newValue}</span>
                                    </div>
                                `;
                                auditContainer.appendChild(item);
                            });
                        }
                    }
                }
            } catch (err) {
                auditContainer.innerHTML = `<div class="text-center py-2 text-rose-400 font-normal">載入異動歷程失敗</div>`;
            }
        }
        document.getElementById('memberModal').classList.remove('hidden');
    }

    document.getElementById('memberForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            lineUserId: document.getElementById('formMemberUid').value || ("U_" + Date.now()),
            gameNickname: document.getElementById('formGameNick').value.trim(),
            gameClass: document.getElementById('formGameClass').value,
            lineDisplayName: document.getElementById('formLineName').value.trim(),
            guildRole: document.getElementById('formGuildRole').value,
            teamGroup: document.getElementById('formTeamGroup').value.trim(),
            accountStatus: document.getElementById('formAccountStatus').value,
            joinedLineGroup: document.getElementById('formJoinedLineGroup').checked ? 'Y' : 'N',
            joinedDc: document.getElementById('formJoinedDc').checked ? 'Y' : 'N'
        };

        try {
            await fetch(`${BACKEND_API_URL}/api/admin/members/save`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            closeModal('memberModal');
            await fetchAllBackendData();
            updateMemberCounts();
            if (currentMemberSubTab === 'groups') renderGroupOverview();
            else renderMembersList();
        } catch (err) {
            alert("儲存失敗");
        }
    });

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function closeLiffWindow() { if (typeof liff !== 'undefined' && liff.closeWindow) liff.closeWindow(); }
</script>
</body>
</html>
