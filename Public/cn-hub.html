<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuildMaster - 大陸成員專屬中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; }
        .soft-shadow { box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.15); }
    </style>
</head>
<body class="bg-[#FFFDF7] text-slate-800 min-h-screen p-4 pb-20">

    <!-- 頂部身分登入檢查卡片 -->
    <main class="max-w-md w-full mx-auto space-y-4">
        
        <!-- 未登入畫面 -->
        <div id="unauthCard" class="hidden bg-white rounded-3xl p-6 border-2 border-amber-200 text-center soft-shadow space-y-4">
            <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-black px-3.5 py-1 rounded-full">Discord 成員通道</span>
            <h1 class="text-xl font-black text-slate-900">公會會員中心</h1>
            <p class="text-xs text-slate-500 leading-relaxed">請先點擊下方按鈕登入您的 Discord 帳號，系統將自動完成身分驗證並加入公會語音伺服器！</p>
            <a href="/api/auth/discord" class="inline-flex items-center justify-center gap-2 w-full bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold py-3.5 rounded-2xl shadow-md transition">
                使用 Discord 帳號進入
            </a>
        </div>

        <!-- 已登入頂部身分小卡 -->
        <div id="userHeaderCard" class="hidden bg-white rounded-2xl p-4 border-2 border-amber-200 soft-shadow flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img id="userAvatar" src="" class="w-12 h-12 rounded-full border-2 border-amber-200 object-cover">
                <div>
                    <div class="flex items-center gap-1.5">
                        <span id="userNickname" class="font-black text-slate-900 text-sm">載入中...</span>
                        <span id="userStatusBadge" class="text-[10px] font-black px-2 py-0.5 rounded-full border bg-slate-100 text-slate-600">驗證中</span>
                    </div>
                    <div id="userClassText" class="text-xs text-slate-500 font-bold mt-0.5">-</div>
                </div>
            </div>
            <span class="text-[10px] font-black bg-indigo-50 text-indigo-600 border border-indigo-200 px-2.5 py-1 rounded-full">DC 專區</span>
        </div>

        <!-- 導航切換 Tab -->
        <div id="tabNav" class="hidden grid grid-cols-4 gap-1 bg-amber-100/70 p-1 rounded-2xl border border-amber-200/80 text-xs font-bold text-center">
            <button onclick="switchTab('profile')" id="tabBtn_profile" class="py-2 rounded-xl bg-white text-amber-950 font-black shadow-xs transition">身分</button>
            <button onclick="switchTab('bulletin')" id="tabBtn_bulletin" class="py-2 rounded-xl text-amber-900/70 hover:text-amber-950 transition">公告</button>
            <button onclick="switchTab('events')" id="tabBtn_events" class="py-2 rounded-xl text-amber-900/70 hover:text-amber-950 transition">活動</button>
            <button onclick="switchTab('leave')" id="tabBtn_leave" class="py-2 rounded-xl text-amber-900/70 hover:text-amber-950 transition">請假</button>
        </div>

        <!-- 模組 1：身分登記 / 審核資料 -->
        <section id="panel_profile" class="hidden bg-white rounded-3xl p-5 border-2 border-amber-200 soft-shadow space-y-4">
            <div class="border-b border-amber-100 pb-2">
                <h2 class="text-sm font-black text-slate-900">遊戲身分資料登記</h2>
                <p class="text-[11px] text-slate-400">請填寫正確遊戲內角色暱稱，方便幹部審核與排定聯賽攻城名單</p>
            </div>
            <form id="bindForm" class="space-y-3 text-xs font-bold text-slate-700">
                <div>
                    <label class="block mb-1">遊戲角色暱稱 <span class="text-rose-500">*</span></label>
                    <input type="text" id="inputNickname" required placeholder="請填寫遊戲完整暱稱" class="w-full h-10 border border-amber-200 rounded-xl px-3 bg-amber-50/20">
                </div>
                <div>
                    <label class="block mb-1">遊戲職業 <span class="text-rose-500">*</span></label>
                    <input type="text" id="inputClass" required placeholder="例：咒術師 / 狂戰士" class="w-full h-10 border border-amber-200 rounded-xl px-3 bg-amber-50/20">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-2xl shadow-md transition cursor-pointer">
                    儲存並送出審核
                </button>
            </form>
        </section>

        <!-- 模組 2：公告專區 -->
        <section id="panel_bulletin" class="hidden space-y-3">
            <div id="bulletinList" class="space-y-3">
                <div class="text-center text-xs text-slate-400 py-6">正在讀取最新公告...</div>
            </div>
        </section>

        <!-- 模組 3：活動報名專區 -->
        <section id="panel_events" class="hidden space-y-3">
            <div id="eventsList" class="space-y-3">
                <div class="text-center text-xs text-slate-400 py-6">正在載入公會活動...</div>
            </div>
        </section>

        <!-- 模組 4：請假專區 -->
        <section id="panel_leave" class="hidden bg-white rounded-3xl p-5 border-2 border-amber-200 soft-shadow space-y-4">
            <div class="border-b border-amber-100 pb-2">
                <h2 class="text-sm font-black text-slate-900">線上請假登記</h2>
                <p class="text-[11px] text-slate-400">聯賽、攻城或公會重大活動無法上線請提前登記</p>
            </div>
            <form id="leaveForm" class="space-y-3 text-xs font-bold text-slate-700">
                <div>
                    <label class="block mb-1">請假日期 <span class="text-rose-500">*</span></label>
                    <input type="date" id="leaveDate" required class="w-full h-10 border border-amber-200 rounded-xl px-3 bg-amber-50/20">
                </div>
                <div>
                    <label class="block mb-1">請假活動項目 <span class="text-rose-500">*</span></label>
                    <select id="leaveEvent" required class="w-full h-10 border border-amber-200 rounded-xl px-3 bg-amber-50/20">
                        <option value="公會聯賽">公會聯賽 (20:30)</option>
                        <option value="攻城戰">攻城戰 (21:00)</option>
                        <option value="黑白戰境">黑白戰境</option>
                        <option value="其他活動">其他活動</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1">請假原因 <span class="text-rose-500">*</span></label>
                    <input type="text" id="leaveReason" required placeholder="例：加班 / 身體不適 / 家中有事" class="w-full h-10 border border-amber-200 rounded-xl px-3 bg-amber-50/20">
                </div>
                <div>
                    <label class="block mb-1">補充備註 (選填)</label>
                    <input type="text" id="leaveNote" placeholder="任何想告訴幹部的細節" class="w-full h-10 border border-amber-200 rounded-xl px-3 bg-amber-50/20">
                </div>
                <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-2xl shadow-md transition cursor-pointer">
                    送出請假登記
                </button>
            </form>
        </section>

    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentUid = urlParams.get('uid');
        const currentName = urlParams.get('name');
        const currentAvatar = urlParams.get('avatar');

        let memberData = null;

        window.onload = async () => {
            if (!currentUid) {
                document.getElementById('unauthCard').classList.remove('hidden');
                return;
            }

            document.getElementById('userHeaderCard').classList.remove('hidden');
            document.getElementById('tabNav').classList.remove('hidden');
            document.getElementById('userAvatar').src = currentAvatar ? decodeURIComponent(currentAvatar) : "https://cdn.discordapp.com/embed/avatars/0.png";

            // 抓取會員現有資料
            await fetchMemberProfile();
            // 預設進入公告或身分頁籤
            switchTab('bulletin');
            // 設定請假預設今天日期
            document.getElementById('leaveDate').value = new Date().toISOString().split('T')[0];
        };

        // 頁籤切換
        function switchTab(tabKey) {
            ['profile', 'bulletin', 'events', 'leave'].forEach(key => {
                document.getElementById(`panel_${key}`).classList.add('hidden');
                const btn = document.getElementById(`tabBtn_${key}`);
                btn.className = "py-2 rounded-xl text-amber-900/70 hover:text-amber-950 transition";
            });

            document.getElementById(`panel_${tabKey}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tabBtn_${tabKey}`);
            activeBtn.className = "py-2 rounded-xl bg-white text-amber-950 font-black shadow-xs transition";

            if (tabKey === 'bulletin') loadBulletins();
            if (tabKey === 'events') loadEvents();
        }

        // 1. 取得會員資料
        async function fetchMemberProfile() {
            try {
                const res = await fetch(`/api/members/${encodeURIComponent(currentUid)}`);
                const data = await res.json();
                if (data.status === 'found') {
                    memberData = data;
                    document.getElementById('userNickname').textContent = data.gameNickname || decodeURIComponent(currentName || 'DC會員');
                    document.getElementById('userClassText').textContent = data.gameClass || '尚未設定職業';
                    document.getElementById('inputNickname').value = data.gameNickname || '';
                    document.getElementById('inputClass').value = data.gameClass === '未設定' ? '' : data.gameClass;

                    const badge = document.getElementById('userStatusBadge');
                    if (data.accountStatus === '已審核') {
                        badge.textContent = "已通過審核";
                        badge.className = "text-[10px] font-black px-2 py-0.5 rounded-full border bg-emerald-100 text-emerald-700 border-emerald-200";
                    } else {
                        badge.textContent = "審核中";
                        badge.className = "text-[10px] font-black px-2 py-0.5 rounded-full border bg-amber-100 text-amber-700 border-amber-200";
                    }
                }
            } catch (e) {
                console.error("載入身分失敗", e);
            }
        }

        // 2. 登記或修改角色
        document.getElementById('bindForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const gameNickname = document.getElementById('inputNickname').value.trim();
            const gameClass = document.getElementById('inputClass').value.trim();

            const res = await fetch('/api/members/bind', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    lineUserId: currentUid,
                    lineDisplayName: decodeURIComponent(currentName || ''),
                    gameNickname,
                    gameClass,
                    allowSearch: 'Y'
                })
            });
            const result = await res.json();
            if (result.status === 'success') {
                alert('🎉 身分登記已更新，幹部確認後即可獲得完整權限！');
                await fetchMemberProfile();
            } else {
                alert('更新失敗：' + result.message);
            }
        });

        // 3. 載入公告清單
        async function loadBulletins() {
            const container = document.getElementById('bulletinList');
            try {
                const res = await fetch('/api/admin/bulletins');
                const data = await res.json();
                if (data.status === 'success' && data.bulletins.length > 0) {
                    container.innerHTML = data.bulletins.map(b => `
                        <div class="bg-white rounded-2xl p-4 border border-amber-200/80 soft-shadow space-y-2 text-left">
                            <div class="flex items-center justify-between">
                                <span class="text-[10px] font-black px-2 py-0.5 rounded-full ${b.isPinned ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-800'}">${b.category}</span>
                                <span class="text-[10px] text-slate-400 font-bold">${b.date}</span>
                            </div>
                            <h3 class="text-sm font-black text-slate-900">${b.title}</h3>
                            <p class="text-xs text-slate-600 whitespace-pre-line leading-relaxed">${b.content}</p>
                            ${b.linkUrl ? `<a href="${b.linkUrl}" target="_blank" class="inline-block text-xs font-bold text-indigo-600 hover:underline pt-1">${b.linkText || '查看連結'} ↗</a>` : ''}
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center text-xs text-slate-400">目前尚無公會公告</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="text-center text-xs text-rose-500 py-4">公告載入失敗</div>`;
            }
        }

        // 4. 載入活動清單與報名
        async function loadEvents() {
            const container = document.getElementById('eventsList');
            try {
                const res = await fetch('/api/events');
                const data = await res.json();
                const events = data.events || [];
                if (events.length > 0) {
                    container.innerHTML = events.map(ev => `
                        <div class="bg-white rounded-2xl p-4 border border-amber-200/80 soft-shadow space-y-2 text-left">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-black text-slate-900">${ev.title}</span>
                                <span class="text-[10px] font-bold bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full border border-amber-200">${ev.status}</span>
                            </div>
                            <div class="text-xs text-slate-500">時間：${ev.date} ${ev.time}</div>
                            <p class="text-xs text-slate-600">${ev.description || '無特別說明'}</p>
                            <button onclick="handleEventSignup('${ev.event_id}')" class="w-full mt-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold py-2 rounded-xl transition">
                                立即報名活動
                            </button>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center text-xs text-slate-400">目前無進行中的活動報名</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="text-center text-xs text-rose-500 py-4">活動列表載入失敗</div>`;
            }
        }

        async function handleEventSignup(eventId) {
            if (!memberData || !memberData.gameNickname) {
                alert("請先至「身分」標籤完成遊戲角色暱稱登記！");
                switchTab('profile');
                return;
            }
            const note = prompt("請輸入報名備註 (例如：準時到 / 支援第二輪)：", "");
            if (note === null) return;

            const res = await fetch('/api/events/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    eventId,
                    lineUserId: currentUid,
                    gameNickname: memberData.gameNickname,
                    gameClass: memberData.gameClass || '未設定',
                    note: note.trim()
                })
            });
            const data = await res.json();
            if (data.status === 'success') {
                alert("🎉 活動報名成功！");
                loadEvents();
            } else {
                alert("報名失敗：" + (data.message || "系統錯誤"));
            }
        }

        // 5. 請假登記表單送出
        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!memberData || !memberData.gameNickname) {
                alert("請先至「身分」標籤登記遊戲暱稱，才能請假喔！");
                switchTab('profile');
                return;
            }

            const leaveDate = document.getElementById('leaveDate').value;
            const leaveEvent = document.getElementById('leaveEvent').value;
            const leaveReason = document.getElementById('leaveReason').value.trim();
            const note = document.getElementById('leaveNote').value.trim();

            const res = await fetch('/api/leaves', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    leaveDate,
                    leaveEvent,
                    targetUid: currentUid,
                    gameNickname: memberData.gameNickname,
                    gameClass: memberData.gameClass || '',
                    leaveReason,
                    note,
                    isUrgent: 'N',
                    operatorUid: currentUid,
                    operatorName: memberData.gameNickname
                })
            });

            const data = await res.json();
            if (data.status === 'success') {
                alert("✓ 請假申請已成功送出並同步至後台！");
                document.getElementById('leaveReason').value = '';
                document.getElementById('leaveNote').value = '';
            } else {
                alert("送出失敗：" + (data.message || "請稍後重試"));
            }
        });
    </script>
</body>
</html>
