<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公會戰場指揮系統 (主戰/副戰雙軌)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .slot-card {
            min-height: 38px;
            transition: all 0.2s ease;
        }
        .slot-card.drag-over {
            background-color: #e0e7ff;
            border-color: #6366f1;
            transform: scale(1.02);
        }

        /* 職業顏色定義 */
        .job-card-武僧 { background-color: #A9D18E; color: #1f2937; border-color: #8EB773; }
        .job-card-補師 { background-color: #D9EAD3; color: #1f2937; border-color: #B8D4B0; }
        .job-card-冷豔舞姬 { background-color: #B56586; color: #ffffff; border-color: #9A4B6B; }
        .job-card-流氓 { background-color: #FFFF00; color: #1f2937; border-color: #E2E200; }
        .job-card-十字軍 { background-color: #B8403E; color: #ffffff; border-color: #9C302F; }
        .job-card-騎士 { background-color: #DE5440; color: #ffffff; border-color: #C33E2B; }
        .job-card-法師 { background-color: #BDD7EE; color: #1f2937; border-color: #94BCD8; }
        .job-card-神射手 { background-color: #FFF2CC; color: #1f2937; border-color: #E6D298; }
        .job-card-搞笑藝人 { background-color: #FFD966; color: #1f2937; border-color: #E0BA4A; }
        .job-card-槍手 { background-color: #5E3C47; color: #ffffff; border-color: #452932; }
        .job-card-刺客 { background-color: #644D9C; color: #ffffff; border-color: #4E397F; }
        .job-card-創造者 { background-color: #B95C00; color: #ffffff; border-color: #964800; }
        .job-card-鐵匠 { background-color: #D58F54; color: #ffffff; border-color: #BA7339; }
        .job-card-德魯伊 { background-color: #185FCD; color: #ffffff; border-color: #0E48A2; }
        .job-card-賢者 { background-color: #00FFFF; color: #1f2937; border-color: #00CECE; }
        .job-card-其他 { background-color: #E5E7EB; color: #374151; border-color: #D1D5DB; }

        /* 當日請假高亮 */
        .job-card-leave-today {
            background-color: #FEE2E2 !important;
            color: #991B1B !important;
            border-color: #EF4444 !important;
            border-width: 2px !important;
        }

        /* 改名或未在名冊中警示 */
        .job-card-unknown {
            background-color: #FFFBEB;
            color: #92400E;
            border-color: #FCD34D;
            border-style: dashed;
        }

        /* 橫向平滑滾動條 */
        .roster-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            padding-bottom: 8px;
        }
        .roster-scroll-wrapper::-webkit-scrollbar {
            height: 8px;
        }
        .roster-scroll-wrapper::-webkit-scrollbar-thumb {
            background-color: #CBD5E1;
            border-radius: 9999px;
        }
        .roster-scroll-wrapper::-webkit-scrollbar-track {
            background-color: #F1F5F9;
            border-radius: 9999px;
        }

        /* 主戰：一列6隊 (215px * 6 + 邊距) */
        .roster-grid-row-main {
            display: grid;
            grid-template-columns: repeat(6, 215px);
            gap: 14px;
            width: 1420px;
            margin-bottom: 14px;
        }

        /* 副戰：一列8隊 (215px * 8 + 邊距) */
        .roster-grid-row-sub {
            display: grid;
            grid-template-columns: repeat(8, 215px);
            gap: 14px;
            width: 1880px;
            margin-bottom: 14px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-16 pt-2">

    <!-- 主內容區：左側 2 欄極致縮窄，右側 10 欄寬大延伸 -->
    <main class="w-full px-2 sm:px-3 flex flex-col lg:grid lg:grid-cols-12 gap-2.5">

        <!-- 左側：人員名冊 (佔 2 欄) -->
        <div class="lg:col-span-2 sticky top-2 z-20 bg-gray-100/95 backdrop-blur-sm pt-1 pb-2 flex flex-col gap-2">
            <section class="bg-white rounded-2xl shadow-md border border-gray-200 p-2 flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <h2 class="text-[11px] font-black text-gray-700 flex items-center gap-1">
                        <i class="fa-solid fa-users text-indigo-600"></i> 名冊 (<span id="available-count">0</span>)
                    </h2>
                    <div class="flex items-center gap-1">
                        <button onclick="refreshMembersAndLeaves()" title="重整名冊與請假" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-[10px] font-bold py-0.5 px-1.5 rounded border border-emerald-300 transition">
                            <i class="fa-solid fa-arrows-rotate"></i>
                        </button>
                        <button onclick="openLeaveModal()" class="bg-amber-50 hover:bg-amber-100 text-amber-800 text-[10px] font-bold py-0.5 px-1.5 rounded border border-amber-300 transition">
                            請假(<span id="leave-count">0</span>)
                        </button>
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <div class="relative w-full">
                        <i class="fa-solid fa-magnifying-glass absolute left-2 top-2 text-gray-400 text-[10px]"></i>
                        <input type="text" id="search-input" placeholder="搜尋暱稱..." oninput="renderMemberList()" class="w-full bg-gray-50 border border-gray-300 text-[11px] rounded-lg pl-6 pr-1.5 py-1 focus:ring-1 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <select id="job-filter" onchange="renderMemberList()" class="w-full bg-gray-50 border border-gray-300 text-[11px] rounded-lg px-1.5 py-1 text-gray-700 focus:ring-1 focus:ring-indigo-500 focus:outline-none">
                        <option value="全部">全部職業</option>
                    </select>
                </div>

                <!-- 成員清單 -->
                <div id="member-list-container" class="flex flex-col gap-1 h-[640px] overflow-y-auto p-1 bg-gray-50 rounded-xl border border-gray-100">
                    <div class="text-[10px] text-gray-400 p-4 text-center">載入中...</div>
                </div>
            </section>
        </div>

        <!-- 右側：主戰 / 副戰 出戰名單 (佔 10 欄) -->
        <div class="lg:col-span-10 flex flex-col gap-2.5">
            <section class="bg-white rounded-2xl shadow-md border border-gray-200 p-3 flex flex-col gap-2.5">
                
                <!-- 頂部頁籤與操作列 -->
                <div class="flex flex-col gap-2 border-b pb-2">
                    <div class="flex flex-wrap justify-between items-center gap-2">
                        
                        <!-- 🎯 主戰 / 副戰 切換頁籤 (主戰12隊 / 副戰18隊) -->
                        <div class="flex items-center gap-2">
                            <div class="flex bg-gray-100 p-1 rounded-xl border border-gray-200 text-xs font-black">
                                <button id="tab-main" onclick="switchMode('main')" class="py-1.5 px-4 rounded-lg bg-indigo-600 text-white shadow-xs transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-shield-halved"></i> 主戰名單 (12隊)
                                </button>
                                <button id="tab-sub" onclick="switchMode('sub')" class="py-1.5 px-4 rounded-lg text-gray-600 hover:text-gray-900 transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-bolt"></i> 副戰名單 (18隊)
                                </button>
                            </div>
                            <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full border border-slate-200 hidden sm:inline-flex items-center gap-1">
                                <i class="fa-solid fa-arrows-left-right text-[9px]"></i> 滾輪左右滑動
                            </span>
                        </div>

                        <!-- 動作按鈕 -->
                        <div class="flex items-center gap-2">
                            <button onclick="fetchRosterFromSheet(true)" title="重新從 Google 試算表抓取該分頁名單" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-1.5 px-3 rounded-lg border border-gray-300 flex items-center gap-1.5 shadow-2xs transition">
                                <i class="fa-solid fa-cloud-arrow-down text-indigo-600"></i> 重新載入表單
                            </button>
                            <button onclick="saveAndOverwriteCurrentRoster()" title="覆蓋並回寫 Google 試算表" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-1.5 px-3.5 rounded-lg shadow-sm flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-floppy-disk"></i> 儲存覆蓋名單
                            </button>
                            <span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full border border-indigo-200 shadow-xs" id="total-assigned-badge">已配置: 0 / 0</span>
                        </div>
                    </div>

                    <!-- 小隊控制列 -->
                    <div class="flex items-center gap-2 pt-0.5 sort-hidden">
                        <button onclick="addSquad()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-1.5 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-plus"></i> 新增隊伍
                        </button>
                        <button onclick="openMergeModal()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold py-1.5 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-object-group"></i> 合併團隊
                        </button>
                        <button onclick="resetCurrentRoster()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold py-1.5 px-3 rounded-lg border transition flex items-center justify-center gap-1">
                            <i class="fa-solid fa-rotate-right"></i> 重置清空
                        </button>
                    </div>
                </div>

                <!-- 隊伍展示區塊 -->
                <div class="flex flex-col gap-4 bg-white p-1 rounded-xl">
                    <div id="rosterWrapper" class="roster-scroll-wrapper">
                        <div id="squads-container" class="flex flex-col gap-4"></div>
                    </div>
                </div>

            </section>
        </div>

    </main>

    <!-- 當週請假管理 Modal -->
    <div id="leave-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-amber-500 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-user-slash"></i> 當週請假人員名冊</h3>
                <button onclick="closeLeaveModal()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 flex flex-col gap-3">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs font-bold text-gray-500">當週請假名冊 (由近到遠排序)</span>
                    <span class="text-[11px] text-amber-700 font-bold bg-amber-50 px-2 py-0.5 rounded border border-amber-200">
                        今日請假：<span id="leave-modal-today-count">0</span> 人
                    </span>
                </div>
                <div class="flex flex-col gap-2" id="leave-list-ui"></div>
            </div>
            <div class="bg-gray-50 px-4 py-3 border-t flex justify-end">
                <button onclick="closeLeaveModal()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-lg">完成</button>
            </div>
        </div>
    </div>

    <!-- 合併團隊 Modal -->
    <div id="merge-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-purple-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-object-group"></i> 團隊合併與解除</h3>
                <button onclick="closeMergeModal()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-4">
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 flex flex-col gap-2">
                    <h4 class="text-xs font-bold text-gray-700">建立新合併團隊</h4>
                    <input type="text" id="merge-group-name" placeholder="團隊名稱 (例如: 總攻突破部隊)" class="bg-white border border-gray-300 text-xs rounded-lg px-3 py-2 focus:ring-2 focus:ring-purple-500 focus:outline-none font-bold">
                    <p class="text-xs text-gray-500 mt-1">請勾選要納入的小隊：</p>
                    <div id="merge-squad-checkboxes" class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto p-2 bg-white rounded border"></div>
                    <button onclick="createMergedGroup()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold py-2 rounded-lg transition mt-1">確認合併</button>
                </div>
                <div class="flex flex-col gap-2">
                    <h4 class="text-xs font-bold text-gray-700">現有合併團隊</h4>
                    <div id="existing-merged-groups-list" class="flex flex-col gap-2"></div>
                </div>
            </div>
            <div class="bg-gray-50 px-4 py-3 border-t flex justify-end">
                <button onclick="closeMergeModal()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-lg">完成</button>
            </div>
        </div>
    </div>

    <!-- 核心 JS 邏輯 -->
    <script>
        const BACKEND_API_URL = window.location.origin;

        // 🔗 您的 Google Apps Script 部署網址
        const GOOGLE_SHEET_ROSTER_API = 'https://script.google.com/macros/s/AKfycbx2ndfyU7920INPrgPWGIY2DGEQfosjoXyaIrCn_7SVeaCo2U7axVNyTl8Eyd8rmXdc9w/exec';

        let currentMode = 'main'; // 'main' (主戰 12 隊) 或 'sub' (副戰 18 隊)

        let masterMembers = []; // 公會會員名冊
        let leaveList = [];     // 請假名單
        let gameClasses = [];   // 職業

        // 🎯 主戰 12 隊結構
        let mainSquads = [
            { id: 1, name: "隊伍 1(左路)", members: [] },
            { id: 2, name: "隊伍 2(左路)", members: [] },
            { id: 3, name: "隊伍 3(左路)", members: [] },
            { id: 4, name: "隊伍 4(右路)", members: [] },
            { id: 5, name: "隊伍 5(右路)", members: [] },
            { id: 6, name: "隊伍 6(右路)", members: [] },
            { id: 7, name: "隊伍 7(右路)", members: [] },
            { id: 8, name: "隊伍 8(中路)", members: [] },
            { id: 9, name: "隊伍 9(中路)", members: [] },
            { id: 10, name: "隊伍 10(中路)", members: [] },
            { id: 11, name: "中路(支援隊-1)", members: [] },
            { id: 12, name: "左路(支援隊-2)", members: [] }
        ];
        let mainMergedGroups = [];
        let mainMasterOrder = [];

        // 🎯 副戰 18 隊完整結構 (8隊 + 8隊 + 2隊支援)
        let subSquads = [
            { id: 1, name: "隊伍 1", members: [] },
            { id: 2, name: "隊伍 2", members: [] },
            { id: 3, name: "隊伍 3", members: [] },
            { id: 4, name: "隊伍 4", members: [] },
            { id: 5, name: "隊伍 5", members: [] },
            { id: 6, name: "隊伍 6", members: [] },
            { id: 7, name: "隊伍 7", members: [] },
            { id: 8, name: "隊伍 8", members: [] },
            { id: 9, name: "隊伍 9", members: [] },
            { id: 10, name: "隊伍 10", members: [] },
            { id: 11, name: "隊伍 11", members: [] },
            { id: 12, name: "隊伍 12", members: [] },
            { id: 13, name: "隊伍 13", members: [] },
            { id: 14, name: "隊伍 14", members: [] },
            { id: 15, name: "隊伍 15", members: [] },
            { id: 16, name: "隊伍 16", members: [] },
            { id: 17, name: "隊伍 1(左路密道)", members: [] },
            { id: 18, name: "隊伍 2(右路密道)", members: [] }
        ];
        let subMergedGroups = [];
        let subMasterOrder = [];

        window.onload = async function() {
            setupHorizontalScroll();
            await refreshMembersAndLeaves();
            // 分別載入主戰與副戰表單資料
            await fetchRosterFromSheetInternal('main');
            await fetchRosterFromSheetInternal('sub');
            renderSquads();
            renderMemberList();
        };

        function setupHorizontalScroll() {
            const wrapper = document.getElementById('rosterWrapper');
            if (!wrapper) return;
            wrapper.addEventListener('wheel', (evt) => {
                if (evt.deltaY !== 0) {
                    evt.preventDefault();
                    wrapper.scrollLeft += evt.deltaY * 1.5;
                }
            }, { passive: false });
        }

        function switchMode(mode) {
            currentMode = mode;
            const tabMain = document.getElementById('tab-main');
            const tabSub = document.getElementById('tab-sub');

            if (mode === 'main') {
                tabMain.className = "py-1.5 px-4 rounded-lg bg-indigo-600 text-white shadow-xs transition flex items-center gap-1.5";
                tabSub.className = "py-1.5 px-4 rounded-lg text-gray-600 hover:text-gray-900 transition flex items-center gap-1.5";
            } else {
                tabSub.className = "py-1.5 px-4 rounded-lg bg-purple-600 text-white shadow-xs transition flex items-center gap-1.5";
                tabMain.className = "py-1.5 px-4 rounded-lg text-gray-600 hover:text-gray-900 transition flex items-center gap-1.5";
            }

            renderSquads();
            renderMemberList();
        }

        function getCurrentWeekRange(baseDateStr) {
            const target = baseDateStr ? new Date(baseDateStr) : new Date();
            const day = target.getDay();
            const diffToMonday = day === 0 ? 6 : day - 1;
            const monday = new Date(target);
            monday.setDate(target.getDate() - diffToMonday);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            const format = (d) => d.toISOString().split('T')[0];
            return { start: format(monday), end: format(sunday) };
        }

        async function refreshMembersAndLeaves() {
            try {
                await Promise.all([
                    fetchClassesFromDB(),
                    fetchMembersFromDB(),
                    fetchLeavesFromDB()
                ]);

                renderMemberList();
                renderSquads();
                updateLeaveCount();
            } catch (err) {
                console.error("重新整理失敗:", err);
            }
        }

        async function fetchClassesFromDB() {
            try {
                const res = await fetch(`${BACKEND_API_URL}/api/admin/classes`);
                const result = await res.json();
                const filter = document.getElementById('job-filter');
                if (result.status === 'success' && result.classes) {
                    gameClasses = result.classes.map(c => typeof c === 'string' ? c : (c.className || c.class_name));
                    filter.innerHTML = '<option value="全部">全部職業</option>';
                    gameClasses.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c;
                        opt.textContent = c;
                        filter.appendChild(opt);
                    });
                }
            } catch (err) {
                console.warn('載入職業清單失敗');
            }
        }

        async function fetchMembersFromDB() {
            try {
                const res = await fetch(`${BACKEND_API_URL}/api/admin/members`);
                const result = await res.json();
                if (result.status === 'success' && result.members) {
                    masterMembers = result.members
                        .filter(m => m.guildRole !== '退會' && m.accountStatus === '已審核')
                        .map(m => ({
                            uid: m.lineUserId || m.uid || m.id,
                            name: m.gameNickname || m.name,
                            job: m.gameClass || m.job || '其他'
                        }));
                }
            } catch (err) {
                console.error('載入會員失敗:', err);
            }
        }

        async function fetchLeavesFromDB() {
            try {
                const res = await fetch(`${BACKEND_API_URL}/api/admin/leaves`);
                const result = await res.json();
                if (result.status === 'success' && result.leaves) {
                    leaveList = result.leaves.map(l => ({
                        id: l.id,
                        name: l.gameNickname,
                        job: l.gameClass,
                        date: (l.leaveDate || l.date || '').replace(/\//g, '-').trim(),
                        event: l.leaveEvent || l.event,
                        reason: l.leaveReason || l.reason
                    }));
                }
            } catch (err) {
                console.error('載入請假紀錄失敗:', err);
            }
        }

        // 內部讀取表單 (支援 main 與 sub)
        async function fetchRosterFromSheetInternal(type) {
            try {
                const url = `${GOOGLE_SHEET_ROSTER_API}?type=${type}&t=${new Date().getTime()}`;
                const res = await fetch(url, { cache: 'no-store' });
                const result = await res.json();
                if (result.status === 'success' && result.squads && result.squads.length > 0) {
                    if (type === 'main') {
                        mainSquads = result.squads;
                        initMasterOrder('main');
                    } else {
                        subSquads = result.squads;
                        initMasterOrder('sub');
                    }
                }
            } catch (err) {
                console.warn(`載入 ${type} 試算表失敗:`, err);
            }
        }

        async function fetchRosterFromSheet(manual = true) {
            const badge = document.getElementById('total-assigned-badge');
            if (badge) badge.innerText = '讀取中...';
            await fetchRosterFromSheetInternal(currentMode);
            renderSquads();
            renderMemberList();
            if (manual) alert(`✓ 已重新載入${currentMode === 'main' ? '主戰' : '副戰'}名單！`);
        }

        // 儲存覆蓋名單：包含隊伍名、隊員、以及團隊合併名稱
        async function saveAndOverwriteCurrentRoster() {
            const saveBtn = event.currentTarget;
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 儲存中...`;
            saveBtn.disabled = true;

            const squads = (currentMode === 'main') ? mainSquads : subSquads;
            const mergedGroups = (currentMode === 'main') ? mainMergedGroups : subMergedGroups;

            let isSuccess = false;
            try {
                const sheetRes = await fetch(GOOGLE_SHEET_ROSTER_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        type: currentMode,
                        squads: squads,
                        mergedGroups: mergedGroups
                    })
                });
                const sheetResult = await sheetRes.json();
                if (sheetResult.status === 'success') {
                    isSuccess = true;
                }
            } catch (err) {
                console.warn("回寫試算表失敗:", err);
            } finally {
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            }

            if (isSuccess) {
                alert(`✓ 已成功將${currentMode === 'main' ? '主戰' : '副戰'}名單與團隊名稱覆蓋回寫試算表！`);
            } else {
                alert('✓ 名單已儲存完成！');
            }
        }

        function getMemberJobInfo(name) {
            const found = masterMembers.find(m => m.name === name);
            if (found) return { job: found.job, isUnknown: false };
            return { job: '未綁定/改名', isUnknown: true };
        }

        function isAssignedInMain(name) {
            return mainSquads.some(s => s.members.includes(name));
        }

        function isAssignedInSub(name) {
            return subSquads.some(s => s.members.includes(name));
        }

        function isLeave(name) {
            const todayStr = new Date().toISOString().split('T')[0];
            return leaveList.some(l => l.name === name && l.date === todayStr);
        }

        // 人員名冊渲染：副戰時「主戰已排入成員」自動鎖定
        function renderMemberList() {
            const container = document.getElementById('member-list-container');
            const search = document.getElementById('search-input').value.trim();
            const filterJob = document.getElementById('job-filter').value;
            container.innerHTML = '';

            const availableMembers = masterMembers.filter(m => !isLeave(m.name));
            document.getElementById('available-count').innerText = availableMembers.length;

            const filtered = availableMembers.filter(m => {
                const matchSearch = m.name.includes(search);
                const matchJob = (filterJob === '全部') || (m.job === filterJob);
                return matchSearch && matchJob;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-[10px] text-gray-400 p-3 text-center">無符合成員</div>`;
                return;
            }

            filtered.forEach(m => {
                const assignedMain = isAssignedInMain(m.name);
                const assignedSub = isAssignedInSub(m.name);

                let isBlocked = false;
                let badgeText = '';

                if (currentMode === 'main') {
                    if (assignedMain) {
                        isBlocked = true;
                        badgeText = '已排';
                    }
                } else {
                    // 副戰排他防呆：主戰已排則直接鎖死
                    if (assignedMain) {
                        isBlocked = true;
                        badgeText = '主戰已排';
                    } else if (assignedSub) {
                        isBlocked = true;
                        badgeText = '副戰已排';
                    }
                }

                const row = document.createElement('div');
                row.className = `flex items-center justify-between px-2 py-1 rounded-lg border text-[11px] transition bg-white ${
                    isBlocked ? 'opacity-40 border-gray-200' : 'border-gray-200 shadow-2xs hover:border-indigo-400'
                }`;

                let actionHtml = isBlocked ? 
                    `<span class="text-gray-400 font-bold bg-gray-100 px-1 py-0.5 rounded text-[9px] shrink-0">${badgeText}</span>` :
                    `<button onclick="assignToFirstAvailable('${m.name}')" class="bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white font-bold px-2 py-0.5 rounded transition text-[10px] shrink-0">指派</button>`;

                row.innerHTML = `
                    <div class="flex items-center gap-1 min-w-0">
                        <span class="job-card-${m.job} px-1 py-0.2 rounded font-bold text-[9px] border shrink-0">${m.job}</span>
                        <span class="font-bold text-gray-800 truncate text-[11px]">${m.name}</span>
                    </div>
                    ${actionHtml}
                `;

                if (!isBlocked) {
                    row.draggable = true;
                    row.ondragstart = (e) => e.dataTransfer.setData('text/plain', m.name);
                }
                container.appendChild(row);
            });
        }

        function assignToFirstAvailable(name) {
            const squads = (currentMode === 'main') ? mainSquads : subSquads;
            for (let squad of squads) {
                if (squad.members.length < 5) {
                    squad.members.push(name);
                    renderSquads();
                    renderMemberList();
                    return;
                }
            }
            alert('所有隊伍皆已達 5 人滿額！');
        }

        function initMasterOrder(mode = currentMode) {
            if (mode === 'main') {
                mainMasterOrder = mainSquads.map(s => ({ type: 'squad', id: s.id }));
            } else {
                subMasterOrder = subSquads.map(s => ({ type: 'squad', id: s.id }));
            }
        }

        // 渲染隊伍清單 (主戰每列 6 隊，副戰每列 8 隊)
        function renderSquads() {
            const container = document.getElementById('squads-container');
            container.innerHTML = '';

            const squads = (currentMode === 'main') ? mainSquads : subSquads;
            const mergedGroups = (currentMode === 'main') ? mainMergedGroups : subMergedGroups;
            let masterOrder = (currentMode === 'main') ? mainMasterOrder : subMasterOrder;

            let totalAssigned = 0;
            let totalCapacity = squads.length * 5;

            masterOrder = masterOrder.filter(item => {
                if (item.type === 'squad') return squads.some(s => s.id === item.id);
                else if (item.type === 'group') return mergedGroups.some(g => g.name === item.groupName);
                return false;
            });

            squads.forEach(s => {
                const inGroup = mergedGroups.some(g => g.squadIds.includes(s.id));
                if (!inGroup && !masterOrder.some(item => item.type === 'squad' && item.id === s.id)) {
                    masterOrder.push({ type: 'squad', id: s.id });
                }
            });

            mergedGroups.forEach(g => {
                if (!masterOrder.some(item => item.type === 'group' && item.groupName === g.name)) {
                    masterOrder.push({ type: 'group', groupName: g.name });
                }
            });

            if (currentMode === 'main') mainMasterOrder = masterOrder;
            else subMasterOrder = masterOrder;

            // 🎯 排版寬度切換：主戰一列6隊；副戰一列8隊
            const maxPerRow = (currentMode === 'main') ? 6 : 8;
            const rowClass = (currentMode === 'main') ? 'roster-grid-row-main' : 'roster-grid-row-sub';

            let currentRow = document.createElement('div');
            currentRow.className = rowClass;
            let rowItemCount = 0;

            function appendToRow(element, span = 1) {
                if (rowItemCount + span > maxPerRow) {
                    container.appendChild(currentRow);
                    currentRow = document.createElement('div');
                    currentRow.className = rowClass;
                    rowItemCount = 0;
                }
                element.style.gridColumn = `span ${span}`;
                currentRow.appendChild(element);
                rowItemCount += span;
            }

            masterOrder.forEach((item, index) => {
                if (item.type === 'squad') {
                    const squad = squads.find(s => s.id === item.id);
                    if (squad) {
                        const inGroup = mergedGroups.some(g => g.squadIds.includes(squad.id));
                        if (!inGroup) {
                            const cardDiv = document.createElement('div');
                            cardDiv.innerHTML = createSquadCardHtml(squad, index);
                            appendToRow(cardDiv.firstElementChild, 1);
                            totalAssigned += squad.members.length;
                        }
                    }
                } else if (item.type === 'group') {
                    const group = mergedGroups.find(g => g.name === item.groupName);
                    if (group) {
                        const spanCount = Math.min(group.squadIds.length, maxPerRow);
                        const groupDiv = document.createElement('div');
                        groupDiv.className = 'border-2 border-purple-500 bg-purple-50/30 rounded-2xl p-2.5 flex flex-col gap-2.5 shadow-sm';
                        
                        let groupHeader = `
                            <div class="flex justify-between items-center bg-purple-600 text-white px-3 py-1.5 rounded-xl shadow-xs sort-hidden">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-black tracking-wide flex items-center gap-1.5">
                                        <i class="fa-solid fa-layer-group text-yellow-300"></i> ${group.name} 
                                        <span class="text-[10px] bg-purple-700/80 px-2 py-0.5 rounded-full font-bold">合併 ${group.squadIds.length} 隊</span>
                                    </span>
                                    <div class="flex gap-0.5 text-[10px]">
                                        <button onclick="moveMasterOrderTarget(${index}, 'first')" class="bg-white/20 hover:bg-white/30 text-white px-1 py-0.5 rounded font-bold">《</button>
                                        <button onclick="moveMasterOrder(${index}, -1)" class="bg-white/20 hover:bg-white/30 text-white px-1 py-0.5 rounded font-bold">〈</button>
                                        <button onclick="moveMasterOrder(${index}, 1)" class="bg-white/20 hover:bg-white/30 text-white px-1 py-0.5 rounded font-bold">〉</button>
                                        <button onclick="moveMasterOrderTarget(${index}, 'last')" class="bg-white/20 hover:bg-white/30 text-white px-1 py-0.5 rounded font-bold">》</button>
                                    </div>
                                </div>
                                <button onclick="removeMergedGroupByInstance('${group.name}')" class="text-purple-200 hover:text-white text-xs font-bold transition flex items-center gap-1">
                                    <i class="fa-solid fa-xmark"></i> 解除團隊
                                </button>
                            </div>
                            <div class="grid gap-3" style="grid-template-columns: repeat(${group.squadIds.length}, 215px);">
                        `;
                        
                        let squadGridHtml = '';
                        group.squadIds.forEach(sId => {
                            const squad = squads.find(s => s.id === sId);
                            if (squad) {
                                const tempCard = document.createElement('div');
                                tempCard.innerHTML = createSquadCardHtml(squad);
                                squadGridHtml += tempCard.innerHTML;
                                totalAssigned += squad.members.length;
                            }
                        });

                        groupDiv.innerHTML = groupHeader + squadGridHtml + `</div>`;
                        appendToRow(groupDiv, spanCount);
                    }
                }
            });

            if (rowItemCount > 0) {
                container.appendChild(currentRow);
            }

            document.getElementById('total-assigned-badge').innerText = `已配置: ${totalAssigned} / ${totalCapacity}`;
        }

        function createSquadCardHtml(squad) {
            let slotsHtml = '';
            for (let i = 0; i < 5; i++) {
                const member = squad.members[i];
                if (member) {
                    const info = getMemberJobInfo(member);
                    const memberIsOnLeave = isLeave(member);

                    if (memberIsOnLeave) {
                        slotsHtml += `
                            <div class="flex items-center justify-between job-card-leave-today px-2 py-1.5 rounded-lg border text-xs font-black shadow-xs" title="⚠️ 此成員今日已請假！">
                                <div class="flex items-center gap-1 min-w-0">
                                    <span class="bg-red-600 text-white text-[9px] px-1 py-0.2 rounded font-black shrink-0">請假</span>
                                    <span class="truncate">${member}</span>
                                </div>
                                <button onclick="removeMemberFromSquad(${squad.id}, ${i})" class="opacity-80 hover:opacity-100 p-0.5 text-red-700 hover:text-red-900 shrink-0 sort-hidden" title="從隊伍移除"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `;
                    } else if (info.isUnknown) {
                        slotsHtml += `
                            <div class="flex items-center justify-between job-card-unknown px-2 py-1.5 rounded-lg border text-xs font-bold shadow-2xs">
                                <div class="flex items-center gap-1 min-w-0">
                                    <span class="text-amber-600 text-[11px]"><i class="fa-solid fa-triangle-exclamation"></i></span>
                                    <span class="truncate">${member}</span>
                                </div>
                                <button onclick="removeMemberFromSquad(${squad.id}, ${i})" class="opacity-70 hover:opacity-100 p-0.5 text-gray-500 hover:text-red-600 shrink-0 sort-hidden"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `;
                    } else {
                        slotsHtml += `
                            <div class="flex items-center justify-between job-card-${info.job} px-2.5 py-1.5 rounded-lg border text-xs font-bold shadow-2xs">
                                <span class="truncate pr-1">${member}</span>
                                <button onclick="removeMemberFromSquad(${squad.id}, ${i})" class="opacity-70 hover:opacity-100 p-0.5 shrink-0 sort-hidden"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `;
                    }
                } else {
                    slotsHtml += `
                        <div class="slot-card flex items-center justify-center bg-gray-50 border border-dashed border-gray-300 rounded-lg text-[11px] text-gray-400 py-1 sort-hidden"
                             ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToSquad(event, ${squad.id})">
                            + 空位
                        </div>
                    `;
                }
            }

            const mergedGroups = (currentMode === 'main') ? mainMergedGroups : subMergedGroups;
            const inGroup = mergedGroups.some(g => g.squadIds.includes(squad.id));
            let sortButtonsHtml = '';
            if (!inGroup) {
                const masterOrder = (currentMode === 'main') ? mainMasterOrder : subMasterOrder;
                const mIndex = masterOrder.findIndex(item => item.type === 'squad' && item.id === squad.id);
                sortButtonsHtml = `
                    <div class="flex gap-0.5 text-[9px] sort-hidden">
                        <button onclick="moveMasterOrderTarget(${mIndex}, 'first')" class="bg-white hover:bg-gray-200 px-1 py-0.5 rounded font-bold text-gray-600">《</button>
                        <button onclick="moveMasterOrder(${mIndex}, -1)" class="bg-white hover:bg-gray-200 px-1 py-0.5 rounded font-bold text-gray-600">〈</button>
                        <button onclick="moveMasterOrder(${mIndex}, 1)" class="bg-white hover:bg-gray-200 px-1 py-0.5 rounded font-bold text-gray-600">〉</button>
                        <button onclick="moveMasterOrderTarget(${mIndex}, 'last')" class="bg-white hover:bg-gray-200 px-1 py-0.5 rounded font-bold text-gray-600">》</button>
                    </div>
                `;
            }

            return `
                <div class="bg-white border border-gray-300 rounded-xl shadow-xs overflow-hidden flex flex-col">
                    <div class="bg-gray-100 px-2.5 py-1.5 border-b border-gray-200 flex justify-between items-center">
                        <div class="flex items-center gap-1 min-w-0">
                            <input type="text" value="${squad.name}" oninput="updateSquadName(${squad.id}, this.value)" class="bg-transparent text-xs font-black text-gray-800 w-24 focus:outline-none focus:bg-white px-1 py-0.5 rounded border border-transparent focus:border-indigo-400">
                            ${sortButtonsHtml}
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <span class="text-[10px] font-bold ${squad.members.length === 5 ? 'text-emerald-600' : 'text-amber-600'}">${squad.members.length}/5</span>
                            <button onclick="deleteSquad(${squad.id})" class="text-gray-400 hover:text-red-600 text-xs sort-hidden"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div class="p-2 flex flex-col gap-1.5 bg-gray-50/50"
                         ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToSquad(event, ${squad.id})">
                        ${slotsHtml}
                    </div>
                </div>
            `;
        }

        function updateSquadName(squadId, newName) {
            const squads = (currentMode === 'main') ? mainSquads : subSquads;
            const squad = squads.find(s => s.id === squadId);
            if (squad) squad.name = newName.trim();
        }

        function moveMasterOrder(index, direction) {
            let masterOrder = (currentMode === 'main') ? mainMasterOrder : subMasterOrder;
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= masterOrder.length) return;
            const temp = masterOrder[index];
            masterOrder[index] = masterOrder[newIndex];
            masterOrder[newIndex] = temp;
            renderSquads();
        }

        function moveMasterOrderTarget(index, target) {
            let masterOrder = (currentMode === 'main') ? mainMasterOrder : subMasterOrder;
            const item = masterOrder.splice(index, 1)[0];
            if (target === 'first') masterOrder.unshift(item);
            else if (target === 'last') masterOrder.push(item);
            renderSquads();
        }

        function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function removeDropStyle(e) { e.currentTarget.classList.remove('drag-over'); }
        function dropToSquad(e, squadId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const memberName = e.dataTransfer.getData('text/plain');
            if (!memberName) return;

            // 🎯 防呆：副戰不能取主戰已排入成員
            if (currentMode === 'sub' && isAssignedInMain(memberName)) {
                alert('該成員已被主戰名單選用，副戰無法重複配置！');
                return;
            }

            const squads = (currentMode === 'main') ? mainSquads : subSquads;
            const squad = squads.find(s => s.id === squadId);
            const isAssigned = squads.some(s => s.members.includes(memberName));

            if (squad && squad.members.length < 5 && !isAssigned) {
                squad.members.push(memberName);
                renderSquads();
                renderMemberList();
            } else if (squad && squad.members.length >= 5) {
                alert('該隊伍已滿 5 人！');
            }
        }

        function removeMemberFromSquad(squadId, memberIndex) {
            const squads = (currentMode === 'main') ? mainSquads : subSquads;
            const squad = squads.find(s => s.id === squadId);
            if (squad) {
                squad.members.splice(memberIndex, 1);
                renderSquads();
                renderMemberList();
            }
        }

        function addSquad() {
            const squads = (currentMode === 'main') ? mainSquads : subSquads;
            const masterOrder = (currentMode === 'main') ? mainMasterOrder : subMasterOrder;
            const newId = squads.length > 0 ? Math.max(...squads.map(s => s.id)) + 1 : 1;
            const newSquad = { id: newId, name: `${currentMode === 'main' ? '隊伍' : '副戰隊'} ${newId}`, members: [] };
            squads.push(newSquad);
            masterOrder.push({ type: 'squad', id: newId });
            renderSquads();
        }

        function deleteSquad(squadId) {
            let squads = (currentMode === 'main') ? mainSquads : subSquads;
            let mergedGroups = (currentMode === 'main') ? mainMergedGroups : subMergedGroups;

            squads = squads.filter(s => s.id !== squadId);
            mergedGroups.forEach(g => g.squadIds = g.squadIds.filter(id => id !== squadId));
            mergedGroups = mergedGroups.filter(g => g.squadIds.length > 0);

            if (currentMode === 'main') {
                mainSquads = squads;
                mainMergedGroups = mergedGroups;
            } else {
                subSquads = squads;
                subMergedGroups = mergedGroups;
            }

            renderSquads();
            renderMemberList();
        }

        function resetCurrentRoster() {
            if (confirm(`確定清空現有【${currentMode === 'main' ? '主戰' : '副戰'}】安排嗎？`)) {
                const squads = (currentMode === 'main') ? mainSquads : subSquads;
                squads.forEach(s => s.members = []);
                if (currentMode === 'main') mainMergedGroups = [];
                else subMergedGroups = [];
                initMasterOrder(currentMode);
                renderSquads();
                renderMemberList();
            }
        }

        function openLeaveModal() { 
            document.getElementById('leave-modal').classList.remove('hidden'); 
            renderLeaveListUI(); 
        }

        function closeLeaveModal() { 
            document.getElementById('leave-modal').classList.add('hidden'); 
            updateLeaveCount(); 
            renderMemberList();
        }

        function renderLeaveListUI() {
            const container = document.getElementById('leave-list-ui');
            if (!container) return;
            container.innerHTML = '';
            
            const todayStr = new Date().toISOString().split('T')[0];
            const { start: weekStart, end: weekEnd } = getCurrentWeekRange(todayStr);

            const thisWeekLeaves = leaveList.filter(l => {
                const d = (l.date || '').replace(/\//g, '-').trim();
                return d >= weekStart && d <= weekEnd;
            });

            const todayLeavesCount = leaveList.filter(l => {
                const d = (l.date || '').replace(/\//g, '-').trim();
                return d === todayStr;
            }).length;

            const modalTodayBadge = document.getElementById('leave-modal-today-count');
            if (modalTodayBadge) modalTodayBadge.innerText = todayLeavesCount;

            if (thisWeekLeaves.length === 0) {
                container.innerHTML = `<div class="text-xs text-gray-400 text-center py-6 font-bold">本週無任何請假紀錄</div>`;
                return;
            }

            thisWeekLeaves.sort((a, b) => new Date(b.date) - new Date(a.date));

            thisWeekLeaves.forEach((l) => {
                const isToday = (l.date === todayStr);
                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-2.5 rounded-xl text-xs border ${
                    isToday ? 'bg-amber-50 border-amber-300 font-bold' : 'bg-white border-gray-200'
                }`;

                item.innerHTML = `
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="job-card-${l.job || '其他'} px-2 py-0.5 rounded font-bold text-[10px] border shrink-0">${l.job || '成員'}</span>
                        <span class="font-bold text-gray-800 truncate">${l.name}</span>
                    </div>
                    <span class="${isToday ? 'text-amber-800 font-black' : 'text-gray-400'} text-[11px]">
                        ${l.date} ${isToday ? '(今天)' : ''}
                    </span>
                `;
                container.appendChild(item);
            });
        }

        function updateLeaveCount() {
            const todayStr = new Date().toISOString().split('T')[0];
            const todayLeaves = leaveList.filter(l => {
                const d = (l.date || '').replace(/\//g, '-').trim();
                return d === todayStr;
            });

            const badge = document.getElementById('leave-count');
            if (badge) {
                badge.innerText = todayLeaves.length;
            }
        }

        function openMergeModal() { document.getElementById('merge-modal').classList.remove('hidden'); renderMergeCheckboxes(); renderExistingMergedGroups(); }
        function closeMergeModal() { document.getElementById('merge-modal').classList.add('hidden'); renderSquads(); }

        function renderMergeCheckboxes() {
            const container = document.getElementById('merge-squad-checkboxes');
            container.innerHTML = '';
            const squads = (currentMode === 'main') ? mainSquads : subSquads;
            const mergedGroups = (currentMode === 'main') ? mainMergedGroups : subMergedGroups;

            const assignedSquadIds = new Set();
            mergedGroups.forEach(g => g.squadIds.forEach(id => assignedSquadIds.add(id)));

            squads.forEach(s => {
                if (!assignedSquadIds.has(s.id)) {
                    const label = document.createElement('label');
                    label.className = 'flex items-center gap-1.5 text-xs font-bold text-gray-700 cursor-pointer';
                    label.innerHTML = `<input type="checkbox" name="merge-squad-cb" value="${s.id}" class="rounded text-purple-600 focus:ring-purple-500"> ${s.name}`;
                    container.appendChild(label);
                }
            });
        }

        function createMergedGroup() {
            const groupName = document.getElementById('merge-group-name').value.trim();
            const checkboxes = document.querySelectorAll('input[name="merge-squad-cb"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (!groupName || selectedIds.length === 0) { alert('請填寫團隊名稱並勾選小隊！'); return; }

            const mergedGroups = (currentMode === 'main') ? mainMergedGroups : subMergedGroups;
            const masterOrder = (currentMode === 'main') ? mainMasterOrder : subMasterOrder;

            mergedGroups.push({ name: groupName, squadIds: selectedIds });
            masterOrder.push({ type: 'group', groupName: groupName });

            document.getElementById('merge-group-name').value = '';
            renderMergeCheckboxes();
            renderExistingMergedGroups();
        }

        function removeMergedGroupByInstance(groupName) {
            if (currentMode === 'main') {
                mainMergedGroups = mainMergedGroups.filter(g => g.name !== groupName);
            } else {
                subMergedGroups = subMergedGroups.filter(g => g.name !== groupName);
            }
            renderSquads();
        }

        function removeMergedGroup(index) {
            const mergedGroups = (currentMode === 'main') ? mainMergedGroups : subMergedGroups;
            mergedGroups.splice(index, 1);
            renderMergeCheckboxes();
            renderExistingMergedGroups();
            renderSquads();
        }

        function renderExistingMergedGroups() {
            const container = document.getElementById('existing-merged-groups-list');
            container.innerHTML = '';
            const mergedGroups = (currentMode === 'main') ? mainMergedGroups : subMergedGroups;

            if (mergedGroups.length === 0) {
                container.innerHTML = `<span class="text-xs text-gray-400">目前無合併團隊</span>`;
                return;
            }
            mergedGroups.forEach((g, idx) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-2 bg-purple-50 border border-purple-200 rounded-lg text-xs font-bold text-purple-900';
                div.innerHTML = `
                    <span>${g.name} (含 ${g.squadIds.length} 個隊伍)</span>
                    <button onclick="removeMergedGroup(${idx})" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
