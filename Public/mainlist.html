<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公會戰場主戰名單指揮系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .slot-card {
            min-height: 38px;
            transition: all 0.2s ease;
        }
        .slot-card.drag-over {
            background-color: #e0e7ff;
            border-color: #6366f1;
            transform: scale(1.02);
        }

        /* 🎯 依照條件式格式規則取色之職業色樣 */
        .job-card-武僧 { background-color: #A9D18E; color: #1f2937; border-color: #8EB773; }
        .job-card-補師 { background-color: #D9EAD3; color: #1f2937; border-color: #B8D4B0; }
        .job-card-冷豔舞姬 { background-color: #B56586; color: #ffffff; border-color: #9A4B6B; }
        .job-card-流氓 { background-color: #FFFF00; color: #1f2937; border-color: #E2E200; }
        .job-card-十字軍 { background-color: #B8403E; color: #ffffff; border-color: #9C302F; }
        .job-card-騎士 { background-color: #DE5440; color: #ffffff; border-color: #C33E2B; }
        .job-card-法師 { background-color: #BDD7EE; color: #1f2937; border-color: #94BCD8; }
        .job-card-神射手 { background-color: #FFF2CC; color: #1f2937; border-color: #E6D298; }
        .job-card-搞笑藝人 { background-color: #FFD966; color: #1f2937; border-color: #E0BA4A; }
        .job-card-槍手 { background-color: #5E3C47; color: #ffffff; border-color: #452932; }
        .job-card-刺客 { background-color: #644D9C; color: #ffffff; border-color: #4E397F; }
        .job-card-創造者 { background-color: #B95C00; color: #ffffff; border-color: #964800; }
        .job-card-鐵匠 { background-color: #D58F54; color: #ffffff; border-color: #BA7339; }
        .job-card-德魯伊 { background-color: #185FCD; color: #ffffff; border-color: #0E48A2; }
        .job-card-賢者 { background-color: #00FFFF; color: #1f2937; border-color: #00CECE; }
        .job-card-其他 { background-color: #E5E7EB; color: #374151; border-color: #D1D5DB; }

        .job-card-unknown {
            background-color: #FFFBEB;
            color: #92400E;
            border-color: #FCD34D;
            border-style: dashed;
        }

        /* 橫向平滑滾動 */
        .roster-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            padding-bottom: 8px;
        }
        .roster-scroll-wrapper::-webkit-scrollbar {
            height: 8px;
        }
        .roster-scroll-wrapper::-webkit-scrollbar-thumb {
            background-color: #CBD5E1;
            border-radius: 9999px;
        }
        .roster-scroll-wrapper::-webkit-scrollbar-track {
            background-color: #F1F5F9;
            border-radius: 9999px;
        }

        .roster-grid-row {
            display: grid;
            grid-template-columns: repeat(6, 215px);
            gap: 14px;
            width: 1420px;
            margin-bottom: 14px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-16 pt-3">

    <main class="max-w-[1600px] mx-auto px-3 flex flex-col lg:grid lg:grid-cols-12 gap-4">

        <!-- 左側：人員名冊 (佔 4 欄) -->
        <div class="lg:col-span-4 sticky top-3 z-20 bg-gray-100/95 backdrop-blur-sm pt-1 pb-2 flex flex-col gap-3">
            <section class="bg-white rounded-2xl shadow-md border border-gray-200 p-3.5 flex flex-col gap-2.5">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs sm:text-sm font-bold text-gray-700 flex items-center gap-1.5">
                        <i class="fa-solid fa-users text-indigo-600"></i> 人員名冊 (<span id="available-count">0</span>)
                    </h2>
                    <div class="flex items-center gap-1.5">
                        <!-- 🎯 只重取會員與請假 API -->
                        <button onclick="refreshMembersAndLeaves()" title="只重取 API 會員名冊和請假資料" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-[11px] font-bold py-1 px-2.5 rounded-lg border border-emerald-300 flex items-center gap-1 transition shadow-xs">
                            <i class="fa-solid fa-arrows-rotate"></i> 重新整理
                        </button>
                        <button onclick="openLeaveModal()" class="bg-amber-50 hover:bg-amber-100 text-amber-800 text-[11px] font-bold py-1 px-2.5 rounded-lg border border-amber-300 flex items-center gap-1 transition shadow-xs">
                            <i class="fa-solid fa-user-slash"></i> 請假名單 (<span id="leave-count">0</span>)
                        </button>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <div class="relative w-full">
                        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-gray-400 text-xs"></i>
                        <input type="text" id="search-input" placeholder="搜尋成員暱稱..." oninput="renderMemberList()" class="w-full bg-gray-50 border border-gray-300 text-xs rounded-lg pl-8 pr-2 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <select id="job-filter" onchange="renderMemberList()" class="w-full bg-gray-50 border border-gray-300 text-xs rounded-lg px-2 py-2 text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="全部">全部職業</option>
                    </select>
                </div>

                <div id="member-list-container" class="flex flex-col gap-1.5 h-[560px] overflow-y-auto p-1.5 bg-gray-50 rounded-xl border border-gray-100">
                    <div class="text-xs text-gray-400 p-4 w-full text-center">正在載入成員中...</div>
                </div>
            </section>
        </div>

        <!-- 右側：主戰名單配置區 (佔 8 欄) -->
        <div class="lg:col-span-8 flex flex-col gap-4">
            <section class="bg-white rounded-2xl shadow-md border border-gray-200 p-4 flex flex-col gap-4">
                
                <!-- 頂部操作列：標題、重新載入表單、儲存覆蓋主戰名單 -->
                <div class="flex flex-col gap-3 border-b pb-3">
                    <div class="flex flex-wrap justify-between items-center gap-2">
                        <div class="flex items-center gap-3">
                            <h2 class="text-lg font-black text-gray-800 tracking-wide">主戰名單</h2>
                            <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full border border-slate-200 flex items-center gap-1">
                                <i class="fa-solid fa-arrows-left-right text-[9px]"></i> 滾輪左右滑動
                            </span>
                        </div>

                        <!-- 🎯 按鈕移至標題旁 -->
                        <div class="flex items-center gap-2">
                            <button onclick="fetchMainRosterFromSheet(true)" title="重新從 Google 試算表抓取隊伍名單" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-1.5 px-3 rounded-lg border border-gray-300 flex items-center gap-1.5 shadow-2xs transition">
                                <i class="fa-solid fa-cloud-arrow-down text-indigo-600"></i> 重新載入表單
                            </button>
                            <button onclick="saveAndOverwriteRoster()" title="覆蓋並儲存主戰名單，同時匯出圖片" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-1.5 px-3.5 rounded-lg shadow-sm flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-floppy-disk"></i> 儲存覆蓋主戰名單
                            </button>
                            <span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full border border-indigo-200 shadow-xs" id="total-assigned-badge">已配置: 0 / 0</span>
                        </div>
                    </div>

                    <!-- 小隊控制列 -->
                    <div class="flex items-center gap-2 pt-1 sort-hidden">
                        <button onclick="addSquad()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-plus"></i> 新增隊伍
                        </button>
                        <button onclick="openMergeModal()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-object-group"></i> 合併團隊
                        </button>
                        <button onclick="resetRoster()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold py-2 px-3 rounded-lg border transition flex items-center justify-center gap-1">
                            <i class="fa-solid fa-rotate-right"></i> 重置清空
                        </button>
                    </div>
                </div>

                <!-- 乾淨匯出包覆區 -->
                <div id="export-capture-target" class="flex flex-col gap-4 bg-white p-2 rounded-xl">
                    <div id="rosterWrapper" class="roster-scroll-wrapper">
                        <div id="squads-container" class="flex flex-col gap-4"></div>
                    </div>
                </div>

            </section>
        </div>

    </main>

    <!-- 請假管理 Modal -->
    <div id="leave-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-amber-500 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-user-slash"></i> 請假人員管理 (連線資料庫)</h3>
                <button onclick="closeLeaveModal()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-4">
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 flex flex-col gap-2">
                    <h4 class="text-xs font-bold text-gray-700">登記請假</h4>
                    
                    <button type="button" onclick="openMemberPickerModal()" class="w-full bg-white border border-gray-300 text-xs rounded-lg px-3 py-2.5 text-left font-bold text-gray-700 hover:border-amber-500 focus:outline-none flex items-center justify-between shadow-2xs">
                        <span id="selected-member-display" class="text-gray-400">點此開窗搜尋公會成員...</span>
                        <i class="fa-solid fa-magnifying-glass text-gray-400 text-xs"></i>
                    </button>
                    <input type="hidden" id="leave-selected-uid">
                    <input type="hidden" id="leave-selected-name">
                    <input type="hidden" id="leave-selected-job">

                    <input type="text" id="leave-event-input" placeholder="請假活動 (例如: 公會戰場)" value="公會戰場" class="bg-white border border-gray-300 text-xs rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <input type="date" id="leave-date-input" class="bg-white border border-gray-300 text-xs rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <button onclick="addLeavePerson()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold py-2 rounded-lg transition mt-1">寫入資料庫並排除出戰</button>
                </div>
                <div class="flex flex-col gap-2">
                    <h4 class="text-xs font-bold text-gray-700">當前請假名冊</h4>
                    <div class="flex flex-col gap-2" id="leave-list-ui"></div>
                </div>
            </div>
            <div class="bg-gray-50 px-4 py-3 border-t flex justify-end">
                <button onclick="closeLeaveModal()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-lg">完成</button>
            </div>
        </div>
    </div>

    <!-- 獨立開窗：搜尋公會成員 Modal -->
    <div id="member-picker-modal" class="fixed inset-0 bg-black/60 z-60 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-indigo-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-address-book"></i> 選擇成員</h3>
                <button onclick="closeMemberPickerModal()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-3 border-b bg-gray-50">
                <div class="relative w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                    <input type="text" id="picker-search-input" oninput="renderPickerMemberList()" placeholder="輸入暱稱或職業過濾..." class="w-full bg-white border border-gray-300 text-xs rounded-lg pl-8 pr-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>
            <div class="p-2 overflow-y-auto flex-1 flex flex-col gap-1.5" id="picker-member-list-ui"></div>
            <div class="bg-gray-50 px-4 py-2.5 border-t flex justify-end">
                <button onclick="closeMemberPickerModal()" class="text-xs text-gray-600 font-bold px-3 py-1.5">關閉</button>
            </div>
        </div>
    </div>

    <!-- 合併團隊 Modal -->
    <div id="merge-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-purple-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-object-group"></i> 團隊合併與解除</h3>
                <button onclick="closeMergeModal()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-4">
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 flex flex-col gap-2">
                    <h4 class="text-xs font-bold text-gray-700">建立新合併團隊</h4>
                    <input type="text" id="merge-group-name" placeholder="團隊名稱 (例如: 總攻突破部隊)" class="bg-white border border-gray-300 text-xs rounded-lg px-3 py-2 focus:ring-2 focus:ring-purple-500 focus:outline-none">
                    <p class="text-xs text-gray-500 mt-1">請勾選要納入的小隊：</p>
                    <div id="merge-squad-checkboxes" class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto p-2 bg-white rounded border"></div>
                    <button onclick="createMergedGroup()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold py-2 rounded-lg transition mt-1">確認合併</button>
                </div>
                <div class="flex flex-col gap-2">
                    <h4 class="text-xs font-bold text-gray-700">現有合併團隊</h4>
                    <div id="existing-merged-groups-list" class="flex flex-col gap-2"></div>
                </div>
            </div>
            <div class="bg-gray-50 px-4 py-3 border-t flex justify-end">
                <button onclick="closeMergeModal()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-lg">完成</button>
            </div>
        </div>
    </div>

    <!-- 核心 JS 邏輯 -->
    <script>
        const BACKEND_API_URL = window.location.origin;

        // 🔗 您的 Google Apps Script 部署網址
        const GOOGLE_SHEET_ROSTER_API = 'https://script.google.com/macros/s/AKfycbx2ndfyU7920INPrgPWGIY2DGEQfosjoXyaIrCn_7SVeaCo2U7axVNyTl8Eyd8rmXdc9w/exec';

        let masterMembers = []; // 會員名冊
        let leaveList = [];     // 請假名單
        let gameClasses = [];   // 職業

        let squads = [
            { id: 1, name: "隊伍 1(左路)", members: [] },
            { id: 2, name: "隊伍 2(左路)", members: [] },
            { id: 3, name: "隊伍 3(左路)", members: [] },
            { id: 4, name: "隊伍 4(右路)", members: [] },
            { id: 5, name: "隊伍 5(右路)", members: [] },
            { id: 6, name: "隊伍 6(右路)", members: [] },
            { id: 7, name: "隊伍 7(右路)", members: [] },
            { id: 8, name: "隊伍 8(中路)", members: [] },
            { id: 9, name: "隊伍 9(中路)", members: [] },
            { id: 10, name: "隊伍 10(中路)", members: [] },
            { id: 11, name: "中路(支援隊-1)", members: [] },
            { id: 12, name: "左路(支援隊-2)", members: [] }
        ];

        let mergedGroups = [];
        let masterOrder = [];

        window.onload = async function() {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('leave-date-input').value = todayStr;

            setupHorizontalScroll();

            // 初始載入：取會員、請假與主戰名單
            await refreshMembersAndLeaves();
            await fetchMainRosterFromSheet(false);
        };

        function setupHorizontalScroll() {
            const wrapper = document.getElementById('rosterWrapper');
            if (!wrapper) return;
            wrapper.addEventListener('wheel', (evt) => {
                if (evt.deltaY !== 0) {
                    evt.preventDefault();
                    wrapper.scrollLeft += evt.deltaY * 1.5;
                }
            }, { passive: false });
        }

        // 🎯 重新整理：只重取會員與請假 API，不覆蓋現有已排的 squads
        async function refreshMembersAndLeaves() {
            try {
                await Promise.all([
                    fetchClassesFromDB(),
                    fetchMembersFromDB(),
                    fetchLeavesFromDB()
                ]);

                renderMemberList();
                renderSquads();
                updateLeaveCount();
            } catch (err) {
                console.error("重新整理失敗:", err);
            }
        }

        async function fetchClassesFromDB() {
            try {
                const res = await fetch(`${BACKEND_API_URL}/api/admin/classes`);
                const result = await res.json();
                const filter = document.getElementById('job-filter');
                if (result.status === 'success' && result.classes) {
                    gameClasses = result.classes.map(c => typeof c === 'string' ? c : (c.className || c.class_name));
                    filter.innerHTML = '<option value="全部">全部職業</option>';
                    gameClasses.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c;
                        opt.textContent = c;
                        filter.appendChild(opt);
                    });
                }
            } catch (err) {
                console.warn('載入職業清單失敗');
            }
        }

        async function fetchMembersFromDB() {
            try {
                const res = await fetch(`${BACKEND_API_URL}/api/admin/members`);
                const result = await res.json();
                if (result.status === 'success' && result.members) {
                    masterMembers = result.members
                        .filter(m => m.guildRole !== '退會' && m.accountStatus === '已審核')
                        .map(m => ({
                            uid: m.lineUserId || m.uid || m.id,
                            name: m.gameNickname || m.name,
                            job: m.gameClass || m.job || '其他'
                        }));
                }
            } catch (err) {
                console.error('載入會員失敗:', err);
            }
        }

        async function fetchLeavesFromDB() {
            try {
                const res = await fetch(`${BACKEND_API_URL}/api/admin/leaves`);
                const result = await res.json();
                if (result.status === 'success' && result.leaves) {
                    leaveList = result.leaves.map(l => ({
                        id: l.id,
                        name: l.gameNickname,
                        job: l.gameClass,
                        date: l.leaveDate || l.date,
                        event: l.leaveEvent || l.event,
                        reason: l.leaveReason || l.reason,
                        isUrgent: l.isUrgent === 'Y' || l.isUrgent === '緊急'
                    }));
                }
            } catch (err) {
                console.error('載入請假紀錄失敗:', err);
            }
        }

        // 🎯 重新載入表單：真正向 Google 試算表抓取主戰名冊
        async function fetchMainRosterFromSheet(manualTrigger = true) {
            try {
                document.getElementById('total-assigned-badge').innerText = '載入表單中...';
                const res = await fetch(GOOGLE_SHEET_ROSTER_API);
                const result = await res.json();
                if (result.status === 'success' && result.squads && result.squads.length > 0) {
                    squads = result.squads;
                    initMasterOrder();
                    renderSquads();
                    renderMemberList();
                    if (manualTrigger) alert('✓ 已成功自 Google 試算表重新載入主戰名單！');
                } else {
                    if (manualTrigger) alert('無法抓取表單：' + (result.message || '無隊伍資料'));
                }
            } catch (err) {
                console.warn('無法連線試算表 Web App:', err);
                if (manualTrigger) alert('連線 Google 試算表失敗，請確認網路！');
            }
        }

        // 🎯 儲存覆蓋主戰名單：回寫後端資料庫並匯出陣容圖片
        async function saveAndOverwriteRoster() {
            const todayStr = new Date().toISOString().split('T')[0];
            const dataToSave = {
                date: todayStr,
                squads: JSON.parse(JSON.stringify(squads)),
                mergedGroups: JSON.parse(JSON.stringify(mergedGroups)),
                masterOrder: JSON.parse(JSON.stringify(masterOrder))
            };

            // 1. 同步存入後端資料庫
            try {
                await fetch(`${BACKEND_API_URL}/api/admin/roster/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSave)
                });
            } catch (err) {
                console.warn('後端資料庫儲存異常，以本地儲存為備援:', err);
            }

            // 本地快取
            localStorage.setItem('guild_roster_current', JSON.stringify(dataToSave));

            // 2. 自動執行圖片匯出
            exportToImage();
        }

        function getMemberJobInfo(name) {
            const found = masterMembers.find(m => m.name === name);
            if (found) {
                return { job: found.job, isUnknown: false };
            }
            return { job: '未綁定/改名', isUnknown: true };
        }

        function isAssigned(name) {
            return squads.some(s => s.members.includes(name));
        }

        function isLeave(name) {
            const todayStr = new Date().toISOString().split('T')[0];
            return leaveList.some(l => l.name === name && l.date === todayStr);
        }

        function renderMemberList() {
            const container = document.getElementById('member-list-container');
            const search = document.getElementById('search-input').value.trim();
            const filterJob = document.getElementById('job-filter').value;
            container.innerHTML = '';

            const availableMembers = masterMembers.filter(m => !isLeave(m.name));
            document.getElementById('available-count').innerText = availableMembers.length;

            const filtered = availableMembers.filter(m => {
                const matchSearch = m.name.includes(search);
                const matchJob = (filterJob === '全部') || (m.job === filterJob);
                return matchSearch && matchJob;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-xs text-gray-400 p-4 w-full text-center">無符合可排班成員</div>`;
                return;
            }

            filtered.forEach(m => {
                const assigned = isAssigned(m.name);
                const row = document.createElement('div');
                row.className = `flex items-center justify-between px-3 py-2 rounded-xl border text-xs transition bg-white ${assigned ? 'opacity-50 border-gray-200' : 'border-gray-200 shadow-xs hover:border-indigo-400'}`;
                
                let actionHtml = assigned ? 
                    `<span class="text-gray-400 font-bold bg-gray-100 px-2 py-0.5 rounded text-[11px]">已排</span>` :
                    `<button onclick="assignToFirstAvailable('${m.name}')" class="bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white font-bold px-3 py-1 rounded-md transition text-[11px]">指派</button>`;

                row.innerHTML = `
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="job-card-${m.job} px-2 py-0.5 rounded font-bold text-[10px] border shrink-0">${m.job}</span>
                        <span class="font-bold text-gray-800 truncate">${m.name}</span>
                    </div>
                    ${actionHtml}
                `;

                if (!assigned) {
                    row.draggable = true;
                    row.ondragstart = (e) => e.dataTransfer.setData('text/plain', m.name);
                }
                container.appendChild(row);
            });
        }

        function assignToFirstAvailable(name) {
            for (let squad of squads) {
                if (squad.members.length < 5) {
                    squad.members.push(name);
                    renderSquads();
                    renderMemberList();
                    return;
                }
            }
            alert('所有隊伍皆已達 5 人滿額！');
        }

        function initMasterOrder() {
            masterOrder = squads.map(s => ({ type: 'squad', id: s.id }));
        }

        function renderSquads() {
            const container = document.getElementById('squads-container');
            container.innerHTML = '';

            let totalAssigned = 0;
            let totalCapacity = squads.length * 5;

            masterOrder = masterOrder.filter(item => {
                if (item.type === 'squad') return squads.some(s => s.id === item.id);
                else if (item.type === 'group') return mergedGroups.some(g => g.name === item.groupName);
                return false;
            });

            squads.forEach(s => {
                const inGroup = mergedGroups.some(g => g.squadIds.includes(s.id));
                if (!inGroup && !masterOrder.some(item => item.type === 'squad' && item.id === s.id)) {
                    masterOrder.push({ type: 'squad', id: s.id });
                }
            });

            mergedGroups.forEach(g => {
                if (!masterOrder.some(item => item.type === 'group' && item.groupName === g.name)) {
                    masterOrder.push({ type: 'group', groupName: g.name });
                }
            });

            let currentRow = document.createElement('div');
            currentRow.className = "roster-grid-row";
            let rowItemCount = 0;

            function appendToRow(element, span = 1) {
                if (rowItemCount + span > 6) {
                    container.appendChild(currentRow);
                    currentRow = document.createElement('div');
                    currentRow.className = "roster-grid-row";
                    rowItemCount = 0;
                }
                element.style.gridColumn = `span ${span}`;
                currentRow.appendChild(element);
                rowItemCount += span;
            }

            masterOrder.forEach((item, index) => {
                if (item.type === 'squad') {
                    const squad = squads.find(s => s.id === item.id);
                    if (squad) {
                        const inGroup = mergedGroups.some(g => g.squadIds.includes(squad.id));
                        if (!inGroup) {
                            const cardDiv = document.createElement('div');
                            cardDiv.innerHTML = createSquadCardHtml(squad, index);
                            appendToRow(cardDiv.firstElementChild, 1);
                            totalAssigned += squad.members.length;
                        }
                    }
                } else if (item.type === 'group') {
                    const group = mergedGroups.find(g => g.name === item.groupName);
                    if (group) {
                        const spanCount = Math.min(group.squadIds.length, 6);
                        const groupDiv = document.createElement('div');
                        groupDiv.className = 'border-2 border-purple-400 bg-purple-50/20 rounded-xl p-2.5 flex flex-col gap-2.5';
                        
                        let groupHeader = `
                            <div class="flex justify-between items-center bg-purple-100 px-3 py-1.5 rounded-lg border border-purple-200 sort-hidden">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-xs font-black text-purple-900"><i class="fa-solid fa-object-group mr-1"></i> ${group.name}</span>
                                    <div class="flex gap-0.5 text-[10px]">
                                        <button onclick="moveMasterOrderTarget(${index}, 'first')" class="bg-white/90 hover:bg-white px-1 py-0.5 rounded text-purple-800 font-bold" title="置前">《</button>
                                        <button onclick="moveMasterOrder(${index}, -1)" class="bg-white/90 hover:bg-white px-1 py-0.5 rounded text-purple-800 font-bold" title="往前">〈</button>
                                        <button onclick="moveMasterOrder(${index}, 1)" class="bg-white/90 hover:bg-white px-1 py-0.5 rounded text-purple-800 font-bold" title="往後">〉</button>
                                        <button onclick="moveMasterOrderTarget(${index}, 'last')" class="bg-white/90 hover:bg-white px-1 py-0.5 rounded text-purple-800 font-bold" title="置後">》</button>
                                    </div>
                                </div>
                                <button onclick="removeMergedGroupByInstance('${group.name}')" class="text-purple-700 hover:text-red-600 text-xs font-bold"><i class="fa-solid fa-xmark"></i> 解除</button>
                            </div>
                            <div class="grid gap-2" style="grid-template-columns: repeat(${group.squadIds.length}, 215px);">
                        `;
                        
                        let squadGridHtml = '';
                        group.squadIds.forEach(sId => {
                            const squad = squads.find(s => s.id === sId);
                            if (squad) {
                                const tempCard = document.createElement('div');
                                tempCard.innerHTML = createSquadCardHtml(squad);
                                squadGridHtml += tempCard.innerHTML;
                                totalAssigned += squad.members.length;
                            }
                        });

                        groupDiv.innerHTML = groupHeader + squadGridHtml + `</div>`;
                        appendToRow(groupDiv, spanCount);
                    }
                }
            });

            if (rowItemCount > 0) {
                container.appendChild(currentRow);
            }

            document.getElementById('total-assigned-badge').innerText = `已配置: ${totalAssigned} / ${totalCapacity}`;
        }

        function createSquadCardHtml(squad) {
            let slotsHtml = '';
            for (let i = 0; i < 5; i++) {
                const member = squad.members[i];
                if (member) {
                    const info = getMemberJobInfo(member);
                    
                    if (info.isUnknown) {
                        slotsHtml += `
                            <div class="flex items-center justify-between job-card-unknown px-2 py-1.5 rounded-lg border text-xs font-bold shadow-2xs" title="名冊查無此暱稱（可能已改名或尚未綁定）">
                                <div class="flex items-center gap-1 min-w-0">
                                    <span class="text-amber-600 text-[11px]"><i class="fa-solid fa-triangle-exclamation"></i></span>
                                    <span class="truncate">${member}</span>
                                </div>
                                <div class="flex items-center gap-1 shrink-0 sort-hidden">
                                    <button onclick="promptReplaceMember(${squad.id}, ${i}, '${member}')" class="text-[10px] bg-amber-200/80 hover:bg-amber-300 text-amber-900 px-1.5 py-0.5 rounded font-bold" title="選取現任成員替換">替換</button>
                                    <button onclick="removeMemberFromSquad(${squad.id}, ${i})" class="opacity-70 hover:opacity-100 p-0.5 text-gray-500 hover:text-red-600"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            </div>
                        `;
                    } else {
                        slotsHtml += `
                            <div class="flex items-center justify-between job-card-${info.job} px-2.5 py-1.5 rounded-lg border text-xs font-bold shadow-2xs">
                                <span class="truncate pr-1">${member}</span>
                                <button onclick="removeMemberFromSquad(${squad.id}, ${i})" class="opacity-70 hover:opacity-100 p-0.5 shrink-0 sort-hidden"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `;
                    }
                } else {
                    slotsHtml += `
                        <div class="slot-card flex items-center justify-center bg-gray-50 border border-dashed border-gray-300 rounded-lg text-[11px] text-gray-400 py-1 sort-hidden"
                             ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToSquad(event, ${squad.id})">
                            + 空位
                        </div>
                    `;
                }
            }

            const inGroup = mergedGroups.some(g => g.squadIds.includes(squad.id));
            let sortButtonsHtml = '';
            if (!inGroup) {
                const mIndex = masterOrder.findIndex(item => item.type === 'squad' && item.id === squad.id);
                sortButtonsHtml = `
                    <div class="flex gap-0.5 text-[9px] sort-hidden">
                        <button onclick="moveMasterOrderTarget(${mIndex}, 'first')" class="bg-white hover:bg-gray-200 px-1 py-0.5 rounded font-bold text-gray-600" title="置前">《</button>
                        <button onclick="moveMasterOrder(${mIndex}, -1)" class="bg-white hover:bg-gray-200 px-1 py-0.5 rounded font-bold text-gray-600" title="往前">〈</button>
                        <button onclick="moveMasterOrder(${mIndex}, 1)" class="bg-white hover:bg-gray-200 px-1 py-0.5 rounded font-bold text-gray-600" title="往後">〉</button>
                        <button onclick="moveMasterOrderTarget(${mIndex}, 'last')" class="bg-white hover:bg-gray-200 px-1 py-0.5 rounded font-bold text-gray-600" title="置後">》</button>
                    </div>
                `;
            }

            return `
                <div class="bg-white border border-gray-300 rounded-xl shadow-xs overflow-hidden flex flex-col">
                    <div class="bg-gray-100 px-2.5 py-1.5 border-b border-gray-200 flex justify-between items-center">
                        <div class="flex items-center gap-1">
                            <input type="text" value="${squad.name}" onchange="updateSquadName(${squad.id}, this.value)" class="bg-transparent text-xs font-black text-gray-800 w-24 focus:outline-none focus:bg-white px-1 rounded">
                            ${sortButtonsHtml}
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] font-bold ${squad.members.length === 5 ? 'text-emerald-600' : 'text-amber-600'}">${squad.members.length}/5</span>
                            <button onclick="deleteSquad(${squad.id})" class="text-gray-400 hover:text-red-600 text-xs sort-hidden"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div class="p-2 flex flex-col gap-1.5 bg-gray-50/50"
                         ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToSquad(event, ${squad.id})">
                        ${slotsHtml}
                    </div>
                </div>
            `;
        }

        let replacingSquadContext = null;
        function promptReplaceMember(squadId, memberIndex, oldName) {
            replacingSquadContext = { squadId, memberIndex, oldName };
            openMemberPickerModal();
        }

        function moveMasterOrder(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= masterOrder.length) return;
            const temp = masterOrder[index];
            masterOrder[index] = masterOrder[newIndex];
            masterOrder[newIndex] = temp;
            renderSquads();
        }

        function moveMasterOrderTarget(index, target) {
            const item = masterOrder.splice(index, 1)[0];
            if (target === 'first') masterOrder.unshift(item);
            else if (target === 'last') masterOrder.push(item);
            renderSquads();
        }

        function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function removeDropStyle(e) { e.currentTarget.classList.remove('drag-over'); }
        function dropToSquad(e, squadId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const memberName = e.dataTransfer.getData('text/plain');
            if (!memberName) return;
            const squad = squads.find(s => s.id === squadId);
            if (squad && squad.members.length < 5 && !isAssigned(memberName)) {
                squad.members.push(memberName);
                renderSquads();
                renderMemberList();
            } else if (squad && squad.members.length >= 5) {
                alert('該隊伍已滿 5 人！');
            }
        }

        function removeMemberFromSquad(squadId, memberIndex) {
            const squad = squads.find(s => s.id === squadId);
            if (squad) {
                squad.members.splice(memberIndex, 1);
                renderSquads();
                renderMemberList();
            }
        }

        function updateSquadName(squadId, newName) {
            const squad = squads.find(s => s.id === squadId);
            if (squad) squad.name = newName;
        }

        function addSquad() {
            const newId = squads.length > 0 ? Math.max(...squads.map(s => s.id)) + 1 : 1;
            const newSquad = { id: newId, name: `隊伍 ${newId}`, members: [] };
            squads.push(newSquad);
            masterOrder.push({ type: 'squad', id: newId });
            renderSquads();
        }

        function deleteSquad(squadId) {
            squads = squads.filter(s => s.id !== squadId);
            mergedGroups.forEach(g => g.squadIds = g.squadIds.filter(id => id !== squadId));
            mergedGroups = mergedGroups.filter(g => g.squadIds.length > 0);
            renderSquads();
            renderMemberList();
        }

        function resetRoster() {
            if (confirm('確定清空現有出戰安排嗎？')) {
                squads.forEach(s => s.members = []);
                mergedGroups = [];
                initMasterOrder();
                renderSquads();
                renderMemberList();
            }
        }

        function openMemberPickerModal() {
            document.getElementById('picker-search-input').value = '';
            document.getElementById('member-picker-modal').classList.remove('hidden');
            renderPickerMemberList();
        }

        function closeMemberPickerModal() {
            document.getElementById('member-picker-modal').classList.add('hidden');
            replacingSquadContext = null;
        }

        function renderPickerMemberList() {
            const container = document.getElementById('picker-member-list-ui');
            const search = document.getElementById('picker-search-input').value.trim().toLowerCase();
            container.innerHTML = '';

            const filtered = masterMembers.filter(m => {
                return m.name.toLowerCase().includes(search) || m.job.toLowerCase().includes(search);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-xs text-gray-400 p-4 text-center">查無相符成員</div>`;
                return;
            }

            filtered.forEach(m => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-2 rounded-xl border border-gray-200 bg-white hover:border-amber-400 hover:bg-amber-50/50 cursor-pointer transition text-xs";
                item.onclick = () => selectMemberFromPicker(m);
                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="job-card-${m.job} px-2 py-0.5 rounded font-bold text-[10px] border">${m.job}</span>
                        <span class="font-bold text-gray-800">${m.name}</span>
                    </div>
                    <span class="text-amber-600 font-bold text-[11px]"><i class="fa-solid fa-check"></i> 選擇</span>
                `;
                container.appendChild(item);
            });
        }

        function selectMemberFromPicker(member) {
            if (replacingSquadContext) {
                const { squadId, memberIndex } = replacingSquadContext;
                const squad = squads.find(s => s.id === squadId);
                if (squad) {
                    squad.members[memberIndex] = member.name;
                    renderSquads();
                    renderMemberList();
                }
                closeMemberPickerModal();
                return;
            }

            document.getElementById('leave-selected-uid').value = member.uid;
            document.getElementById('leave-selected-name').value = member.name;
            document.getElementById('leave-selected-job').value = member.job;
            
            const display = document.getElementById('selected-member-display');
            display.innerHTML = `
                <span class="job-card-${member.job} px-1.5 py-0.5 rounded text-[10px] border mr-1 font-bold">${member.job}</span>
                <span class="text-gray-900 font-bold">${member.name}</span>
            `;
            closeMemberPickerModal();
        }

        function openLeaveModal() { 
            document.getElementById('leave-modal').classList.remove('hidden'); 
            renderLeaveListUI(); 
        }

        function closeLeaveModal() { 
            document.getElementById('leave-modal').classList.add('hidden'); 
            updateLeaveCount(); 
            renderMemberList();
        }

        async function addLeavePerson() {
            const targetUid = document.getElementById('leave-selected-uid').value;
            const gameNickname = document.getElementById('leave-selected-name').value;
            const gameClass = document.getElementById('leave-selected-job').value;
            const leaveDate = document.getElementById('leave-date-input').value;
            const leaveEvent = document.getElementById('leave-event-input').value.trim();

            if (!gameNickname || !leaveDate || !leaveEvent) {
                alert('請先開窗點選請假成員，並完整設定日期與活動！');
                return;
            }

            try {
                const res = await fetch(`${BACKEND_API_URL}/api/leaves`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        leaveDate,
                        leaveEvent,
                        targetUid: targetUid || 'MANUAL_APPLY',
                        gameNickname,
                        gameClass,
                        leaveReason: '指揮系統手動排程請假',
                        isUrgent: 'N'
                    })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    await fetchLeavesFromDB();
                    renderLeaveListUI();
                    renderMemberList();
                    updateLeaveCount();
                    
                    document.getElementById('leave-selected-uid').value = '';
                    document.getElementById('leave-selected-name').value = '';
                    document.getElementById('leave-selected-job').value = '';
                    document.getElementById('selected-member-display').innerHTML = '<span class="text-gray-400">點此開窗搜尋公會成員...</span>';
                    alert('✓ 已成功寫入請假資料庫！');
                } else {
                    alert('新增失敗: ' + (result.message || '系統異常'));
                }
            } catch (err) {
                console.error(err);
                alert('伺服器連線失敗');
            }
        }

        async function deleteLeavePerson(leaveId) {
            if (!confirm('確定取消並刪除此請假記錄？')) return;
            try {
                const res = await fetch(`${BACKEND_API_URL}/api/admin/leaves/${leaveId}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.status === 'success') {
                    await fetchLeavesFromDB();
                    renderLeaveListUI();
                    renderMemberList();
                    updateLeaveCount();
                } else {
                    alert('取消失敗: ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('連線失敗');
            }
        }

        function renderLeaveListUI() {
            const container = document.getElementById('leave-list-ui');
            container.innerHTML = '';
            const todayStr = new Date().toISOString().split('T')[0];

            if (leaveList.length === 0) {
                container.innerHTML = `<div class="text-xs text-gray-400 text-center py-3">資料庫目前無請假紀錄</div>`;
                return;
            }

            leaveList.forEach((l) => {
                const isCurrent = (l.date === todayStr);
                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-2 rounded-xl text-xs border ${
                    isCurrent ? 'bg-amber-50 border-amber-300 font-bold' : 'bg-white border-gray-200'
                }`;

                item.innerHTML = `
                    <div class="flex items-center gap-1.5 min-w-0">
                        <span class="job-card-${l.job} px-1.5 py-0.5 rounded font-bold text-[10px] border shrink-0">${l.job}</span>
                        <span class="font-bold text-gray-800 truncate">${l.name}</span>
                        <span class="text-gray-400 text-[10px] shrink-0">${l.date} ${isCurrent ? '(當天)' : ''}</span>
                    </div>
                    <button onclick="deleteLeavePerson('${l.id}')" class="text-gray-400 hover:text-red-600 p-1 shrink-0"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(item);
            });
        }

        function updateLeaveCount() {
            const todayStr = new Date().toISOString().split('T')[0];
            const count = leaveList.filter(l => l.date === todayStr).length;
            document.getElementById('leave-count').innerText = count;
        }

        function openMergeModal() { document.getElementById('merge-modal').classList.remove('hidden'); renderMergeCheckboxes(); renderExistingMergedGroups(); }
        function closeMergeModal() { document.getElementById('merge-modal').classList.add('hidden'); renderSquads(); }

        function renderMergeCheckboxes() {
            const container = document.getElementById('merge-squad-checkboxes');
            container.innerHTML = '';
            const assignedSquadIds = new Set();
            mergedGroups.forEach(g => g.squadIds.forEach(id => assignedSquadIds.add(id)));

            squads.forEach(s => {
                if (!assignedSquadIds.has(s.id)) {
                    const label = document.createElement('label');
                    label.className = 'flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer';
                    label.innerHTML = `<input type="checkbox" name="merge-squad-cb" value="${s.id}" class="rounded text-purple-600 focus:ring-purple-500"> ${s.name}`;
                    container.appendChild(label);
                }
            });
        }

        function createMergedGroup() {
            const groupName = document.getElementById('merge-group-name').value.trim();
            const checkboxes = document.querySelectorAll('input[name="merge-squad-cb"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (!groupName || selectedIds.length === 0) { alert('請填寫團隊名稱並勾選小隊！'); return; }
            
            mergedGroups.push({ name: groupName, squadIds: selectedIds });
            masterOrder.push({ type: 'group', groupName: groupName });
            
            document.getElementById('merge-group-name').value = '';
            renderMergeCheckboxes();
            renderExistingMergedGroups();
        }

        function removeMergedGroupByInstance(groupName) {
            mergedGroups = mergedGroups.filter(g => g.name !== groupName);
            renderSquads();
        }

        function removeMergedGroup(index) {
            mergedGroups.splice(index, 1);
            renderMergeCheckboxes();
            renderExistingMergedGroups();
            renderSquads();
        }

        function renderExistingMergedGroups() {
            const container = document.getElementById('existing-merged-groups-list');
            container.innerHTML = '';
            if (mergedGroups.length === 0) { container.innerHTML = `<span class="text-xs text-gray-400">目前無合併團隊</span>`; return; }
            mergedGroups.forEach((g, idx) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-2 bg-purple-50 border border-purple-200 rounded-lg text-xs font-bold text-purple-900';
                div.innerHTML = `
                    <span>${g.name} (含 ${g.squadIds.length} 個隊伍)</span>
                    <button onclick="removeMergedGroup(${idx})" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(div);
            });
        }

        // 匯出完整戰況圖片 (乾淨展開 1450px)
        function exportToImage() {
            const captureElement = document.getElementById('export-capture-target');
            document.querySelectorAll('.sort-hidden').forEach(el => el.style.display = 'none');
            
            const originalWidth = captureElement.style.width;
            const originalMaxWidth = captureElement.style.maxWidth;
            captureElement.style.width = '1450px';
            captureElement.style.maxWidth = 'none';

            html2canvas(captureElement, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff',
                windowWidth: 1500
            }).then(canvas => {
                const todayStr = new Date().toISOString().split('T')[0];
                const link = document.createElement('a');
                link.download = `主戰名單_${todayStr}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                captureElement.style.width = originalWidth;
                captureElement.style.maxWidth = originalMaxWidth;
                document.querySelectorAll('.sort-hidden').forEach(el => el.style.display = '');
                alert('✓ 主戰名單已儲存並成功匯出圖片！');
            }).catch(err => {
                console.error(err);
                captureElement.style.width = originalWidth;
                captureElement.style.maxWidth = originalMaxWidth;
                document.querySelectorAll('.sort-hidden').forEach(el => el.style.display = '');
                alert('儲存成功，但圖片產生失敗，請再試一次。');
            });
        }
    </script>
</body>
</html>
