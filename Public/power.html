<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>公會成員裝評調查</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      background-color: #F0F7FF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-lg border border-sky-100 p-6 space-y-5">
    
    <!-- 標題與簡介 (比照後台管理中心風格) -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">公會成員裝評調查</h1>
      <p class="text-xs text-slate-500">請以誠實原則填寫目前最新裝備評分，以利公會聯賽排名單</p>
    </div>

    <!-- LINE 登入身分橫條 -->
    <div class="flex items-center justify-between bg-sky-50/70 border border-sky-100 rounded-2xl p-3">
      <div class="flex items-center space-x-3">
        <img id="userAvatar" src="https://placehold.co/100x100?text=LINE" class="w-10 h-10 rounded-full border-2 border-white shadow-sm object-cover">
        <div>
          <div class="text-xs text-slate-400">當前 LINE 身分</div>
          <div id="userName" class="text-sm font-bold text-slate-800">載入中...</div>
        </div>
      </div>
      <span class="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-full">已就緒</span>
    </div>

    <!-- 表單主要區塊 -->
    <form id="powerForm" class="space-y-4" onsubmit="return false;">

      <!-- 情況 1：已自動匹配到身分 (預設隱藏) -->
      <div id="autoMatchedNotice" class="hidden bg-emerald-50 border border-emerald-200 rounded-2xl p-3.5 space-y-1">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-emerald-800 flex items-center">
            ✓ 已自動識別您的角色
          </span>
          <button type="button" id="btnSwitchManual" class="text-[11px] text-sky-600 hover:underline">
            非本人？切換角色
          </button>
        </div>
        <div class="text-sm font-black text-slate-900" id="matchedRoleText">-</div>
      </div>

      <!-- 情況 2：查無此人 / 手動搜尋角色 (預設顯示) -->
      <div id="searchSelectorArea" class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-600">認領您的遊戲角色</label>
        <div class="relative">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="輸入遊戲角色名稱搜尋..." 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition"
          >
          <div id="dropdownList" class="hidden absolute z-20 left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-xl"></div>
        </div>
        <p class="text-[11px] text-slate-400">若系統未自動帶出，請在此搜尋您的遊戲暱稱。</p>
      </div>

      <!-- 隱藏 input 記錄選定的角色與職業 -->
      <input type="hidden" id="selectedGameName">
      <input type="hidden" id="selectedGameClass">

      <!-- 裝評輸入欄位 -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-600">目前最新裝評</label>
        <div class="relative">
          <input 
            type="number" 
            id="powerInput" 
            required 
            placeholder="例如：121999" 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-base font-bold text-slate-800 focus:outline-none focus:border-sky-500 focus:bg-white transition"
          >
          <span class="absolute right-3.5 top-2.5 text-xs font-bold text-slate-400">分</span>
        </div>
        <!-- 萬位數友善換算提示 -->
        <div id="powerReadable" class="text-[11px] font-bold text-sky-600 h-4"></div>
      </div>

      <!-- 確認送出按鈕 -->
      <button 
        type="button" 
        id="btnSubmit" 
        class="w-full bg-sky-500 hover:bg-sky-600 active:scale-[0.99] text-white font-bold py-3 rounded-xl shadow-md shadow-sky-200 text-sm transition"
      >
        確認送出
      </button>

    </form>
  </div>

  <script>
    // ⚙️ 請替換為您在 LINE Developers 申請的新 LIFF ID
    const MY_LIFF_ID = "2012419937-mEUF9Qih";

    let currentProfile = null;
    let allMembers = [];

    

    // 初始化 LIFF
    async function initLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        currentProfile = await liff.getProfile();
        document.getElementById('userName').textContent = currentProfile.displayName || "LINE 成員";
        if (currentProfile.pictureUrl) {
          document.getElementById('userAvatar').src = currentProfile.pictureUrl;
        }

        // 1. 先載入所有名冊供備用搜尋
        await loadAllMembers();

        // 2. 自動以 LINE 暱稱比對資料庫
        await autoMatchMember(currentProfile.displayName);

      } catch (err) {
        console.warn('LIFF 初始化失敗或處於非 LINE 測試環境:', err);
        // 本地測試模擬
        currentProfile = { userId: "TEST_USER_999", displayName: "克蘿伊" };
        document.getElementById('userName').textContent = currentProfile.displayName + " (測試環境)";
        await loadAllMembers();
        await autoMatchMember(currentProfile.displayName);
      }
    }

    // 取得現有名單供手動搜尋
    async function loadAllMembers() {
      try {
        const res = await fetch('/api/admin/members');
        const data = await res.json();
        if (data.status === 'success') {
          allMembers = data.members.filter(m => m.guildRole !== '退會');
        }
      } catch (e) {
        console.error('名冊載入異常:', e);
      }
    }

    // 依 LINE 暱稱自動匹配
    async function autoMatchMember(displayName) {
      try {
        const res = await fetch(`/api/members/match-by-line-name?name=${encodeURIComponent(displayName)}`);
        const data = await res.json();

        if (data.status === 'matched') {
          selectMember(data.gameNickname, data.gameClass, data.combatPower, true);
        } else {
          // 找不到人或多筆同名：開啟搜尋框
          showManualSearch();
        }
      } catch (err) {
        showManualSearch();
      }
    }

    // 選取角色
    function selectMember(nick, job, existingPower, isAuto = false) {
      document.getElementById('selectedGameName').value = nick;
      document.getElementById('selectedGameClass').value = job;
      document.getElementById('matchedRoleText').textContent = `${nick} ${job ? `(${job})` : ''}`;

      document.getElementById('autoMatchedNotice').classList.remove('hidden');
      document.getElementById('searchSelectorArea').classList.add('hidden');

      if (existingPower && existingPower > 0) {
        document.getElementById('powerInput').value = existingPower;
        formatPowerReadable(existingPower);
      }
    }

    function showManualSearch() {
      document.getElementById('autoMatchedNotice').classList.add('hidden');
      document.getElementById('searchSelectorArea').classList.remove('hidden');
    }

    document.getElementById('btnSwitchManual').addEventListener('click', showManualSearch);

    // 搜尋即時過濾下拉
    const searchInput = document.getElementById('searchInput');
    const dropdownList = document.getElementById('dropdownList');

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.trim().toLowerCase();
      if (!val) {
        dropdownList.classList.add('hidden');
        return;
      }

      const matches = allMembers.filter(m => 
        (m.gameNickname && m.gameNickname.toLowerCase().includes(val)) ||
        (m.lineDisplayName && m.lineDisplayName.toLowerCase().includes(val))
      );

      if (matches.length === 0) {
        dropdownList.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">查無匹配角色</div>`;
      } else {
        dropdownList.innerHTML = matches.map(m => `
  <div class="p-2.5 hover:bg-sky-50 cursor-pointer flex items-center justify-between border-b border-slate-100 last:border-0"
       onclick="onSelectFromSearch('${m.gameNickname}', '${m.gameClass}', ${m.combat_power || 0})">
    <span class="text-sm font-bold text-slate-800">
      ${m.gameNickname} <span class="text-xs font-normal text-slate-500">(${m.gameClass || '未填寫'})</span>
    </span>
  </div>
`).join('');
      }
      dropdownList.classList.remove('hidden');
    });

    window.onSelectFromSearch = function(nick, job, power) {
      selectMember(nick, job, power, false);
      dropdownList.classList.add('hidden');
      searchInput.value = '';
    };

    // 裝評中文萬位提示
    const powerInput = document.getElementById('powerInput');
    const powerReadable = document.getElementById('powerReadable');

    function formatPowerReadable(val) {
      const num = parseInt(val, 10);
      if (!isNaN(num) && num > 0) {
        const wan = (num / 10000).toFixed(1);
        powerReadable.textContent = `≈ ${wan} 萬 (${num.toLocaleString()} 分)`;
      } else {
        powerReadable.textContent = '';
      }
    }

    powerInput.addEventListener('input', (e) => {
      formatPowerReadable(e.target.value);
    });

    // 確認送出
    document.getElementById('btnSubmit').addEventListener('click', async () => {
      const gameNickname = document.getElementById('selectedGameName').value;
      const combatPower = document.getElementById('powerInput').value;

      if (!gameNickname) {
        alert('請先選擇或認領您的遊戲角色！');
        return;
      }
      if (!combatPower || parseInt(combatPower, 10) <= 0) {
        alert('請輸入正確的裝評數值！');
        return;
      }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = '送出中...';

      try {
        const payload = {
          lineUserId: currentProfile ? currentProfile.userId : 'UNKNOWN_UID',
          lineDisplayName: currentProfile ? currentProfile.displayName : '',
          gameNickname: gameNickname,
          combatPower: parseInt(combatPower, 10)
        };

        const res = await fetch('/api/members/update-power-uid', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.status === 'success') {
          alert(`【${gameNickname}】裝評 ${combatPower} 回報完成！感謝您的配合。`);
          if (liff.isInClient()) {
            liff.closeWindow();
          }
        } else {
          alert(data.message || '送出失敗，請洽幹部！');
        }
      } catch (err) {
        alert('網路異常，請重試！');
      } finally {
        btn.disabled = false;
        btn.textContent = '確認送出';
      }
    });

    initLiff();
  </script>
</body>
</html>
